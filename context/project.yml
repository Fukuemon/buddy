version: 2

hosting: github

docs:
  design: docs/design
  adr: docs/adr
  spec: docs/specs

process:
  defaults:
    processes: [requirements, design, implementation, verification-design, verification, integration, release]
    reflect_at: design
    breakdown_at: design
    review: [requirements, design, integration]
  # 要求の種別。要求のテンプレートの「種別」の選択肢と同じ名前にする
  presets:
    feature:
      processes: [requirements, design, implementation, verification-design, verification, integration, release]
      reflect_at: design
      breakdown_at: design
      review: [requirements, design, integration]
      tasks: [design, impl, verify, docs]
    screen:
      processes: [requirements, design, implementation, verification-design, verification, integration, release]
      reflect_at: design
      breakdown_at: design
      review: [requirements, design, integration]
      tasks: [design, impl, verify]
    design-system:
      processes: [requirements, design, implementation, integration]
      reflect_at: design
      breakdown_at: design
      review: [requirements, design, integration]
      tasks: [design, impl, docs]
    bug:
      processes: [implementation, verification, integration]
      reflect_at: none
      breakdown_at: none
      review: [integration]
      tasks: []
    refactoring:
      processes: [design, implementation, verification, integration]
      reflect_at: design
      breakdown_at: design
      review: [design, integration]
      tasks: [impl]
    maintenance:
      processes: [implementation, integration]
      reflect_at: none
      breakdown_at: none
      review: [integration]
      tasks: []
    docs:
      processes: [implementation, integration]
      reflect_at: none
      breakdown_at: none
      review: [integration]
      tasks: []
    prototype:
      processes: [design]
      reflect_at: none
      breakdown_at: none
      review: [design]
      tasks: []
  additional: []

e2e:
  dir: packages/e2e

screens:
  dir: docs/screens
  tokens_css: docs/screens/_common/tokens.css
  catalog_url: https://buddy-docs.emon-apps.workers.dev/storybook/
  e2e_dir: packages/e2e/tests

# パッケージ design-system が読む。tokens_css と catalog_url は、screens の同じ名前のキーと同じ値にする。片方を変えたら、もう片方も直す
design_system:
  tokens_css: docs/screens/_common/tokens.css
  catalog_url: https://buddy-docs.emon-apps.workers.dev/storybook/

# パッケージ docs-site が読む。scripts/build-docs-site.mjs が、parts を並べた順に apps/docs-site/public/ のサブパスへ写す
# catalog の subpath は storybook のままにする。文書のリンク、catalog_url、公開した URL がこのサブパスを指す
docs_site:
  parts:
    - path: site
      subpath: ""
      build: "uv run zensical build --clean"
    - path: apps/web/storybook-static
      subpath: storybook
      build: "pnpm --filter @buddy/web build-storybook"
    # serve.json と .keep は、Liam ERD の CLI がローカルの配信のために置くもので、Worker では使わない
    - path: erd
      subpath: erd
      build: "pnpm build:erd"
      exclude: [serve.json, .keep]
  tokens_css: docs/screens/_common/tokens.css
