# git hooks。有効化: pnpm install (prepare が lefthook install を実行する)

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    textlint:
      glob: "*.md"
      run: pnpm exec textlint {staged_files}
    design:
      glob: "{apps/web/src,packages/ui/src}/**/*.{ts,tsx,mdx,css}"
      run: pnpm check:design
    openapi:
      glob: "{services/*/openapi.yaml,redocly.yaml,.redocly.lint-ignore.yaml}"
      run: pnpm lint:openapi
