version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - revive
  settings:
    # 依存の向きの規則は context/codebase.md の Dependency Rules にある。テストのファイルは対象の外にする。
    depguard:
      rules:
        leaves:
          files:
            - "**/internal/record/**"
            - "**/internal/civil/**"
            - "**/internal/servicerule/**"
            - "!$test"
          deny:
            - pkg: github.com/Fukuemon/buddy/services/receipt/internal/csvio
              desc: 照合の API は record、civil、servicerule を末端に、読み込み、正規化、対の作成、判定、check、データソース、HTTP の順にだけ import する
