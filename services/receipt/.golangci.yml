version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Fukuemon/buddy/apps/receipt-api
