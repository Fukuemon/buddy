version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - revive
  settings:
    # 依存の向きの規則は context/codebase.md の Dependency Rules にある。テストのファイルは対象の外にする。
    depguard:
      rules:
        features-organization:
          files:
            - "**/internal/features/organization/**"
            - "!$test"
          deny:
            - pkg: github.com/Fukuemon/buddy/services/schedule/internal/features/staff
              desc: 機能のパッケージは organization、staff、servicecode、patient、visit、schedule、scheduleview、calendar、calendarimport、calendarsync、calendarexport の順にだけ import する
            - pkg: github.com/Fukuemon/buddy/services/schedule/internal/features/servicecode
              desc: 機能のパッケージは organization、staff、servicecode、patient、visit、schedule、scheduleview、calendar、calendarimport、calendarsync、calendarexport の順にだけ import する
