              desc: httpapi から postgres を import するのはテストのファイルだけにする
        config:
          files:
            - "**/internal/config/**"
            - "!$test"
          deny:
            - pkg: github.com/Fukuemon/buddy/services/schedule/internal/postgres
              desc: config は DB のアダプタを import しない。cmd が値をアダプタの設定にコピーする
        inmem:
          files:
            - "$all"
            - "!**/internal/inmem/**"
            - "!$test"
          deny:
            - pkg: github.com/Fukuemon/buddy/services/schedule/internal/inmem
              desc: inmem を import するのはテストのファイルだけにする
    revive:
