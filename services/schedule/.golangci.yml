        - name: package-comments
  exclusions:
    generated: lax
    rules:
      # テストの接続の設定は、使い捨てのコンテナの値である。
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Fukuemon/buddy/services/schedule
