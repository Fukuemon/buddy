openapi: 3.0.3
info:
  title: buddy schedule API
  version: 0.1.0
  description: |
    訪問看護の事業所の予定を管理する API。

    - ID は 26 文字の ULID である。
    - 値がない項目は、項目を省かず null で返す。
    - 日付は YYYY-MM-DD、時刻は HH:MM である。
    - エラーは Error の形で返す。`code` は invalid_input、unauthenticated、forbidden、not_found、conflict、internal と、
      外部のカレンダーの操作の calendar_unreadable、calendar_unavailable、calendar_not_configured と、
      409 の原因を分ける calendar_taken、calendar_already_linked、staff_has_calendar、import_running、import_preview_changed、export_not_in_review、
      google_primary、staff_has_assignments、patient_has_schedules と、
      予定の正本の切り替えの cutover_open、cutover_not_google_primary、cutover_sync_not_ready、cutover_not_open、cutover_incomplete と、
      google_primary の事業所で Google カレンダーに予定を書く calendar_not_linked、google_write_pending、google_event_changed、google_event_not_found、
      google_calendar_unwritable、google_event_rejected、google_write_unknown、google_unavailable のいずれかである。
    - `/v1` は全て、Hydra が発行した access token（JWT）を `Authorization: Bearer` で求める。
      トークンがないか検証に失敗したときは 401 を、トークンの組織と職員の事業所が、パスの指す事業所と違うときは 403 を返す。
    - 読めないクエリ（例は `;` を含むもの）は 400 を返す。
security:
  - bearerAuth: []
servers:
  # main の checkout のローカル環境の compose の schedule（portless のホスト名）
  - url: https://schedule.buddy.localhost
tags:
  - name: health
    description: 死活と準備の確認
  - name: organization
    description: 事業所、部署、チーム、役職、権限
  - name: staff
    description: 職員
  - name: patient
    description: 利用者
  - name: visit
    description: 訪問の情報のマスタ
  - name: schedule
    description: 予定（単発、繰り返し、キャンセル）
  - name: calendar
    description: 外部のカレンダー（Google カレンダー）の結び付けと、予定の取り込み

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: プロセスがレスポンスを返せるかを返す
      description: 依存先を確認しない。
      security: []
      responses:
        "200":
          description: レスポンスを返せる
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: リクエストを受けられるかを返す
      description: DB に届けば 200、届かなければ 503 を返す。
      security: []
      responses:
        "200":
          description: リクエストを受けられる
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: DB に届かない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/facilities/{facility_id}:
    get:
      tags: [organization]
      operationId: getFacility
      summary: 事業所を取得する
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 事業所
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facility" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/departments:
    get:
      tags: [organization]
      operationId: listDepartments
      summary: 事業所の部署を一覧する
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 事業所の部署。名前の順
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [organization]
      operationId: createDepartment
      summary: 部署を作る
      description: |
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "201":
          description: 作った部署
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 同じ事業所に同じ名前の部署がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "部署 看護部 はこの事業所にすでにあります" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/departments/{department_id}:
    get:
      tags: [organization]
      operationId: getDepartment
      summary: 部署を取得する
      parameters:
        - { name: department_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 部署
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [organization]
      operationId: updateDepartment
      summary: 部署の名前を変える
      description: |
        部署の名前を本文の値に置き換える。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: department_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: 変えた部署
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 同じ事業所にほかの同じ名前の部署がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "部署 看護部 はこの事業所にすでにあります" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/teams:
    get:
      tags: [organization]
      operationId: listTeams
      summary: 事業所のチームを一覧する
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 事業所のチーム。名前の順
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [organization]
      operationId: createTeam
      summary: チームを作る
      description: |
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
        color を省くと、事業所のチームが使っているチームが最も少ない色を、同じ数なら TeamColor の並びの先の色を入れる。
        事業所で使われていない色があれば、その先頭になる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                color: { $ref: "#/components/schemas/TeamColor" }
      responses:
        "201":
          description: 作ったチーム
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 同じ事業所に同じ名前のチームがある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "チーム 訪問看護 はこの事業所にすでにあります" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/teams/{team_id}:
    get:
      tags: [organization]
      operationId: getTeam
      summary: チームを取得する
      parameters:
        - { name: team_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: チーム
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [organization]
      operationId: updateTeam
      summary: チームの名前と色を変える
      description: |
        チームの名前と色を本文の値に置き換える。部分の更新は持たない。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: team_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                color: { $ref: "#/components/schemas/TeamColor" }
      responses:
        "200":
          description: 変えたチーム
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 同じ事業所にほかの同じ名前のチームがある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "チーム 訪問看護 はこの事業所にすでにあります" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/positions:
    get:
      tags: [organization]
      operationId: listPositions
      summary: 事業所の役職を一覧する
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 事業所の役職。名前の順
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Position" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [organization]
      operationId: createPosition
      summary: 役職を作る
      description: 職員の管理の権限（staff.manage）を持つ職員だけが呼べる。役職のデフォルトの権限を職員に配れるためである。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                policy_ids:
                  type: array
                  description: 役職の職員にデフォルトで与える権限。対象の職員を指定する権限（schedule.user.*）はデフォルトにできない
                  items: { $ref: "#/components/schemas/ID" }
      responses:
        "201":
          description: 作った役職
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 同じ事業所に同じ名前の役職がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "役職 チームリーダー はこの事業所にすでにあります" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/positions/{position_id}:
    get:
      tags: [organization]
      operationId: getPosition
      summary: 役職を取得する
      parameters:
        - { name: position_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 役職
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/policies:
    get:
      tags: [organization]
      operationId: listPolicies
      summary: 権限を一覧する
      responses:
        "200":
          description: すべての権限。名前の順
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/policies/{policy_id}:
    get:
      tags: [organization]
      operationId: getPolicy
      summary: 権限を取得する
      parameters:
        - { name: policy_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/users:
    get:
      tags: [staff]
      operationId: listUsers
      summary: 事業所の職員を一覧する
      parameters:
        - $ref: "#/components/parameters/FacilityID"
        - { name: username, in: query, description: 名前で一致させる, schema: { type: string } }
        - { name: position, in: query, description: 役職の名前で一致させる, schema: { type: string } }
        - { name: department, in: query, description: 部署の名前で一致させる, schema: { type: string } }
        - { name: team, in: query, description: チームの名前で一致させる, schema: { type: string } }
        - name: sort_field
          in: query
          description: 省くと updated_at の降順
          schema: { type: string, enum: [username, created_at, updated_at] }
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: 事業所の職員
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Staff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [staff]
      operationId: createUser
      summary: 職員を作る
      description: |
        職員を作り、役職のデフォルトの権限を与える。部署、チーム、役職は同じ事業所のものに限る。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
        ID ブローカーにも職員を登録し、ブローカーが発行した職員の ID を sub に入れる。登録した職員は、メールでログインできる。
        ブローカーの職員は、職員を書き終えてからログインできるようにする。ブローカーに登録した後に失敗したときは、同じ本文で送り直してよい。
        職員のメールは、全ての事業所で一意である。
        visits を省くと、訪問する職員として登録する。役職からは決めない。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, department_id, team_id, position_id]
              properties:
                username: { type: string, minLength: 1, maxLength: 128 }
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 320
                  description: 小文字にそろえて保存し、レスポンスでも小文字で返す。大文字と小文字だけが違うメールは、同じメールとみなす
                phone_number:
                  type: string
                  nullable: true
                  maxLength: 12
                  description: 11 桁以内の数字。先頭の + は省いてよい
                department_id: { $ref: "#/components/schemas/ID" }
                team_id: { $ref: "#/components/schemas/ID" }
                position_id: { $ref: "#/components/schemas/ID" }
                visits:
                  type: boolean
                  default: true
                  description: 訪問するか。false の職員は、予定のカレンダーの職員の列と、予定と担当の候補に出ない
      responses:
        "201":
          description: 作った職員
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 同じ事業所に同じメールの職員がいるか、同じメールの職員が止められているか、そのメールの職員を登録できない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "メール staff@example.com の職員はこの事業所にすでにいます" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}:
    get:
      tags: [staff]
      operationId: getUser
      summary: 職員を取得する
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [staff]
      operationId: updateUser
      summary: 職員の名前、電話番号、部署、チーム、訪問するかを変える
      description: |
        職員の名前、電話番号、部署、チーム、訪問するかを本文の値に置き換える。部分の更新は持たず、phone_number を省くか null にすると電話番号を消す。
        部署とチームは、職員と同じ事業所のものに限る。メールは ID ブローカーが持つので変えない。
        チームを変えると、チームを対象にする職員の権限のうち、古いチームを指す対象を新しいチームに移す。ほかのチームの対象は残す。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。休職の職員は変えられ、退職した職員は変えられない。
        訪問する職員を訪問しない職員に変えるときは、その日以降の予定、繰り返しの予定、担当の利用者が残れば、書かずに 409（staff_has_assignments）で
        残る一覧を返す。一覧の範囲は、退職と同じである。訪問しない職員を訪問する職員に戻すときは確認しない。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, department_id, team_id, visits]
              properties:
                username: { type: string, minLength: 1, maxLength: 128 }
                phone_number:
                  type: string
                  nullable: true
                  maxLength: 12
                  description: 11 桁以内の数字。先頭の + は省いてよい。省くか null なら電話番号を消す
                department_id: { $ref: "#/components/schemas/ID" }
                team_id: { $ref: "#/components/schemas/ID" }
                visits:
                  type: boolean
                  description: 訪問するか。false の職員は、予定のカレンダーの職員の列と、予定と担当の候補に出ない
      responses:
        "200":
          description: 変えた職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            退職した職員を変えようとした（conflict）か、その日以降の予定か担当の利用者が残る職員を訪問しない職員に変えようとした
            （staff_has_assignments。assignments に残る一覧がある）。職員は変わらない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetireConflict" }
              example:
                code: staff_has_assignments
                message: "予定か担当の利用者が残る職員は、訪問しない職員にできません。別の職員に割り振り直してください"
                assignments:
                  schedules: [{ id: 01M3TC5H00QV17BC0J9V3393ZP, date: "2026-11-02", start_time: "09:00", end_time: "10:00" }]
                  recurring_schedules: []
                  patients: []
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/position:
    put:
      tags: [staff]
      operationId: changeUserPosition
      summary: 職員の役職を変える
      description: |
        職員の役職を変え、職員の権限を新しい役職のデフォルトの権限からコピーし直す。職員ごとに足した権限と対象は消える。
        チームを対象にする権限は、職員の所属のチームを対象にする。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
        事業所で職員の管理の権限を持つ最後の有効な職員の役職は、その権限を持たない役職に変えられない。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_id]
              properties:
                position_id: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: 役職を変えた職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 事業所で職員の管理の権限を持つ最後の有効な職員の役職を、その権限を持たない役職に変えようとした。役職と権限は変わらない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "職員の管理の権限を持つ最後の有効な職員の役職は、その権限を持たない役職に変えられません" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/leave:
    post:
      tags: [staff]
      operationId: startUserLeave
      summary: 職員を休職にする
      description: |
        職員を休職にする。休職の職員はログインできず、ログインしている職員も、web が access token を取り直すとき（5 分以内）に使えなくなる。
        予定の API は、休職の職員のリクエストを 403 で拒む。休職の職員を休職にし直しても成功し、休職にした時刻は変えずに、戻る予定の日だけを書き換える。
        戻る予定の日はメモで、その日に自動では戻さない。その日以降の予定、繰り返しの予定、担当の利用者が残っても拒まず、一覧を警告として返す。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。自分と、事業所で職員の管理の権限を持つ最後の有効な職員は、休職にできない。
        ログインのセッションの取り消しに失敗したときは、職員を休職にしてから 500 を返す。送り直すと取り消しをやり直す。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                return_date:
                  type: string
                  format: date
                  nullable: true
                  description: 戻る予定の日のメモ。省略するか null なら持たない
      responses:
        "200":
          description: 休職にした職員と、その日以降に残る予定と担当の利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 自分か、事業所で職員の管理の権限を持つ最後の有効な職員か、退職した職員を休職にしようとした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "自分を休職か退職にすることはできません" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/reinstate:
    post:
      tags: [staff]
      operationId: reinstateUser
      summary: 休職の職員を復職にする
      description: |
        休職の職員を有効に戻す。職員は、休職の前に結び付けた上流のアカウントで、そのままログインできる。有効な職員を復職にしても成功する。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。退職した職員は戻せない。
        ID ブローカーに届かなかったときは、休職を外してから 500 を返す。その間、職員はログインできない。送り直すとブローカーの職員を戻す。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 復職にした職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 退職した職員を復職にしようとした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "退職した職員は復職できません" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/remaining_assignments:
    get:
      tags: [staff]
      operationId: getUserRemainingAssignments
      summary: 職員に残る予定と担当の利用者を返す
      description: |
        職員を休職か退職にする前に、その日（事業所の現地の日付）以降の予定、繰り返しの予定、担当の利用者を返す。
        一覧は、休職と退職が返す一覧と同じ規則で作る。何も書かない。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: その日以降に残る予定と担当の利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAssignments" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/retire:
    post:
      tags: [staff]
      operationId: retireUser
      summary: 職員を退職にする
      description: |
        職員を退職にする。退職した職員はログインできず、戻せない。名前、所属、役職は残し、過去の予定と照合の結果で主訪問者として読める。
        メールと電話番号は消し、ID ブローカーは職員のメールと上流のアカウントを消す。同じメールで、新しい職員として登録し直せる。
        その日以降の予定、繰り返しの予定、担当の利用者が残るときは、書かずに 409（staff_has_assignments）で残る一覧を返す。
        退職した職員を退職にしても成功する。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
        自分と、事業所で職員の管理の権限を持つ最後の有効な職員は、退職にできない。
        ログインのセッションの取り消しに失敗したときは、職員を退職にしてから 500 を返す。送り直すと取り消しをやり直す。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 退職にした職員。残る予定と担当の利用者は空
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            その日以降の予定か担当の利用者が残る（staff_has_assignments。assignments に残る一覧がある）か、
            自分か、事業所で職員の管理の権限を持つ最後の有効な職員を退職にしようとした（conflict）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetireConflict" }
              example:
                code: staff_has_assignments
                message: "予定か担当の利用者が残る職員は退職にできません。別の職員に割り振り直してください"
                assignments:
                  schedules: [{ id: 01M3TC5H00QV17BC0J9V3393ZP, date: "2026-11-02", start_time: "09:00", end_time: "10:00" }]
                  recurring_schedules: []
                  patients: []
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/policies:
    post:
      tags: [staff]
      operationId: addUserPolicy
      summary: 職員に権限を足す
      description: |
        職員に権限を 1 つ足す。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
        職員を対象にする権限（schedule.user.*）には target_user_ids を、チームを対象にする権限（schedule.team.*）には
        target_team_ids を 1 つ以上指定する。対象を指定しない権限には、どちらも指定できない。対象は同じ事業所のものに限る。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id]
              properties:
                policy_id: { $ref: "#/components/schemas/ID" }
                target_user_ids:
                  type: array
                  items: { $ref: "#/components/schemas/ID" }
                target_team_ids:
                  type: array
                  items: { $ref: "#/components/schemas/ID" }
      responses:
        "201":
          description: 権限を足した職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 職員が同じ権限をすでに持っている
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "職員はすでに権限 自分の予定の編集 を持っています" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/{user_id}/policies/{user_policy_id}:
    delete:
      tags: [staff]
      operationId: removeUserPolicy
      summary: 職員の権限を外す
      description: |
        職員の権限と、その対象を外す。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
        事業所で職員の管理の権限を持つ最後の有効な職員からは、その権限を外せない。
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
        - { name: user_policy_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 権限を外した職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 事業所で職員の管理の権限を持つ最後の有効な職員から、その権限を外そうとした。権限は残る
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: conflict, message: "職員の管理の権限を持つ最後の有効な職員から、その権限は外せません" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me:
    get:
      tags: [staff]
      operationId: getMe
      summary: トークンの職員を取得する
      description: 画面が、ログインした職員と事業所を知るために呼ぶ。
      responses:
        "200":
          description: 職員と権限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/external_calendar:
    get:
      tags: [calendar]
      operationId: getMyExternalCalendar
      summary: トークンの職員に結び付いたカレンダーを取得する
      description: |
        外していないカレンダーを、最も新しく始めた取り込みを付けて返す。権限は求めない。
        トークンの職員の分だけを返し、ほかの職員のカレンダーは返さない。結び付いていなければ external_calendar を null にする。
      responses:
        "200":
          description: 結び付いたカレンダー
          content:
            application/json:
              schema:
                type: object
                required: [external_calendar]
                properties:
                  external_calendar:
                    description: 結び付いたカレンダー。結び付いていなければ null
                    type: object
                    nullable: true
                    x-omitempty: false
                    allOf:
                      - $ref: "#/components/schemas/ExternalCalendar"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/patients:
    get:
      tags: [patient]
      operationId: listPatients
      summary: 事業所の利用者を一覧する
      parameters:
        - $ref: "#/components/parameters/FacilityID"
        - { name: name, in: query, schema: { type: string } }
        - { name: preferred_time, in: query, schema: { $ref: "#/components/schemas/PreferredTime" } }
        - { name: preferred_gender, in: query, schema: { $ref: "#/components/schemas/PreferredGender" } }
        - { name: assigned_staff, in: query, description: 担当の職員の名前で一致させる, schema: { type: string } }
        - name: include_ended
          in: query
          description: true なら利用の終了の利用者を含める。省くか false なら利用中の利用者だけを返す
          schema: { type: boolean, default: false }
        - name: sort_field
          in: query
          description: 省くと name の昇順
          schema: { type: string, enum: [name, created_at] }
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: 事業所の利用者
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [patient]
      operationId: createPatient
      summary: 利用者を作る
      description: 職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, preferred_time, preferred_gender, service_code_id, assigned_staff_id]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                preferred_time: { $ref: "#/components/schemas/PreferredTime" }
                preferred_gender: { $ref: "#/components/schemas/PreferredGender" }
                service_code_id: { $ref: "#/components/schemas/ID" }
                assigned_staff_id: { $ref: "#/components/schemas/ID" }
      responses:
        "201":
          description: 作った利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/patients/{patient_id}:
    get:
      tags: [patient]
      operationId: getPatient
      summary: 利用者を取得する
      description: |
        利用者を 1 人返す。利用の終了の利用者も返し、ended_at に利用の終了にした時刻を入れる。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: patient_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [patient]
      operationId: updatePatient
      summary: 利用者の名前、サービス、希望、担当の職員を変える
      description: |
        利用者の名前、希望の時間帯と性別、サービスコード、担当の職員を本文の値に置き換える。部分の更新は持たない。
        利用の終了の利用者も変えられ、利用の終了は変えない。
        担当を別の職員に変えるときは、休職か退職の職員を 400 で拒む。今の担当のままなら、担当が休職か退職でも拒まない。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: patient_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, preferred_time, preferred_gender, service_code_id, assigned_staff_id]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                preferred_time: { $ref: "#/components/schemas/PreferredTime" }
                preferred_gender: { $ref: "#/components/schemas/PreferredGender" }
                service_code_id: { $ref: "#/components/schemas/ID" }
                assigned_staff_id: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: 変えた利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/patients/{patient_id}/end_service:
    post:
      tags: [patient]
      operationId: endPatientService
      summary: 利用者の利用を終了する
      description: |
        利用者の利用を終了する（ADR-0005）。利用者のレコードは消さず、名前、サービス、担当の職員を残す。
        利用の終了の利用者は、デフォルトの利用者の一覧に出ず、予定の利用者に新しく指せず、職員の退職の確認で担当に数えない。
        その日（事業所の現地の日付）以降の予定か、その日以降に終わる繰り返しの予定が残るときは、書かずに 409（patient_has_schedules）で残る一覧を返す。
        利用の終了の利用者の利用を終了しても成功し、最初に利用を終了した時刻を残す。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: patient_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
      responses:
        "200":
          description: 利用を終了した利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: その日以降の予定か繰り返しの予定が残る（patient_has_schedules。schedules に残る一覧がある）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndServiceConflict" }
              example:
                code: patient_has_schedules
                message: "その日以降の予定か繰り返しの予定が残る利用者は、利用の終了にできません。予定をキャンセルするか、繰り返しを終えてください"
                schedules:
                  schedules: [{ id: 01M3TC5H00QV17BC0J9V3393ZP, date: "2026-11-02", start_time: "09:00", end_time: "10:00" }]
                  recurring_schedules: []
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/patients/{patient_id}/remaining_schedules:
