  /v1/facilities/{facility_id}/patients:
    get:
      tags: [patient]
      operationId: listPatients
      summary: 事業所の利用者を一覧する
      parameters:
        - $ref: "#/components/parameters/FacilityID"
        - { name: name, in: query, schema: { type: string } }
        - { name: preferred_time, in: query, schema: { $ref: "#/components/schemas/PreferredTime" } }
        - { name: preferred_gender, in: query, schema: { $ref: "#/components/schemas/PreferredGender" } }
        - { name: assigned_staff, in: query, description: 担当の職員の名前で一致させる, schema: { type: string } }
        - name: sort_field
          in: query
          description: 省くと name の昇順
          schema: { type: string, enum: [name, created_at] }
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: 事業所の利用者
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [patient]
      operationId: createPatient
      summary: 利用者を作る
      description: 職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, preferred_time, preferred_gender, service_code_id, assigned_staff_id]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                preferred_time: { $ref: "#/components/schemas/PreferredTime" }
                preferred_gender: { $ref: "#/components/schemas/PreferredGender" }
                service_code_id: { $ref: "#/components/schemas/ID" }
                assigned_staff_id: { $ref: "#/components/schemas/ID" }
      responses:
        "201":
          description: 作った利用者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/visit_infos/service_codes:
    get:
      tags: [visit]
