      summary: 利用の終了の利用者を利用中に戻す
      description: |
        利用者を利用中に戻し（利用の再開）、担当の職員を本文の職員にする（ADR-0005）。利用の終了の前の予定は、同じ利用者の予定のまま残る。
        担当の職員は必ず指定し、休職か退職の職員は 400 で拒む。利用中の利用者を戻しても成功し、担当を書き換える。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters:
        - { name: patient_id, in: path, required: true, schema: { $ref: "#/components/schemas/ID" } }
