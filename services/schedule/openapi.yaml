  /v1/facilities/{facility_id}/schedules:
    get:
      tags: [schedule]
      operationId: listSchedules
      summary: 事業所の予定を一覧する
      description: |
        事業所の単発の予定と繰り返しの予定のうち、職員が見てよい予定を返す。見てよくない職員の予定は除く。
        sort_field と sort_order は許可した値だけを受け付け、ほかの値は 400 を返す。date_from と date_to は単発の予定だけを、予定の日付（開始の日）で絞る。
        date_from の前の日に始まり、date_from に終わる ends_next_day の予定も返す。
        Google カレンダーを予定の正本にする事業所（google_primary）では、同期が写した Google カレンダーの予定（Projection）を読む（ADR-0029）。
        繰り返しの予定は、date_from から date_to までの回に展開し、回ごとに単発の予定（source が google_calendar）として返す。recurring_schedules は空である。
        date_from か date_to を省くと、Projection を保持する期間（前々月の初日から 3 か月後の月末）の端を使う。
        外したカレンダーの予定は返さない。buddy の繰り返しの規則に写せない繰り返しの予定は、最初の回の日時の 1 件にし、review_reason を付けて返す。
        Projection の予定の id は、一覧を読むたびに同じ値になる。buddy から書いた予定と、buddy で変えた Google の予定は、書いたときの予定の ID にする。
        ほかの予定は Google の予定から作る。繰り返しの回は、カレンダー、親の予定、回の元の日付から作り、回を変えても同じ値である。
        予定と繰り返しの回は、この id で取得、変更、取り消しができる。繰り返しの回の etag は、親の予定の etag である。
      parameters:
        - $ref: "#/components/parameters/FacilityID"
        - { name: schedule_type, in: query, schema: { $ref: "#/components/schemas/ScheduleTypeName" } }
        - { name: date_from, in: query, description: この日を含む, schema: { type: string, format: date } }
        - { name: date_to, in: query, description: この日を含む, schema: { type: string, format: date } }
        - name: sort_field
          in: query
          description: 省くと date の昇順。date は日付の後に開始の時刻で並べる
          schema: { type: string, enum: [date, start_time, created_at] }
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: 予定
          content:
            application/json:
              schema:
                type: object
                required: [schedules, recurring_schedules, source_mode, calendar_syncs, cutover]
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
                  recurring_schedules:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringSchedule" }
                  source_mode: { $ref: "#/components/schemas/SourceMode" }
                  calendar_syncs:
                    type: array
                    description: |
                      google_primary の事業所で、職員が見てよい職員に結び付けた、外していないカレンダーの同期の状況。buddy_primary の事業所では空である。
                      最新でないとみなす時間は画面が決める。
                    items: { $ref: "#/components/schemas/CalendarSyncStatus" }
                  cutover:
                    description: google_primary の事業所で、予定の正本を buddy に切り替えている間の open の切り替え。無ければ null（ADR-0031）
                    type: object
                    nullable: true
                    x-omitempty: false
                    allOf:
                      - $ref: "#/components/schemas/OpenCalendarCutover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [schedule]
      operationId: createSchedule
      summary: 単発の予定を作る
      description: |
        buddy_primary の事業所では、buddy の予定のテーブルに予定を作る。
        google_primary の事業所では、予定の職員のカレンダーに Google カレンダーの予定を作り、書けたときだけ成功を返す（ADR-0029）。
        訪問の情報は buddy に持ち、Google の予定のタイトルは `【サービス内容】利用者名` にする。応答の source は google_calendar である。
        google_primary の事業所では id が必須で、同じ id で送り直しても Google の予定は 1 つのままである。
        Google の予定が送った内容と同じなら成功を返し、違えば 409（google_event_changed）を返す。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SlotRequest"
                - type: object
                  properties:
                    id:
                      description: |
                        画面が決める予定の ID（ULID）。google_primary の事業所では必須で、Google の予定の ID をこの ID から決める。
                        buddy_primary の事業所では、送れば予定の ID にし、省けばサーバーが決める。
                      allOf:
                        - $ref: "#/components/schemas/ID"
      responses:
        "201":
          description: 作った予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            google_primary の事業所で、予定を書けない。code は次のいずれかである。
            conflict（id がほかの予定に使われているか、事業所の予定の正本が変わった）、cutover_open（予定の正本を切り替えている）、
            calendar_not_linked（予定の職員が外していないカレンダーを持たない。Google に書かない）、
            google_write_pending（同じ id の書き込みが途中である）、google_event_changed（Google の予定が送った内容と違う）、
            google_event_not_found（Google で予定が見つからない）、google_calendar_unwritable（サービスアカウントがカレンダーに書けない）、
            google_event_rejected（Google が予定の内容を受け付けない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                calendarNotLinked:
                  summary: 予定の職員がカレンダーを結び付けていない
                  value: { code: calendar_not_linked, message: "予定の職員が Google カレンダーを結び付けていません。カレンダーを結び付けてから予定を作ってください" }
                googleEventChanged:
                  summary: Google の予定が送った内容と違う
                  value: { code: google_event_changed, message: "Google カレンダーで予定が変わっていました。最新の予定を確認してください" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: |
            google_primary の事業所で、Google カレンダーに書けない。code は次のいずれかである。
            google_write_unknown（Google が受けたかが分からない。時間をおいて予定を開き直す）、
            google_unavailable（Google が一時的に拒んだ。書いていない）、calendar_not_configured（サービスアカウントの設定が無い）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                googleWriteUnknown:
                  summary: Google が受けたかが分からない
                  value: { code: google_write_unknown, message: "予定を Google カレンダーに書けたかを確認できませんでした。時間をおいて予定を開き直してください" }
                googleUnavailable:
                  summary: Google が一時的に拒んだ
                  value: { code: google_unavailable, message: "予定を Google カレンダーに書けませんでした。時間をおいてやり直してください" }

  /v1/facilities/{facility_id}/schedules/recurring:
    post:
      tags: [schedule]
      operationId: createRecurringSchedule
      summary: 繰り返しの予定を作る
      description: |
        buddy_primary の事業所では、buddy の繰り返しの予定のテーブルに予定を作る。
        google_primary の事業所では、予定の職員のカレンダーに、RRULE の繰り返しの予定を 1 つ作り、書けたときだけ成功を返す（ADR-0029）。
        訪問の情報は buddy に持ち、手順、送り直し、409 と 503 の code は createSchedule と同じである。id が必須である。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SlotRequest"
                - type: object
                  required: [recurring_rule]
                  properties:
                    recurring_rule: { $ref: "#/components/schemas/RecurringRule" }
                    id:
                      description: |
                        画面が決める繰り返しの予定の ID（ULID）。google_primary の事業所では必須で、Google の予定の ID をこの ID から決める。
                        buddy_primary の事業所では読まない。
                      allOf:
                        - $ref: "#/components/schemas/ID"
      responses:
        "201":
          description: 作った繰り返しの予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringSchedule" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: google_primary の事業所で、予定を書けない。code は createSchedule の 409 と同じである
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: google_primary の事業所で、Google カレンダーに書けない。code は createSchedule の 503 と同じである
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/schedules/{schedule_id}:
    get:
      tags: [schedule]
      operationId: getSchedule
      summary: 単発の予定を取得する
      description: |
        google_primary の事業所では、一覧（listSchedules）の id で、Projection の単発の予定を一覧と同じ内容で返す（ADR-0029）。
        繰り返しの予定の回は、一覧と同じ id と内容で返す。取り消した予定と、繰り返しの予定の全体は返さない。
      parameters: [$ref: "#/components/parameters/ScheduleID"]
      responses:
        "200":
          description: 予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      tags: [schedule]
      operationId: updateSchedule
      summary: 単発の予定を置き換える
      description: |
        予定の枠を本文の内容に置き換える。訪問の情報は、本文の内容で作り直す。
        繰り返しの予定の回を置き換えた予定は、元の繰り返しの予定への結び付きを保つ。
        google_primary の事業所では、Google カレンダーの予定を書き換え、書けたときだけ成功を返す（ADR-0029）。
        etag が必須で、Google に If-Match で付ける。読んだ後に Google で予定が変わっていれば 409（google_event_changed）を返し、Google の予定を変えない。
        Google で作った予定に訪問の情報を足すと、buddy に訪問の情報を持つ。予定の職員を替えると、予定を新しい職員のカレンダーに移す。
      parameters: [$ref: "#/components/parameters/ScheduleID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SlotRequest"
                - type: object
                  properties:
                    etag:
                      type: string
                      minLength: 1
                      description: 画面が読んだ予定の etag。google_primary の事業所では必須で、buddy_primary の事業所では読まない
      responses:
        "200":
          description: 置き換えた予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            キャンセル済み（conflict）か、予定を書いている間に事業所の予定の正本が変わった（google_primary、conflict）。
            google_primary の事業所では、createSchedule の 409 と同じ code も返す。google_write_pending は、予定の前の書き込みの結果がまだ分からないことを表す。
            繰り返しの予定の全体は、conflict で拒む。繰り返しの回を変えると、Google の例外の回にし、親の予定の EXDATE は変えない。
            回の etag は親の予定の etag で、読んだ後に親の予定が変わっていれば google_event_changed を返す。
            回の予定の職員を替えると、元のカレンダーの回を取り消し、新しい職員のカレンダーに単発の予定を作る。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                cancelled:
                  summary: キャンセル済み
                  value: { code: conflict, message: "キャンセル済みの予定は変えられません" }
                googleEventChanged:
                  summary: 読んだ後に Google カレンダーで予定が変わった
                  value: { code: google_event_changed, message: "Google カレンダーで予定が変わっていました。最新の予定を確認してください" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: google_primary の事業所で、Google カレンダーに書けない。code は createSchedule の 503 と同じである
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/schedules/{schedule_id}/cancel:
    post:
      tags: [schedule]
      operationId: cancelSchedule
      summary: 単発の予定をキャンセルする
      description: |
        google_primary の事業所では、Google カレンダーの予定を消し、消せたときだけ成功を返す（ADR-0029）。
        etag が必須で、Google に If-Match で付ける。理由は Google に書けないので保存せず、応答のキャンセルの id は予定の id と同じである。
        消した予定は一覧に出さず、buddy に持つ訪問の情報も消す。
      parameters: [$ref: "#/components/parameters/ScheduleID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
                etag:
                  type: string
                  minLength: 1
                  description: 画面が読んだ予定の etag。google_primary の事業所では必須で、buddy_primary の事業所では読まない
      responses:
        "201":
          description: キャンセル
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cancel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            キャンセル済み（conflict）か、予定を書いている間に事業所の予定の正本が変わった（google_primary、conflict）。
            google_primary の事業所では、createSchedule の 409 と同じ code も返す。Google で消されていた予定は google_event_not_found である。
            繰り返しの予定の全体は、conflict で拒む。繰り返しの回を取り消すと、Google はその回だけを取り消し、ほかの回は残る。
            回の etag は親の予定の etag で、読んだ後に親の予定が変わっていれば google_event_changed を返す。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                cancelled:
                  summary: キャンセル済み
                  value: { code: conflict, message: "この予定はすでにキャンセルされています" }
                googleEventChanged:
                  summary: 読んだ後に Google カレンダーで予定が変わった
                  value: { code: google_event_changed, message: "Google カレンダーで予定が変わっていました。最新の予定を確認してください" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: google_primary の事業所で、Google カレンダーに書けない。code は createSchedule の 503 と同じである
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/schedules/recurring/{recurring_schedule_id}:
    get:
      tags: [schedule]
      operationId: getRecurringSchedule
      summary: 繰り返しの予定を取得する
      parameters: [$ref: "#/components/parameters/RecurringScheduleID"]
      responses:
        "200":
          description: 繰り返しの予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/schedules/recurring/{recurring_schedule_id}/rule:
    put:
      tags: [schedule]
      operationId: changeRecurringRule
      summary: 繰り返しの予定の規則を、適用の日以降の回について変える
      description: |
        規則を、effective_date 以降の回にだけ当てる（ADR-0037）。今日より前の回は変えない。
        元の繰り返しの予定に effective_date より前の回があれば、元の繰り返しの予定の終了日を effective_date の前の日にし、
        effective_date 以降で新しい規則が当たる最初の日を最初の日付にした、新しい繰り返しの予定を作る。時刻、職員、訪問の情報は元の繰り返しの予定から写す。
        effective_date より前の回が無ければ、分けずに規則と最初の日付を書き換える。終了日だけを変えるときも、分けずに終了日を書き換える。
        適用の日以降（終了日だけの変更では新しい終了日の後）の置き換えた回は、単発の予定として残し、取り消した回は新しい規則に引き継がない。
        google_primary の事業所では、recurring_schedule_id は changeOccurrence と同じ繰り返しの予定の id で、
        変えた例外の回を同じカレンダーの単発の予定に作り直してから、親の予定の RRULE を書く。
        google_primary の事業所では、effective_date より前の回が無いときも、新しい親の予定を id で作って元の親の予定を消すので、id が変わる。
        応答は、effective_date 以降の回を持つ繰り返しの予定である。分けたときは新しい繰り返しの予定で、id が変わる。
      parameters: [$ref: "#/components/parameters/RecurringScheduleID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recurring_rule]
              properties:
                recurring_rule: { $ref: "#/components/schemas/RecurringRule" }
                effective_date:
                  type: string
                  format: date
                  description: 適用の日。今日（Asia/Tokyo）以降に限る。規則の終了日のほかの項目を変えるときは必須で、終了日だけを変えるときは読まない
                id:
                  description: |
                    繰り返しの予定を分けるときの、新しい繰り返しの予定の ID（ULID）。google_primary の事業所で規則を変えるときは必須で、
                    Google の予定の ID をこの ID から決める。buddy_primary の事業所では読まない。
                  allOf:
                    - $ref: "#/components/schemas/ID"
                etag:
                  description: 画面が読んだ親の予定の etag。google_primary の事業所では必須で、buddy_primary の事業所では読まない
                  type: string
      responses:
        "200":
          description: effective_date 以降の回を持つ繰り返しの予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            事業所が予定を書けない。google_primary の事業所では、updateSchedule の 409 と同じ code も返す。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: google_primary の事業所で、Google カレンダーに書けない。code は createSchedule の 503 と同じである
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/schedules/recurring/{recurring_schedule_id}/occurrences:
    post:
      tags: [schedule]
      operationId: changeOccurrence
      summary: 繰り返しの予定の 1 回を置き換える
      description: |
        繰り返しの予定の original_date の回を、本文の内容の単発の予定に置き換える。
        元の回は exclusion_dates に加わり、作った予定は recurring_schedule_id で元の繰り返しの予定を指す。
        google_primary の事業所では、recurring_schedule_id は Google カレンダーの繰り返しの予定の id（createRecurringSchedule の応答の id）である。
        Google の回（events.instances で読んだ回）を例外の回として書き換え、親の予定の EXDATE は変えない（ADR-0029）。
        応答の予定の id は、回の listSchedules での id で、回を変える前と同じである。
        予定の職員を替えると、元のカレンダーの回を取り消し、新しい職員のカレンダーに単発の予定を作る。
        訪問の情報は繰り返しの予定のものを引き継ぎ、変えたときだけ回に持つ。409 と 503 の code は updateSchedule と同じである。
      parameters: [$ref: "#/components/parameters/RecurringScheduleID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SlotRequest"
                - type: object
                  required: [original_date]
                  properties:
                    original_date:
                      type: string
                      format: date
                      description: 置き換える回の日付。繰り返しの規則に当たる日に限る
      responses:
        "201":
          description: 置き換えた単発の予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/AssignBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            その回はすでに置き換えた（conflict）。google_primary の事業所では、予定の職員を替える入力も conflict で、
            createSchedule の 409 と同じ code も返す。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                replaced:
                  summary: その回はすでに置き換えた
                  value: { code: conflict, message: "2026-10-12 の回はすでに置き換えられています" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: google_primary の事業所で、Google カレンダーに書けない。code は createSchedule の 503 と同じである
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/schedules/recurring/{recurring_schedule_id}/occurrences/cancel:
    post:
      tags: [schedule]
      operationId: cancelOccurrence
      summary: 繰り返しの予定の 1 回をキャンセルする
      description: |
        buddy_primary の事業所で、繰り返しの予定の original_date の回を、繰り返しの予定と同じ内容の単発の予定にし、理由を付けてキャンセルする。
        元の回は exclusion_dates に加わり、作った予定は recurring_schedule_id で元の繰り返しの予定を指す。
        キャンセルした予定は、listSchedules の include_cancelled で返る。応答のキャンセルの schedule_id は、作った予定の id である。
        置き換えた後の回は単発の予定なので、cancelSchedule でキャンセルする。
        google_primary の事業所の回は、cancelSchedule で回の id を指してキャンセルする。
      parameters: [$ref: "#/components/parameters/RecurringScheduleID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_date, reason]
              properties:
                original_date:
                  type: string
                  format: date
                  description: キャンセルする回の日付。繰り返しの規則に当たる日に限る
                reason: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "201":
          description: キャンセル
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cancel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            その回はすでに置き換えたかキャンセルした（conflict）か、事業所が google_primary である（google_primary）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                replaced:
                  summary: その回はすでに置き換えたかキャンセルした
                  value: { code: conflict, message: "2026-10-12 の回はすでに置き換えられています" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/calendar_service_account:
    get:
      tags: [calendar]
      operationId: getCalendarServiceAccount
      summary: カレンダーを共有する相手のサービスアカウントを取得する
      description: 職員が Google カレンダーを共有する相手の、この事業所のサービスアカウントのメールアドレスを返す。サービスアカウントは事業所ごとにある（ADR-0030）。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: サービスアカウント
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/CalendarNotConfigured" }

  /v1/facilities/{facility_id}/external_calendars:
    get:
      tags: [calendar]
      operationId: listExternalCalendars
      summary: 事業所の結び付けたカレンダーを一覧する
      description: 外していないカレンダーを、結び付けた順に返す。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 結び付けたカレンダー
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalCalendar" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [calendar]
      operationId: createExternalCalendar
      summary: 職員にカレンダーを結び付ける
      description: |
        Google Calendar API で予定を 1 件だけ読み、読めることを確認してから結び付ける。
        外した同じカレンダーが同じ職員にあれば、結び付け直す。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_id, calendar_id]
              properties:
                staff_id: { $ref: "#/components/schemas/ID" }
                calendar_id: { $ref: "#/components/schemas/CalendarID" }
      responses:
        "201":
          description: 結び付けたカレンダー
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalCalendar" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            職員にほかのカレンダーが結び付いている（staff_has_calendar）か、カレンダーがほかの職員に結び付いている（calendar_taken。外したカレンダーを含む）か、
            すでに結び付いている（calendar_already_linked）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                staff:
                  summary: 職員にほかのカレンダーが結び付いている
                  value: { code: staff_has_calendar, message: "この職員には、ほかのカレンダーが結び付いています" }
                calendar:
                  summary: カレンダーがほかの職員に結び付いている
                  value: { code: calendar_taken, message: "このカレンダーは、ほかの職員に結び付いています" }
                linked:
                  summary: すでに結び付いている
                  value: { code: calendar_already_linked, message: "このカレンダーは、この職員にすでに結び付いています" }
        "422": { $ref: "#/components/responses/CalendarUnreadable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/CalendarUnavailable" }
        "503": { $ref: "#/components/responses/CalendarNotConfigured" }

  /v1/facilities/{facility_id}/external_calendars/check:
    post:
      tags: [calendar]
      operationId: createExternalCalendarCheck
      summary: カレンダーを読めるかを確認する
      description: Google Calendar API で予定を 1 件だけ読む。結び付けない。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendar_id]
              properties:
                calendar_id: { $ref: "#/components/schemas/CalendarID" }
      responses:
        "200":
          description: 読めた
          content:
            application/json:
              schema:
                type: object
                required: [readable]
                properties:
                  readable: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/CalendarUnreadable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/CalendarUnavailable" }
        "503": { $ref: "#/components/responses/CalendarNotConfigured" }

  /v1/external_calendars/{external_calendar_id}:
    delete:
      tags: [calendar]
      operationId: removeExternalCalendar
      summary: カレンダーを外す
      description: |
        レコードを消さずに外す。取り込んだ予定と、外部の予定との対応は残るので、同じカレンダーを結び付け直して同じ期間を取り込んでも、予定は重ならない。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/ExternalCalendarID"]
      responses:
        "204": { description: 外した }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/external_calendars/{external_calendar_id}/import_previews:
    post:
      tags: [calendar]
      operationId: createCalendarImportPreview
      summary: 取り込みをプレビューする
      description: |
        カレンダーの期間の予定を読み、取り込むとどうなるかを返す。予定を書かず、プレビューの結果も保存しない。
        読み替えの規則は、画面仕様書の予定の取り込みにある。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/ExternalCalendarID"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRange" }
      responses:
        "200":
          description: プレビューの結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/CalendarUnreadable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/CalendarUnavailable" }
        "503": { $ref: "#/components/responses/CalendarNotConfigured" }

  /v1/external_calendars/{external_calendar_id}/imports:
    post:
      tags: [calendar]
      operationId: createCalendarImport
      summary: 取り込みを確定する
      description: |
        カレンダーの期間の予定を読み直し、プレビューと同じ規則で読み替えて、予定と外部の予定との対応を 1 つのトランザクションで書く。
        前の取り込みで取り込んだ外部の予定は書かない。確認が必要な予定には decisions の取り込み方を当てる。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/ExternalCalendarID"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImportRange"
                - type: object
                  required: [decisions]
                  properties:
                    decisions:
                      type: array
                      description: プレビューの needs_review の全ての予定の取り込み方
                      items: { $ref: "#/components/schemas/ImportDecision" }
      responses:
        "201":
          description: 取り込みの記録
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: プレビューの後に確認が必要な予定か職員の休職が変わった（import_preview_changed）か、同じカレンダーの取り込みが進んでいる（import_running）か、事業所が Google カレンダーを予定の正本にしている（google_primary）。何も書いていない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                changed:
                  summary: プレビューの後に確認が必要な予定が変わった
                  value: { code: import_preview_changed, message: "プレビューの後に、外部のカレンダーの確認が必要な予定が変わりました。もう一度プレビューしてください" }
                running:
                  summary: 同じカレンダーの取り込みが進んでいる
                  value: { code: import_running, message: "このカレンダーの取り込みが進んでいます。終わってから、もう一度プレビューしてください" }
                googlePrimary:
                  summary: 事業所が Google カレンダーを予定の正本にしている
                  value: { code: google_primary, message: "この事業所の予定は Google カレンダーで管理しています。予定は Google カレンダーで作成、変更してください" }
        "422": { $ref: "#/components/responses/CalendarUnreadable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/CalendarUnavailable" }
        "503": { $ref: "#/components/responses/CalendarNotConfigured" }

  /v1/facilities/{facility_id}/calendar_export_issues:
    get:
      tags: [calendar]
      operationId: listCalendarExportIssues
      summary: 確認が必要な書き出しを一覧する
      description: |
        Google カレンダーと食い違った予定のうち、buddy と Google カレンダーの両方で変わったか、Google カレンダーの変更を buddy に読み替えられなかった
        （conflict）か、書けなかった（failed）ものを、新しく変わった順に返す。
        予定のタイトル、利用者名、カレンダーの ID は返さない。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 確認が必要な書き出し
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CalendarExportIssue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/calendar_exports/{calendar_export_id}/retries:
    post:
      tags: [calendar]
      operationId: createCalendarExportRetry
      summary: 確認が必要な書き出しを buddy の内容で書き直す
      description: |
        確認が必要な書き出しを、Google カレンダーの予定の変更を比べずに、buddy の今の内容で書き直す待ちにする。書き出しの処理が、次の周期で書く。
        Google カレンダーで消された予定は作り直す。職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/CalendarExportID"]
      responses:
        "202":
          description: 書き直す待ちにした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarExport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 確認が必要な書き出しでない（export_not_in_review）。すでに書き直す待ちにしたか、書き終えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notInReview:
                  summary: 確認が必要な書き出しでない
                  value: { code: export_not_in_review, message: "この予定は、確認が必要な書き出しではありません" }
        "500": { $ref: "#/components/responses/InternalError" }


  /v1/facilities/{facility_id}/calendar_cutover_status:
    get:
      tags: [calendar]
      operationId: getCalendarCutoverStatus
      summary: 予定の正本の切り替えの状況を取得する
      description: |
        事業所の open の切り替えと、外していない全てのカレンダーの同期の状況と、この切り替えで最後に成功した取り込みを返す（ADR-0031）。
        open の切り替えが無ければ、cutover は null で、カレンダーの last_import は null である。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "200":
          description: 切り替えの状況
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarCutoverState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/facilities/{facility_id}/calendar_cutovers:
    post:
      tags: [calendar]
      operationId: startCalendarCutover
      summary: 予定の正本の切り替えを始める
      description: |
        Google カレンダーを予定の正本にする事業所（google_primary）で、予定の正本を buddy に切り替える作業（切り替え）を始める（ADR-0031）。
        取り込みの期間は、今の Asia/Tokyo の月の初日から先の全てで、終わりを持たない。
        始めると、カレンダーごとに、取り込みのプレビューと確定（期間は range_start が切り替えの range_start、range_end が null）で取り込む。
        画面と照合は、切り替えの間も Google カレンダーの予定の写し（Projection）を読む。
        外していない全てのカレンダーの最後の同期が成功していて、buddy から Google カレンダーに書いた結果がまだ分からない予定（保留の版）が無いことを条件にする。
        切り替えの間は、buddy から予定を作成、変更、取り消しできない（createSchedule などが 409 の cutover_open を返す）。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/FacilityID"]
      responses:
        "201":
          description: 始めた切り替え
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarCutover" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            事業所が buddy を予定の正本にしている（cutover_not_google_primary）か、open の切り替えがある（cutover_open）か、
            保留の版がある（google_write_pending。buddy から Google カレンダーに書いた結果がまだ分からない予定がある）か、
            最後の同期が成功していないカレンダーがある（cutover_sync_not_ready）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notGooglePrimary:
                  summary: 事業所が buddy を予定の正本にしている
                  value: { code: cutover_not_google_primary, message: "この事業所の予定の正本は、すでに buddy です" }
                open:
                  summary: open の切り替えがある
                  value: { code: cutover_open, message: "この事業所では、切り替えをすでに始めています" }
                writePending:
                  summary: buddy から Google カレンダーに書いた結果がまだ分からない予定がある
                  value: { code: google_write_pending, message: "buddy から Google カレンダーに書いた結果がまだ分からない予定が 1 件あります。時間をおいてから、もう一度始めてください" }
                sync:
                  summary: 最後の同期が成功していないカレンダーがある
                  value: { code: cutover_sync_not_ready, message: "最後の同期が成功していないカレンダーがあります（岡田 葵）。同期が成功してから始めてください" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/calendar_cutovers/{calendar_cutover_id}/completions:
    post:
      tags: [calendar]
      operationId: createCalendarCutoverCompletion
      summary: 予定の正本の切り替えを完了する
      description: |
        Google カレンダーを切り替えの月の初日から先の全てで読み直し、事業所の行を排他のロックで取って、カレンダーごとに次の 3 つを確認する（ADR-0031）。
        確認の前に、buddy から Google カレンダーに書いた結果がまだ分からない予定（保留の版）があれば、何も書かずに 409（google_write_pending）を返す。
        最後の取り込みの後に同期が成功している。読み直した予定が全て、予定の対応を持つか取り込まないと決めた予定で、規則に写せない繰り返しの予定が残っていない。
        予定の対応の etag と Google の etag が同じである。
        満たせば、事業所を buddy_primary にし、事業所の Projection の行を消し、切り替えを completed にする。同期をやめ、書き出しを始める。
        満たさなければ、何も書かずに 409（cutover_incomplete）で満たさないカレンダーと予定の一覧を返し、切り替えを open のままにする。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/CalendarCutoverID"]
      responses:
        "200":
          description: 完了した切り替え
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarCutover" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            完了の確認を満たさない（cutover_incomplete。items に一覧がある）か、切り替えが open でない（cutover_not_open）か、
            保留の版がある（google_write_pending。buddy から Google カレンダーに書いた結果がまだ分からない予定がある。items を持たない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarCutoverIncomplete" }
              examples:
                incomplete:
                  summary: 完了の確認を満たさない
                  value:
                    code: cutover_incomplete
                    message: "完了の条件を満たさないカレンダーか予定があります。取り込み直してから、もう一度完了してください"
                    items:
                      - external_calendar_id: 01M3TC5H00QV17BC0J9V3393ZP
                        staff_id: 01M3TC5TRG5200KYWTZW6ER3WN
                        staff_name: 岡田 葵
                        reason: needs_review
                        external_event_id: abc123
                        date: "2026-11-10"
                        start_time: "10:00"
                        end_time: "10:30"
                        ends_next_day: false
                        review_reason: patient_not_found
                notOpen:
                  summary: 切り替えが open でない
                  value: { code: cutover_not_open, message: "この切り替えは、すでに完了したか、やめています" }
                writePending:
                  summary: buddy から Google カレンダーに書いた結果がまだ分からない予定がある
                  value: { code: google_write_pending, message: "buddy から Google カレンダーに書いた結果がまだ分からない予定が 1 件あります。時間をおいてから、もう一度完了してください" }
        "422": { $ref: "#/components/responses/CalendarUnreadable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/CalendarUnavailable" }
        "503": { $ref: "#/components/responses/CalendarNotConfigured" }

  /v1/calendar_cutovers/{calendar_cutover_id}/cancel:
    post:
      tags: [calendar]
      operationId: cancelCalendarCutover
      summary: 予定の正本の切り替えをやめる
      description: |
        この切り替えの取り込みで作った buddy の予定、繰り返しの予定、訪問の情報、予定の対応を消し、切り替えを canceled にする（ADR-0031）。
        事業所は Google カレンダーを予定の正本にしたままで、画面と照合は Projection を読み続ける。やめた後に、もう一度始められる。
        職員の管理の権限（staff.manage）を持つ職員だけが呼べる。
      parameters: [$ref: "#/components/parameters/CalendarCutoverID"]
      responses:
        "200":
          description: やめた切り替え
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarCutover" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 切り替えが open でない（cutover_not_open）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: cutover_not_open, message: "この切り替えは、すでに完了したか、やめています" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Hydra が発行した access token。署名（RS256 か ES256）、iss、aud、exp、nbf を確認する。
        `sub` で職員を探し、初回は確認済みの `email` で登録済みの職員に結び付ける。組織のクレーム（デフォルトは `org_id`）が事業所を決める。
  parameters:
    FacilityID:
      name: facility_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    ScheduleID:
      name: schedule_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    RecurringScheduleID:
      name: recurring_schedule_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    ExternalCalendarID:
      name: external_calendar_id
      in: path
      required: true
      description: buddy の外部のカレンダーの ID。Google のカレンダーの ID ではない
      schema: { $ref: "#/components/schemas/ID" }
    CalendarExportID:
      name: calendar_export_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    CalendarCutoverID:
      name: calendar_cutover_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    SortOrder:
      name: sort_order
      in: query
      description: 省くと昇順。sort_field を省いたときはデフォルトのカラムに向きだけを当てる
      schema: { type: string, enum: [asc, desc] }

  responses:
    BadRequest:
      description: 入力のエラー。`code` は invalid_input。`message` はエラーの箇所と理由で、入力によって変わる
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            pathID:
              summary: パスの ID が ULID でない
              value: { code: invalid_input, message: "schedule_id は ULID です" }
            definition:
              summary: リクエストが openapi.yaml の定義に合わない
              value: { code: invalid_input, message: "query の sort_field が定義に合いません: value is not one of the allowed values [\"date\",\"start_time\",\"created_at\"]" }
            body:
              summary: 本文の値が規則に合わない
              value: { code: invalid_input, message: "終了の時刻は開始の時刻より後にします" }
            query:
              summary: クエリを読めない
              value: { code: invalid_input, message: "クエリの形が正しくありません: invalid semicolon separator in query" }
    AssignBadRequest:
      description: |
        入力のエラー。`code` は invalid_input。`message` はエラーの箇所と理由で、入力によって変わる。
        予定の職員、主訪問者、同行者、利用者の担当の職員に、休職か退職の職員か、訪問しない職員を新しく指したときも返す。
        予定と繰り返しの予定に既に割り振った職員は、同じ役割のまま保存できる。休職の職員と訪問しない職員は日付によらず、退職した職員は今日より前の予定でだけ保存できる。
        予定の利用者に、利用の終了の利用者を新しく指したときも返す。既に付けた利用の終了の利用者は、利用者を変えずに、今日より前の予定でだけ保存できる。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            body:
              summary: 本文の値が規則に合わない
              value: { code: invalid_input, message: "終了の時刻は開始の時刻より後にします" }
            onLeave:
              summary: 休職の職員を指した
              value: { code: invalid_input, message: "休職の職員 01M3TC5TRG5200KYWTZW6ER3WN には、予定と担当を割り振れません" }
            retired:
              summary: 退職した職員を指した
              value: { code: invalid_input, message: "退職した職員 01M3TC5TRG5200KYWTZW6ER3WN には、予定と担当を割り振れません" }
            nonVisiting:
              summary: 訪問しない職員を指した
              value: { code: invalid_input, message: "訪問しない職員 01M3TC5TRG5200KYWTZW6ER3WN には、予定と担当を割り振れません" }
            endedPatient:
              summary: 利用の終了の利用者を指した
              value: { code: invalid_input, message: "利用の終了の利用者 01M3TC5TRG5200KYWTZW6ER3WN には、今日以降の予定と新しい予定を作れません" }
    Unauthorized:
      description: トークンがないか、検証に失敗した。`code` は unauthenticated
      headers:
        WWW-Authenticate:
          description: RFC 6750 の challenge。トークンがないときは `Bearer`、検証に失敗したときは `Bearer error="invalid_token"`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missing:
              summary: トークンがない
              value: { code: unauthenticated, message: "認証が必要です" }
            invalid:
              summary: トークンの検証に失敗した
              value: { code: unauthenticated, message: "トークンが正しくありません" }
    Forbidden:
      description: 職員を特定できないか、パスが指す事業所が職員の事業所と違うか、職員の権限で操作できない。`code` は forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: forbidden, message: "この操作は許可されていません" }
    NotFound:
      description: パスで指したリソースがない。`code` は not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: not_found, message: "リソースが見つかりません" }
    InternalError:
      description: サーバーのエラー。`code` は internal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: internal, message: "サーバーでエラーが発生しました" }
    CalendarUnreadable:
      description: カレンダーが無いか、この事業所のサービスアカウントに共有されていない（Google が 403 か 404 を返した）。`code` は calendar_unreadable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: calendar_unreadable, message: "カレンダーを読めません。カレンダーの共有を確認してください" }
    CalendarUnavailable:
      description: Google に届かないか、Google がエラーを返した。`code` は calendar_unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: calendar_unavailable, message: "外部のカレンダーから予定を読めませんでした" }
    CalendarNotConfigured:
      description: この事業所の Google のサービスアカウントが設定されていない。`code` は calendar_not_configured
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: calendar_not_configured, message: "外部のカレンダーを読む設定がありません" }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    ID:
      type: string
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      example: "01M3TC5H00QV17BC0J9V3393ZP"
    Date:
      type: string
      format: date
    Time:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      example: "09:30"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_input
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - internal
            - calendar_unreadable
            - calendar_unavailable
            - calendar_not_configured
            - calendar_taken
            - calendar_already_linked
            - staff_has_calendar
            - import_running
            - import_preview_changed
            - export_not_in_review
            - google_primary
            - staff_has_assignments
            - patient_has_schedules
            - cutover_open
            - cutover_not_google_primary
            - cutover_sync_not_ready
            - cutover_not_open
            - cutover_incomplete
            - calendar_not_linked
            - google_write_pending
            - google_event_changed
            - google_event_not_found
            - google_calendar_unwritable
            - google_event_rejected
            - google_write_unknown
            - google_unavailable
        message:
          type: string
          description: 人が読む日本語の説明。文言は変わることがあるので、利用者の分岐は `code` で行う
    Facility:
      type: object
      required: [id, name, source_mode, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        source_mode: { $ref: "#/components/schemas/SourceMode" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Unit:
      description: 部署
      type: object
      required: [id, facility_id, name, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Team:
      type: object
      required: [id, facility_id, name, color, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        color: { $ref: "#/components/schemas/TeamColor" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamColor:
      description: |
        チームの色。画面は packages/ui のチームの色のトークン（team- の後ろがこの値）で塗る。事業所の中で重なってよい。
        並びは、色を省いて作ったチームに選ぶ順である。
      type: string
      enum: [blue, orange, magenta, cyan, yellow, purple, green, lime]
    Policy:
      type: object
      description: 職員に与える権限。9 つのレコードをマイグレーションが入れ、API では作らない
      required: [id, code, name, needs_target, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        code:
          type: string
          description: 認可が読む権限の識別子
          example: schedule.team.read
        name: { type: string }
        needs_target:
          type: boolean
          description: true なら、対象の職員かチームを指定して与える
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Position:
      type: object
      required: [id, facility_id, name, policies, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        policies:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
    Staff:
      type: object
      required:
        - id
        - username
        - email
        - phone_number
        - facility_id
        - department
        - team
        - position
        - visits
        - status
        - leave_started_at
        - leave_return_date
        - retired_at
        - created_at
        - updated_at
      properties:
        id: { $ref: "#/components/schemas/ID" }
        username: { type: string }
        email:
          type: string
          format: email
          nullable: true
          description: 退職した職員では null
        phone_number:
          type: string
          nullable: true
          example: "+09000000000"
          description: 退職した職員では null
        facility_id: { $ref: "#/components/schemas/ID" }
        department: { $ref: "#/components/schemas/Ref" }
        team: { $ref: "#/components/schemas/Ref" }
        position: { $ref: "#/components/schemas/Ref" }
        visits:
          type: boolean
          description: 訪問するか。false の職員は、予定のカレンダーの職員の列と、予定と担当の候補に出ず、予定と担当を新しく割り振れない
        status: { $ref: "#/components/schemas/StaffStatus" }
        leave_started_at:
          type: string
          format: date-time
          nullable: true
          description: 職員を休職にした時刻。休職でなければ null
        leave_return_date:
          type: string
          format: date
          nullable: true
          description: 休職から戻る予定の日のメモ。この日に自動では戻さない。休職でないか、メモが無ければ null
        retired_at:
          type: string
          format: date-time
          nullable: true
          description: 職員を退職にした時刻。退職していなければ null
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StaffStatus:
      type: string
      enum: [active, on_leave, retired]
      description: |
        職員の状態。active は有効、on_leave は休職、retired は退職である。休職と退職の職員はログインできず、
        予定のカレンダーと予定の候補に出さない
    StaffAssignments:
      type: object
      description: 職員を休職、退職、訪問しない職員にするときに残る、その日以降の予定、繰り返しの予定、担当の利用者。職員が予定の職員、主訪問者、同行者のどれかの予定を含める
      required: [schedules, recurring_schedules, patients]
      properties:
        schedules:
          type: array
          description: その日以降のキャンセルしていない単発の予定。日時の順
          items:
            type: object
            required: [id, date, start_time, end_time]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              date: { $ref: "#/components/schemas/Date" }
              start_time: { $ref: "#/components/schemas/Time" }
              end_time: { $ref: "#/components/schemas/Time" }
        recurring_schedules:
          type: array
          description: その日以降に終わる繰り返しの予定。終了日の無い繰り返しを含める。最初の回の日時の順
          items:
            type: object
            required: [id, date, end_date, start_time, end_time]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              date:
                allOf: [{ $ref: "#/components/schemas/Date" }]
                description: 最初の回の日付
              end_date:
                type: string
                format: date
                nullable: true
                description: 終了日。終了日が無ければ null
              start_time: { $ref: "#/components/schemas/Time" }
              end_time: { $ref: "#/components/schemas/Time" }
        patients:
          type: array
          description: 職員が主に担当する利用中の利用者。利用の終了の利用者は含めない（ADR-0005）。名前の順
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              name: { type: string }
    StaffStatusChange:
      type: object
      required: [staff, assignments]
      properties:
        staff: { $ref: "#/components/schemas/StaffDetail" }
        assignments: { $ref: "#/components/schemas/StaffAssignments" }
    RetireConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            assignments:
              allOf: [{ $ref: "#/components/schemas/StaffAssignments" }]
              description: code が staff_has_assignments のとき、残る予定と担当の利用者
    StaffDetail:
      allOf:
        - $ref: "#/components/schemas/Staff"
        - type: object
          required: [sub, policies]
          properties:
            sub:
              type: string
              nullable: true
              description: ID ブローカーの職員の ID。登録のときにブローカーが発行する。ブローカーで職員を作る前に登録した職員では null
            policies:
              type: array
              items:
                type: object
                required: [user_policy_id, policy_id, code, name, target_user_ids, target_team_ids]
                properties:
                  user_policy_id: { $ref: "#/components/schemas/ID" }
                  policy_id: { $ref: "#/components/schemas/ID" }
                  code: { type: string, description: 権限の code }
                  name: { type: string }
                  target_user_ids:
                    type: array
                    description: 権限が及ぶ職員。needs_target が false の権限では空
                    items: { $ref: "#/components/schemas/ID" }
                  target_team_ids:
                    type: array
                    description: 権限が及ぶチーム。needs_target が false の権限では空
                    items: { $ref: "#/components/schemas/ID" }
    PreferredTime:
      type: string
      enum: [午前, 午後]
    PreferredGender:
      type: string
      enum: [男性, 女性]
    Patient:
      type: object
      required:
        - id
        - facility_id
        - name
        - preferred_time
        - preferred_gender
        - service_code_id
        - service_code
        - assigned_staff_id
        - assigned_staff_name
        - ended_at
        - created_at
        - updated_at
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        preferred_time: { $ref: "#/components/schemas/PreferredTime" }
        preferred_gender: { $ref: "#/components/schemas/PreferredGender" }
        service_code_id: { $ref: "#/components/schemas/ID" }
        service_code: { type: string }
        assigned_staff_id: { $ref: "#/components/schemas/ID" }
        assigned_staff_name: { type: string }
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: 利用の終了にした時刻。利用中なら null
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatientSchedules:
      type: object
      description: 利用者の利用を終了するときに残る、その日以降の予定と繰り返しの予定。訪問の情報の利用者がその利用者の予定を含める
      required: [schedules, recurring_schedules]
      properties:
        schedules:
          type: array
          description: その日以降のキャンセルしていない単発の予定。日時の順
          items:
            type: object
            required: [id, date, start_time, end_time]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              date: { $ref: "#/components/schemas/Date" }
              start_time: { $ref: "#/components/schemas/Time" }
              end_time: { $ref: "#/components/schemas/Time" }
        recurring_schedules:
          type: array
          description: その日以降に終わる繰り返しの予定。終了日の無い繰り返しを含める。最初の回の日時の順
          items:
            type: object
            required: [id, date, end_date, start_time, end_time]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              date:
                allOf: [{ $ref: "#/components/schemas/Date" }]
                description: 最初の回の日付
              end_date:
                type: string
                format: date
                nullable: true
                description: 終了日。終了日が無ければ null
              start_time: { $ref: "#/components/schemas/Time" }
              end_time: { $ref: "#/components/schemas/Time" }
    EndServiceConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            schedules:
              allOf: [{ $ref: "#/components/schemas/PatientSchedules" }]
              description: code が patient_has_schedules のとき、残る予定と繰り返しの予定
    ServiceCode:
      type: object
      required: [id, code, service_time_range_start, service_time_range_end]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        code: { type: string }
        service_time_range_start: { type: integer, description: 分 }
        service_time_range_end: { type: integer, description: 分 }
    VisitCategory:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
    ScheduleTypeName:
      type: string
      enum: [通常, 訪問]
      description: 通常の予定はタイトルを、訪問の予定は訪問の情報を必須とする
    ScheduleType:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { $ref: "#/components/schemas/ScheduleTypeName" }
    VisitInfoRequest:
      type: object
      required: [patient_id, assigned_staff_id, service_code_id]
      properties:
        patient_id: { $ref: "#/components/schemas/ID" }
        assigned_staff_id: { $ref: "#/components/schemas/ID" }
        companion_id:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ID"
        service_code_id: { $ref: "#/components/schemas/ID" }
        visit_category_ids:
          type: array
          items: { $ref: "#/components/schemas/ID" }
    SlotRequest:
      type: object
      required: [schedule_type_id, date, start_time, end_time, staff_id]
      properties:
        schedule_type_id: { $ref: "#/components/schemas/ID" }
        date: { $ref: "#/components/schemas/Date" }
        start_time: { $ref: "#/components/schemas/Time" }
        end_time:
          description: ends_next_day が false なら start_time より後、true なら start_time より前。start_time と同じ時刻にはできない
          allOf:
            - $ref: "#/components/schemas/Time"
        ends_next_day:
          type: boolean
          description: 終了が date の翌日の end_time か。省くと false。翌日の 0:00 に終わる予定は、end_time を 00:00 にして true にする
        staff_id: { $ref: "#/components/schemas/ID" }
        title: { type: string, nullable: true, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000 }
        visit_info:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VisitInfoRequest"
    VisitInfo:
      type: object
      required:
        - id
        - patient_id
        - patient_name
        - assigned_staff_id
        - assigned_staff_name
        - companion_id
        - companion_name
        - service_code_id
        - service_code
        - visit_categories
      properties:
        id: { $ref: "#/components/schemas/ID" }
        patient_id: { $ref: "#/components/schemas/ID" }
        patient_name: { type: string }
        assigned_staff_id: { $ref: "#/components/schemas/ID" }
        assigned_staff_name: { type: string }
        companion_id:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ID"
        companion_name: { type: string, nullable: true }
        service_code_id: { $ref: "#/components/schemas/ID" }
        service_code: { type: string }
        visit_categories:
          type: array
          items: { $ref: "#/components/schemas/VisitCategory" }
    Cancel:
      type: object
      required: [id, schedule_id, reason]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        schedule_id: { $ref: "#/components/schemas/ID" }
        reason: { type: string }
    Schedule:
      type: object
      required:
        - id
        - facility_id
        - schedule_type_id
        - schedule_type
        - date
        - start_time
        - end_time
        - ends_next_day
        - is_over_time_work
        - staff_id
        - staff_name
        - title
        - description
        - recurring_schedule_id
        - visit_info
        - cancel
        - source
        - review_reason
        - created_at
        - updated_at
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        schedule_type_id: { $ref: "#/components/schemas/ID" }
        schedule_type: { $ref: "#/components/schemas/ScheduleTypeName" }
        date: { $ref: "#/components/schemas/Date" }
        start_time: { $ref: "#/components/schemas/Time" }
        end_time: { $ref: "#/components/schemas/Time" }
        ends_next_day:
          type: boolean
          description: date の翌日の end_time に終わる予定のとき true
        is_over_time_work:
          type: boolean
          description: 17 時以降に始まる予定のとき true
        staff_id: { $ref: "#/components/schemas/ID" }
        staff_name: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        recurring_schedule_id:
          description: |
            繰り返しの予定の 1 回を置き換えた予定のとき、元の繰り返しの予定。
            google_primary の事業所で、繰り返しの親を展開した回のときは、親の予定の一覧での ID で、changeRecurringRule の recurring_schedule_id に使う
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ID"
        recurring_rule:
          description: |
            google_primary の事業所で、繰り返しの親を展開した回のときの、親の繰り返しの規則。ほかの予定では null である。
            指定しない項目は、親の最初の日付の曜日や日から決まり、展開した回の日付の曜日や日と同じである（ADR-0037）
          type: object
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/RecurringRule"
        visit_info:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VisitInfo"
        cancel:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Cancel"
        source:
          type: string
          enum: [buddy, google_calendar]
          description: |
            予定の読み元。buddy は buddy の予定、google_calendar は google_primary の事業所で同期が写した Google カレンダーの予定（Projection）である。
            google_calendar の予定は、etag を付けて変更と取り消しができる。繰り返しの回も同じで、回の etag は親の予定の etag である。
        etag:
          description: |
            google_calendar の予定の、Google カレンダーの etag。予定を変えるか取り消すときに送る。
            buddy の予定では null で、繰り返しの回では親の予定の etag である
          type: string
          nullable: true
          x-omitempty: false
        review_reason:
          description: google_calendar の予定のうち、確認が必要な予定の理由。ほかの予定では null
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleReviewReason"
        created_at:
          type: string
          format: date-time
          description: google_calendar の予定では、Google で最後に変えた時刻（無ければ写した時刻）
        updated_at:
          type: string
          format: date-time
          description: google_calendar の予定では、Google で最後に変えた時刻（無ければ写した時刻）
    ScheduleReviewReason:
      type: string
      enum: [recurrence_unsupported, patient_not_found, patient_ambiguous, service_code_not_found, title_unreadable, title_mismatch]
      description: |
        Google カレンダーの予定を、buddy の予定に読み替えられなかった理由。
        recurrence_unsupported は buddy の繰り返しの規則に写せない繰り返しの予定で、回に展開せず最初の回の 1 件で返す。
        patient_not_found と patient_ambiguous はタイトルの利用者名の利用者がいないか 2 人以上いる予定、
        service_code_not_found はタイトルのサービス内容がサービスコードのマスタに無い予定、title_unreadable はタイトルが空か、訪問のタイトルを読めない予定である。
        patient_not_found、patient_ambiguous、service_code_not_found、title_unreadable の予定は、訪問の情報（visit_info）を空にし、
        Google のタイトルを title に入れた通常の予定として返す。
        title_mismatch は、buddy で訪問の情報を入力した予定のうち、Google でタイトルを変え、タイトルの利用者かサービス内容が
        buddy の訪問の情報と違う予定である。訪問の情報は buddy の内容で返す（ADR-0029）。
    SourceMode:
      type: string
      enum: [google_primary, buddy_primary]
      description: 事業所の予定の正本。google_primary は Google カレンダー、buddy_primary は buddy である（ADR-0029）
    CalendarSyncStatus:
      type: object
      description: 結び付けたカレンダーの同期の状況
      required: [external_calendar_id, staff_id, staff_name, last_status, last_succeeded_at, last_error]
      properties:
        external_calendar_id: { $ref: "#/components/schemas/ID" }
        staff_id: { $ref: "#/components/schemas/ID" }
        staff_name: { type: string }
        last_status:
          type: string
          enum: [never, succeeded, failed]
          description: 最後の同期の結果。never はまだ同期していない
        last_succeeded_at:
          description: 変わった予定を最後まで読んで写した、最後の同期の時刻。成功したことが無ければ null
          type: string
          format: date-time
          nullable: true
        last_error:
          description: |
            最後の同期の失敗の理由。最後の同期が成功したか、まだ同期していなければ null。
            unreadable はカレンダーが無いかサービスアカウントに共有されていない、unavailable は Google カレンダーに届かないかエラーが返った、
            apply は読んだ予定を写せなかったことを表す
          type: string
          nullable: true
          enum: [unreadable, unavailable, apply]
    RecurringRule:
      type: object
      required: [frequency]
      description: |
        weekly は days_of_week と interval だけを、monthly は day_of_month だけか、week_of_month と day_of_week の組を指定できる。
        指定しない項目は、最初の日付の曜日や日から決める。
        最初の日付が規則の回に当たらない組み合わせ（火曜の最初の日付に毎週の月曜など）は、入力のエラーにする。
        weekly の回は、日曜に始まる週で数え、最初の日付を含む週を 1 週目として、1 週目から interval の倍数だけ後の週の days_of_week の曜日にある（ADR-0038）。
        繰り返しの終わりは end_date だけで持ち、回数は持たない。
      # レスポンスでは、値のない項目も省かず null で返す。x-omitempty は oapi-codegen が読み、Go の型から omitempty を外す
      properties:
        frequency: { type: string, enum: [weekly, monthly] }
        days_of_week:
          description: |
            weekly の曜日。1 が月曜、7 が日曜で、重ならない 1 つ以上の曜日を指定する。省くと最初の日付の曜日の 1 つにする。
            レスポンスでは、weekly は月曜から日曜の順に並べて必ず返し、monthly は null である
          type: array
          nullable: true
          minItems: 1
          maxItems: 7
          uniqueItems: true
          x-omitempty: false
          items: { type: integer, minimum: 1, maximum: 7 }
        interval:
          description: |
            weekly の間隔の週の数。1 が毎週、2 が隔週である。weekly で省くと 1 にする。monthly には指定できない（1 も 400 になる）。
            レスポンスでは、weekly は必ず返し、monthly は null である
          type: integer
          nullable: true
          minimum: 1
          maximum: 52
          x-omitempty: false
        day_of_week:
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
          x-omitempty: false
          description: monthly の week_of_month の週の曜日。1 が月曜、7 が日曜。weekly には指定できない
        day_of_month: { type: integer, nullable: true, minimum: 1, maximum: 31, x-omitempty: false }
        week_of_month: { type: integer, nullable: true, minimum: 1, maximum: 5, x-omitempty: false }
        end_date:
          description: この日を含む
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Date"
    RecurringSchedule:
      type: object
      required:
        - id
        - facility_id
        - schedule_type_id
        - schedule_type
        - date
        - start_time
        - end_time
        - ends_next_day
        - is_over_time_work
        - staff_id
        - staff_name
        - title
        - description
        - visit_info
        - recurring_rule
        - exclusion_dates
        - created_at
        - updated_at
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        schedule_type_id: { $ref: "#/components/schemas/ID" }
        schedule_type: { $ref: "#/components/schemas/ScheduleTypeName" }
        date:
          description: 最初の回の日付
          allOf:
            - $ref: "#/components/schemas/Date"
        start_time: { $ref: "#/components/schemas/Time" }
        end_time: { $ref: "#/components/schemas/Time" }
        ends_next_day:
          type: boolean
          description: 全ての回が、回の日付の翌日の end_time に終わるとき true
        is_over_time_work: { type: boolean }
        staff_id: { $ref: "#/components/schemas/ID" }
        staff_name: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        visit_info:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VisitInfo"
        recurring_rule: { $ref: "#/components/schemas/RecurringRule" }
        exclusion_dates:
          type: array
          description: 単発の予定に置き換えたため、繰り返しから外した日付
          items: { $ref: "#/components/schemas/Date" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CalendarID:
      type: string
      minLength: 1
      maxLength: 1024
      description: Google のカレンダーの ID。職員のカレンダーでは、職員のメールアドレスのことがある
      example: staff@example.com
    ImportRun:
      type: object
      required: [id, range_start, range_end, status, imported_count, skipped_count, started_at, finished_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        range_start: { $ref: "#/components/schemas/Date" }
        range_end:
          description: この日を含む。切り替えの取り込みでは、期間が終わりを持たないので null
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Date"
        status: { type: string, enum: [running, succeeded, failed] }
        imported_count: { type: integer, minimum: 0 }
        skipped_count:
          type: integer
          minimum: 0
          description: 取り込まない予定と、取り込まないを選んだ予定の数
        started_at: { type: string, format: date-time }
        finished_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
    CalendarExport:
      type: object
      description: 1 つの予定を Google カレンダーに書き出す待ち。書くときは、書く時点の予定の内容を書く
      required: [id, schedule_id, recurring_schedule_id, status, error_code, attempts, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        schedule_id:
          description: 単発の予定。recurring_schedule_id と排他
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/ID"
        recurring_schedule_id:
          description: 繰り返しの予定。schedule_id と排他
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/ID"
        status:
          type: string
          enum: [pending, succeeded, conflict, failed]
          description: |
            pending は書く待ち、succeeded は書き終えた、conflict は Google カレンダーで予定が変わっていたか消えていたので書かずに止めたか、
            Google カレンダーの変更を buddy に当てずに止めた、failed は書く権限が無いか、再送の上限まで書けなかった
        error_code:
          type: string
          enum: [precondition_failed, not_found, forbidden, rejected, unavailable, unappliable, not_buddy_primary]
          nullable: true
          x-omitempty: false
          description: |
            最後に書けなかった理由。precondition_failed は buddy と Google カレンダーの両方で予定が変わった（消された予定を除く書き出しの 412 を含む）、
            not_found は Google カレンダーで予定が消されたか、予定かカレンダーが見つからない（410、404、消された予定への 412）、
            forbidden はサービスアカウントがカレンダーに書けない、rejected は Google が予定の内容を受け付けなかった（400）、
            unavailable は Google に届かないか一時的なエラーが続いた、unappliable は Google カレンダーの変更を buddy の予定に読み替えられない
            （終日にした予定、タイトルの利用者を引けない予定、繰り返しの予定そのものの変更）。
            not_buddy_primary は事業所が buddy を予定の正本にしていないので、書かずに保留にした（ADR-0029）
        attempts:
          type: integer
          minimum: 0
          description: 書こうとした回数
        updated_at: { type: string, format: date-time }
    CalendarExportIssue:
      description: 確認が必要な書き出しと、その予定の日時と職員。繰り返しの予定の date は最初の回の日付
      allOf:
        - $ref: "#/components/schemas/CalendarExport"
        - type: object
          required: [staff_id, staff_name, date, start_time, end_time, ends_next_day, acceptable]
          properties:
            staff_id: { $ref: "#/components/schemas/ID" }
            staff_name: { type: string }
            date: { $ref: "#/components/schemas/Date" }
            start_time: { $ref: "#/components/schemas/Time" }
            end_time: { $ref: "#/components/schemas/Time" }
            ends_next_day:
              type: boolean
              description: date の翌日の end_time に終わる予定のとき true
            acceptable:
              type: boolean
              description: |
                Google カレンダーで予定が変わったか消えたので書けなかった、buddy でキャンセルしていない単発の予定か。
                error_code が precondition_failed か not_found のときに true
    ExternalCalendar:
      type: object
      required: [id, facility_id, staff_id, provider, calendar_id, created_at, updated_at, last_import]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        staff_id: { $ref: "#/components/schemas/ID" }
        provider: { type: string, enum: [google] }
        calendar_id: { $ref: "#/components/schemas/CalendarID" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_import:
          description: 最も新しく始めた取り込み。取り込んだことが無ければ null
          type: object
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/ImportRun"
    ImportRange:
      type: object
      required: [range_start]
      description: |
        事業所に open の予定の正本の切り替えがあるときは、range_start を切り替えの range_start にし、range_end を省くか null にする（ADR-0031）。
        ほかの期間は 400 になる。open の切り替えが無いときは、range_end を省けない。
      properties:
        range_start:
          description: 期間の最初の日。この日から range_end までに始まる予定を取り込む
          allOf:
            - $ref: "#/components/schemas/Date"
        range_end:
          description: 期間の最後の日。この日を含む。range_start 以降で、range_start から 1 年未満の日。切り替えの取り込みでは null
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Date"
    ImportCounts:
      type: object
      description: |
        件数は Google の予定の数で数え、繰り返しのまま取り込む予定は 1 件、回ごとにした予定は 1 回を 1 件に数える。
      required:
        - import
        - import_visit
        - import_normal
        - expanded_occurrences
        - recurring
        - recurring_as_rule
        - recurring_expanded
        - needs_review
        - skipped
        - already_imported
        - overwrite
      properties:
        import: { type: integer, minimum: 0, description: 確認が必要な予定を除いて、取り込む予定の数 }
        import_visit: { type: integer, minimum: 0, description: import のうち、訪問の予定の数 }
        import_normal: { type: integer, minimum: 0, description: import のうち、通常の予定の数 }
        expanded_occurrences: { type: integer, minimum: 0, description: import のうち、繰り返しを回ごとにした回の数 }
        recurring: { type: integer, minimum: 0, description: 取り込む繰り返しの予定の数 }
        recurring_as_rule: { type: integer, minimum: 0, description: recurring のうち、繰り返しのまま取り込む予定の数 }
        recurring_expanded: { type: integer, minimum: 0, description: recurring のうち、回ごとにする予定の数 }
        needs_review: { type: integer, minimum: 0, description: 取り込み方を選ぶ予定の数 }
        skipped: { type: integer, minimum: 0, description: 取り込まない予定の数 }
        already_imported: { type: integer, minimum: 0, description: 前の取り込みで取り込んだ予定の数 }
        overwrite:
          type: integer
          minimum: 0
          description: 切り替えの取り込みで、取り込んだ後に Google で変わったか消えた予定の数。確定すると buddy の写しを消し、Google の今の内容で取り込み直す。ほかの取り込みでは 0
    PatientCandidate:
      type: object
      required: [patient_id, name, assigned_staff_name]
      properties:
        patient_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        assigned_staff_name: { type: string }
    ImportReviewItem:
      type: object
      required: [external_event_id, revision, date, start_time, end_time, ends_next_day, service, client_name, reason, recurrence, candidates]
      properties:
        external_event_id:
          type: string
          description: 取り込み方を送るときの Google の予定の ID。繰り返しの予定とその回では、親の予定の ID
        revision:
          type: string
          description: まとめた Google の予定の ID と etag から作るバージョン。取り込み方と一緒に送り返す。プレビューの後に予定が変わると変わる
        date:
          description: 予定の日付。繰り返しの予定は最初の回の日付
          allOf:
            - $ref: "#/components/schemas/Date"
        start_time: { $ref: "#/components/schemas/Time" }
        end_time: { $ref: "#/components/schemas/Time" }
        ends_next_day:
          type: boolean
          description: date の翌日の end_time に終わる予定のとき true。繰り返しの予定は最初の回の値
        service: { type: string, description: タイトルから読んだサービス内容 }
        client_name: { type: string, description: タイトルから読んだ利用者名 }
        reason:
          type: string
          enum: [patient_not_found, patient_ambiguous, recurrence_unsupported]
          description: |
            patient_not_found は利用者がいない、patient_ambiguous は同じ名前の利用者が 2 人以上いる。
            recurrence_unsupported は buddy の繰り返しの規則に写せない繰り返しの予定で、切り替えの取り込みだけが返し、回に展開しない。取り込み方は skip だけを選べる
        recurrence:
          description: 繰り返しのまま取り込む予定の規則。ほかの予定では null
          type: object
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/RecurringRule"
        candidates:
          type: array
          description: 同じ名前の利用者。patient_not_found では空
          items: { $ref: "#/components/schemas/PatientCandidate" }
    ImportSkippedItem:
      type: object
      description: 取り込まない予定の、読めた日時と理由。タイトルは利用者名を含むので返さない
      required: [date, start_time, end_time, ends_next_day, all_day, reason]
      properties:
        date:
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Date"
        start_time:
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Time"
        end_time:
          type: string
          nullable: true
          x-omitempty: false
          description: 日をまたぐ予定では、翌日の時刻
          allOf:
            - $ref: "#/components/schemas/Time"
        ends_next_day:
          type: boolean
          description: date の翌日の end_time に終わる予定に読み替えた予定のとき true。reason が multi_day の予定では false
        all_day: { type: boolean }
        reason:
          type: string
          enum: [all_day, multi_day, unreadable_time, zero_length, unreadable_title, service_not_found, staff_on_leave, staff_non_visiting]
          description: |
            all_day は終日、multi_day は終了が開始の翌日より後か、長さが 24 時間以上（翌日に終わる 24 時間未満の予定は含まない）、unreadable_time は日時を読めない、
            zero_length は長さが無い、unreadable_title はタイトルが空白だけか訪問のタイトルを読めない、
            service_not_found はタイトルのサービス内容がサービスコードに無い、
            staff_on_leave はカレンダーを結び付けた職員が休職しているので作らない新しい予定、
            staff_non_visiting はカレンダーを結び付けた職員が訪問しない職員なので作らない新しい予定
    ImportPreview:
      type: object
      required: [range_start, range_end, counts, needs_review, skipped]
      properties:
        range_start: { $ref: "#/components/schemas/Date" }
        range_end:
          description: 切り替えの取り込みでは、期間が終わりを持たないので null
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Date"
        counts: { $ref: "#/components/schemas/ImportCounts" }
        needs_review:
          type: array
          description: 取り込み方を選ぶ予定。日時の順
          items: { $ref: "#/components/schemas/ImportReviewItem" }
        skipped:
          type: array
          description: 取り込まない予定。日時の順で、日時の無い予定は最後
          items: { $ref: "#/components/schemas/ImportSkippedItem" }
    ImportDecision:
      type: object
      required: [external_event_id, revision, action]
      properties:
        external_event_id: { type: string, minLength: 1, maxLength: 1024 }
        revision:
          type: string
          minLength: 1
          maxLength: 64
          description: 取り込み方を選んだプレビューの needs_review の revision。確定のときのバージョンと違えば 409（import_preview_changed）になる
        action:
          type: string
          enum: [patient, normal, skip]
          description: |
            patient は選んだ利用者の訪問の予定に、normal は外部の予定のタイトルを buddy の予定のタイトルにした通常の予定にし、skip は取り込まない。
            reason が recurrence_unsupported の予定は skip だけを受ける
        patient_id:
          description: action が patient のときだけ指定する
          allOf:
            - $ref: "#/components/schemas/ID"
    ImportResult:
      allOf:
        - $ref: "#/components/schemas/ImportRun"
        - type: object
          required: [external_calendar_id, already_imported_count]
          properties:
            external_calendar_id: { $ref: "#/components/schemas/ID" }
            already_imported_count:
              type: integer
              minimum: 0
              description: 前の取り込みで取り込んでいて、今回は書かなかった予定の数
    CalendarCutover:
      type: object
      description: 事業所の予定の正本を Google カレンダーから buddy に切り替える作業の記録（ADR-0031）
      required: [id, facility_id, status, range_start, started_by, started_at, finished_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        facility_id: { $ref: "#/components/schemas/ID" }
        status:
          type: string
          enum: [open, completed, canceled]
          description: open は切り替え中、completed は完了して事業所を buddy_primary にした、canceled はやめた
        range_start:
          description: 取り込みの期間の最初の日。切り替えを始めた月の初日で、期間は終わりを持たない
          allOf:
            - $ref: "#/components/schemas/Date"
        started_by: { $ref: "#/components/schemas/ID" }
        started_at: { type: string, format: date-time }
        finished_at:
          description: 完了したかやめた時刻。open なら null
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
    CalendarCutoverCalendar:
      description: 切り替えの状況のうち、結び付けたカレンダー 1 つの同期の状況と、この切り替えで最後に成功した取り込み
      allOf:
        - $ref: "#/components/schemas/CalendarSyncStatus"
        - type: object
          required: [last_import]
          properties:
            last_import:
              description: この切り替えで最後に成功した取り込み。取り込んでいないか、open の切り替えが無ければ null
              type: object
              nullable: true
              x-omitempty: false
              allOf:
                - $ref: "#/components/schemas/ImportRun"
    CalendarCutoverState:
      type: object
      required: [cutover, calendars]
      properties:
        cutover:
          description: open の切り替え。無ければ null
          type: object
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/CalendarCutover"
        calendars:
          type: array
          description: 事業所の外していない全てのカレンダー
          items: { $ref: "#/components/schemas/CalendarCutoverCalendar" }
    CalendarCutoverUnmet:
      type: object
      description: 切り替えの完了の確認を満たさないカレンダーか予定。予定のタイトルは利用者名を含むので返さない
      required: [external_calendar_id, staff_id, staff_name, reason, external_event_id, date, start_time, end_time, ends_next_day, review_reason]
      properties:
        external_calendar_id: { $ref: "#/components/schemas/ID" }
        staff_id: { $ref: "#/components/schemas/ID" }
        staff_name: { type: string }
        reason:
          type: string
          enum: [not_imported, sync_stale, event_not_imported, needs_review, changed, deleted]
          description: |
            not_imported はカレンダーをこの切り替えで取り込んでいない、sync_stale は最後の取り込みの後に同期が成功していない。
            event_not_imported は取り込んでいない Google の予定（取り込んだ後に作った予定、取り消した回を含む）、
            needs_review は確認が必要な予定の取り込み方を決めていないか決めた後に変わった（規則に写せない繰り返しを含む）、
            changed は取り込んだ後に Google で変わった、deleted は取り込んだ後に Google で消えた予定である。
            not_imported と sync_stale は、予定の項目を持たない
        external_event_id:
          description: Google の予定の ID。カレンダーの理由と、取り消した回では null
          type: string
          nullable: true
          x-omitempty: false
        date:
          description: 予定の日付。読めなかった予定と、Google で消えた予定では null
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Date"
        start_time:
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Time"
        end_time:
          type: string
          nullable: true
          x-omitempty: false
          allOf:
            - $ref: "#/components/schemas/Time"
        ends_next_day:
          type: boolean
          description: date の翌日の end_time に終わる予定のとき true
        review_reason:
          description: needs_review のときの確認が必要な理由。ほかの理由では null
          type: string
          nullable: true
          x-omitempty: false
          enum: [patient_not_found, patient_ambiguous, recurrence_unsupported]
    CalendarCutoverIncomplete:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            items:
              type: array
              description: code が cutover_incomplete のとき、満たさないカレンダーと予定。カレンダーの順に、カレンダーの中は日時の順（日時の無い予定は最後）
              items: { $ref: "#/components/schemas/CalendarCutoverUnmet" }
    OpenCalendarCutover:
      type: object
      description: 予定の正本を buddy に切り替えている間の、open の切り替え
      required: [started_at, started_by, started_by_name, range_start]
      properties:
        started_at: { type: string, format: date-time }
        started_by:
          description: 切り替えを始めた職員
          allOf:
            - $ref: "#/components/schemas/ID"
        started_by_name:
          type: string
          description: 切り替えを始めた職員の名前。職員の状態（休職、退職）によらず返し、予定の一覧を読める全ての職員に返す
        range_start:
          description: 取り込みの期間の最初の日
          allOf:
            - $ref: "#/components/schemas/Date"
