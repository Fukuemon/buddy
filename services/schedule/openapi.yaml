            - $ref: "#/components/schemas/ID"
        service_code_id: { $ref: "#/components/schemas/ID" }
        visit_category_ids:
          type: array
          items: { $ref: "#/components/schemas/ID" }
    SlotRequest:
      type: object
      required: [schedule_type_id, date, start_time, end_time, staff_id]
      properties:
        schedule_type_id: { $ref: "#/components/schemas/ID" }
        date: { $ref: "#/components/schemas/Date" }
        start_time: { $ref: "#/components/schemas/Time" }
        end_time:
          description: start_time より後
          allOf:
            - $ref: "#/components/schemas/Time"
        staff_id: { $ref: "#/components/schemas/ID" }
        title: { type: string, nullable: true, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000 }
        visit_info:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VisitInfoRequest"
    VisitInfo:
      type: object
      required:
        - id
        - patient_id
        - patient_name
        - assigned_staff_id
        - assigned_staff_name
        - companion_id
        - companion_name
        - service_code_id
        - service_code
        - visit_categories
      properties:
        id: { $ref: "#/components/schemas/ID" }
        patient_id: { $ref: "#/components/schemas/ID" }
        patient_name: { type: string }
        assigned_staff_id: { $ref: "#/components/schemas/ID" }
        assigned_staff_name: { type: string }
        companion_id:
          type: string
