<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-edit 訪問の予定のメモ</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-edit.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-detail_予定の詳細/mocks/01-visit.html"></div>
            <div aria-label="予定の編集" class="wf-modal" data-testid="schedule-form-modal" role="dialog">
              <div class="wf-modal__header">
                <span aria-label="閉じる" class="wf-btn wf-btn--icon" data-m="2" data-testid="modal-close" data-escape data-go="../../schedule-detail_予定の詳細/mocks/01-visit.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
                <h2 class="wf-modal__title" data-m="3">予定の編集</h2>
              </div>
              <div class="wf-modal__body">
                <div class="wf-split" data-testid="schedule-form">
                  <div class="wf-stack">
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-date-time" data-go="03-initial.html">
                      <span class="wf-label">訪問日時</span>
                      <span>2026-10-20 09:00 - 09:29（29 分、訪看I2）</span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-patient" data-go="04-patient.html">
                      <span class="wf-label">利用者</span>
                      <span><span class="wf-text"></span></span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-staff" data-go="05-staff.html">
                      <span class="wf-label">担当者</span>
                      <span><span class="wf-text"></span></span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-category" data-go="06-category.html">
                      <span class="wf-label">訪問の種類</span>
                      <span>緊急</span>
                    </span>
                    <span class="wf-summary is-active" data-m="4" data-testid="schedule-field-description">
                      <span class="wf-label">メモ</span>
                      <span><span class="wf-text wf-text--l"></span></span>
                    </span>
                  </div>
                  <div>
                    <div class="wf-input wf-input--area" data-m="5" data-testid="schedule-form-description">
                      <span class="wf-label">メモ</span>
                      <span class="wf-text wf-text--l"></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn wf-btn--primary" data-m="6" data-testid="schedule-edit-submit" data-go="11-submitting.html">保存</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
