<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-edit 確認が必要な予定を訪問にする</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-edit.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-detail_予定の詳細/mocks/09-google-calendar-review.html"></div>
            <div aria-label="予定の編集" class="wf-modal" data-testid="schedule-form-modal" role="dialog">
              <div class="wf-modal__header">
                <h2 class="wf-modal__title wf-dialog__title" data-m="2">予定の編集</h2>
                <div class="wf-tabs se-kind" role="radiogroup" aria-label="予定の種類" data-m="3" data-testid="schedule-kind-tab">
                  <span class="wf-tab" data-testid="schedule-kind-tab-normal" data-go="16-needs-review.html">通常</span>
                  <span class="wf-tab is-active" data-testid="schedule-kind-tab-visit">訪問</span>
                </div>
              </div>
              <div class="wf-modal__body">
                <div class="wf-split" data-testid="schedule-form">
                  <div class="wf-stack">
                    <span class="wf-summary is-active" data-m="4" data-testid="schedule-field-date-time">
                      <span class="wf-label">訪問日時</span>
                      <span>2026-10-20 13:00 - 13:29（29 分、訪看I2）</span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-patient" data-go="04-patient.html">
                      <span class="wf-label">利用者</span>
                      <span class="se-placeholder" aria-hidden="true">選んでください</span><span class="wf-visually-hidden">未入力</span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-staff" data-go="05-staff.html">
                      <span class="wf-label">主訪問者</span>
                      <span><span class="wf-text"></span></span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-category" data-go="06-category.html">
                      <span class="wf-label">訪問の区分</span>
                      <span class="wf-visually-hidden">未入力</span>
                    </span>
                    <span class="wf-summary" data-m="4" data-testid="schedule-field-description" data-go="07-description.html">
                      <span class="wf-label">メモ</span>
                      <span class="wf-visually-hidden">未入力</span>
                    </span>
                  </div>
                  <div>
                    <div class="wf-pane">
                      <h3 class="wf-heading">訪問日時</h3>
                      <div class="wf-input" data-m="5" data-testid="schedule-form-date">
                        <span class="wf-label">訪問日</span>
                        <span>2026-10-20</span>
                      </div>
                      <div class="wf-row">
                        <div class="wf-input" data-m="6" data-testid="schedule-form-start-time">
                          <span class="wf-label">開始時間</span>
                          <span>13:00</span>
                        </div>
                        <div class="wf-input" data-m="7" data-testid="schedule-form-service-time">
                          <span class="wf-label">提供時間（分）</span>
                          <span>29</span>
                        </div>
                      </div>
                      <p class="wf-label" data-m="8" data-testid="schedule-form-end-time" style="margin: 0">終了時間 13:29</p>
                      <div class="wf-stack">
                        <h3 class="wf-heading">サービスコードを選んでください</h3>
                        <div class="wf-chips">
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">予防看I2</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">予防看I3</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">予防看I4</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">予防看I5</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">予防看I5・2超</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">医</span>
                          <span class="wf-chip is-on" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">訪看I2</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">訪看I3</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">訪看I4</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">訪看I5</span>
                          <span class="wf-chip" data-m="9" data-testid="service-code-{コード}" data-choice="service-code">訪看I5・2超</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn" data-escape data-m="10" data-testid="schedule-edit-cancel" data-go="../../schedule-detail_予定の詳細/mocks/09-google-calendar-review.html">キャンセル</span>
                <span class="wf-btn wf-btn--primary" data-m="11" data-testid="schedule-edit-submit" data-go="11-submitting.html">保存</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
