<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><画面 ID> 確認のダイアログ</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="screen-id.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <!-- 画面を書く。構成要素の表の要素に data-m="<番号>" を、E2E が指す要素に data-testid を付ける -->
          <!-- 画面の中の操作は、data-go、data-toggle、data-choice、data-open と data-close で付ける。書き方は画面仕様書の規約の「画面の中の操作」にある -->
          <main class="wf-page">
            <div class="wf-page-head">
              <div class="wf-title">
                <h1 class="wf-heading">一覧の見出し</h1>
                <span class="wf-help">
                  <span class="wf-btn wf-btn--icon wf-help__toggle" aria-label="ヘルプ" data-open="page-help" data-testid="<画面 ID>-help">?</span>
                  <p class="wf-help__panel" data-panel="page-help" data-panel-dismiss data-testid="<画面 ID>-help-text">初めてのときだけ要る説明を、1〜2 文で書く。</p>
                </span>
              </div>
              <span class="wf-btn wf-btn--primary" data-testid="<画面 ID>-new" data-go="02-form.html">登録</span>
            </div>
            <div class="wf-more">
              <p>常に出す説明の 1 文。</p>
              <span class="wf-btn wf-btn--text wf-more__toggle" aria-expanded="false" data-open="page-more" data-testid="<画面 ID>-more">詳しく</span>
              <div class="wf-more__body" data-panel="page-more" data-testid="<画面 ID>-more-text">
                <p>「詳しく」を押したときだけ出す、続きの説明。手順は番号付きの一覧にしてよい。</p>
              </div>
            </div>
            <div class="wf-list-tools">
              <div class="wf-search" data-testid="<画面 ID>-search"><span class="wf-label">名前で検索</span></div>
              <span class="wf-select" data-testid="<画面 ID>-filter-<項目>">区分: すべて</span>
              <span class="wf-select is-on" data-testid="<画面 ID>-filter-<項目>">状態: 有効</span>
              <span class="wf-count" data-testid="<画面 ID>-count">4 件</span>
            </div>
            <table class="wf-table wf-table--rows" data-testid="<画面 ID>-table">
              <thead>
                <tr>
                  <th>名前</th>
                  <th>区分</th>
                  <th>担当</th>
                  <th>状態</th>
                  <th><span class="wf-visually-hidden">詳細</span></th>
                </tr>
              </thead>
              <tbody>
                <tr data-testid="<画面 ID>-row-{id}" data-go="<詳細の画面のモック>">
                  <td class="wf-cell-primary">項目 A</td>
                  <td class="wf-cell-meta">区分 1</td>
                  <td class="wf-cell-meta">担当 A</td>
                  <td class="wf-cell-status"><span class="wf-status">有効</span></td>
                  <td class="wf-cell-go" aria-hidden="true">›</td>
                </tr>
                <tr data-testid="<画面 ID>-row-{id}" data-go="<詳細の画面のモック>">
                  <td class="wf-cell-primary">項目 B</td>
                  <td class="wf-cell-meta">区分 1</td>
                  <td class="wf-cell-meta">担当 B</td>
                  <td class="wf-cell-status"><span class="wf-status wf-status--warning">注意</span></td>
                  <td class="wf-cell-go" aria-hidden="true">›</td>
                </tr>
                <tr data-testid="<画面 ID>-row-{id}" data-go="<詳細の画面のモック>">
                  <td class="wf-cell-primary">項目 C</td>
                  <td class="wf-cell-meta">区分 2</td>
                  <td class="wf-cell-meta">担当 A</td>
                  <td class="wf-cell-status"><span class="wf-status">有効</span></td>
                  <td class="wf-cell-go" aria-hidden="true">›</td>
                </tr>
                <tr data-testid="<画面 ID>-row-{id}" data-go="<詳細の画面のモック>">
                  <td class="wf-cell-primary">項目 D</td>
                  <td class="wf-cell-meta">区分 2</td>
                  <td class="wf-cell-meta">担当 C</td>
                  <td class="wf-cell-status"><span class="wf-status wf-status--muted">終了</span></td>
                  <td class="wf-cell-go" aria-hidden="true">›</td>
                </tr>
              </tbody>
            </table>
          </main>
          <!-- 確認のダイアログの形。× を置かず、フッターの右に「キャンセル」と確定のボタンを置く。データを失う操作の確定のボタンは赤にする。形は画面仕様書の規約の「ダイアログ」にある -->
          <!-- 開くボタンは、一覧の行の先の詳細か、「…」のメニューに置く -->
          <div class="wf-overlay" tabindex="-1" data-m="1" data-go="01-initial.html"></div>
          <div class="wf-dialog wf-dialog--narrow" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" data-testid="<画面 ID>-confirm-dialog">
            <div class="wf-dialog__body">
              <h2 class="wf-heading" id="confirm-title" data-m="2">項目 A を削除しますか</h2>
              <p data-m="3">削除すると、項目 A の記録は戻せません。何が失われ、何が残るかを書く。</p>
            </div>
            <div class="wf-dialog__footer">
              <span class="wf-btn" data-escape data-m="4" data-testid="<画面 ID>-confirm-cancel" data-go="01-initial.html">キャンセル</span>
              <span class="wf-btn wf-btn--danger" data-m="5" data-testid="<画面 ID>-confirm-submit">削除する</span>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
