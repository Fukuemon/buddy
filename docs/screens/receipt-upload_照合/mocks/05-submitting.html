    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <header class="wf-site-header">
            <div class="wf-site-header__brand">
              <strong>buddy</strong>
              <strong class="wf-site-title" data-testid="site-title">照合</strong>
            </div>
            <div class="wf-site-header__actions">
                <span class="wf-site-icon" aria-label="アプリ" data-m="1" data-open="site-apps" data-testid="site-apps-open"><svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-160q-33 0-56.5-23.5T160-240q0-33 23.5-56.5T240-320q33 0 56.5 23.5T320-240q0 33-23.5 56.5T240-160Zm240 0q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm240 0q-33 0-56.5-23.5T640-240q0-33 23.5-56.5T720-320q33 0 56.5 23.5T800-240q0 33-23.5 56.5T720-160ZM240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400ZM240-640q-33 0-56.5-23.5T160-720q0-33 23.5-56.5T240-800q33 0 56.5 23.5T320-720q0 33-23.5 56.5T240-640Zm240 0q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Zm240 0q-33 0-56.5-23.5T640-720q0-33 23.5-56.5T720-800q33 0 56.5 23.5T800-720q0 33-23.5 56.5T720-640Z" fill="currentColor" /></svg></span>
                <nav class="wf-site-apps" aria-label="画面" data-panel="site-apps" data-panel-dismiss data-testid="site-nav"><span class="wf-site-apps__item" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html" data-testid="site-nav-schedule"><svg width="32" height="32" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Z" fill="currentColor" /></svg><span>予定</span></span><span class="wf-site-apps__item" aria-current="page" data-go="01-initial.html" data-testid="site-nav-receipt"><svg width="32" height="32" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm40-80h200v-80H200v80Zm382-80 198-198-57-57-141 142-57-57-56 57 113 113Zm-382-80h200v-80H200v80Zm0-160h200v-80H200v80Z" fill="currentColor" /></svg><span>照合</span></span></nav>
              <div class="wf-site-header__viewer" data-testid="viewer-menu">
              <span class="wf-site-avatar" aria-label="アカウント" data-m="2" data-open="viewer-menu" data-testid="viewer-menu-open">青</span>
              <div class="wf-site-viewer-menu" data-panel="viewer-menu" data-panel-dismiss>
                <span class="wf-text wf-text--s"></span>
                <span class="wf-btn" data-m="3" data-testid="viewer-logout">ログアウト</span>
              </div>
            </div>
          </div>
          </header>
          <div class="wf-site-body">
            <div class="wf-site-main">
              <main class="ru-main">
                <h1 class="wf-heading" data-m="4">照合</h1>
                <p class="ru-lead" data-m="5">予定と、電子カルテから書き出した実績の CSV を比べ、食い違いを不整合、予定のみ、実績のみ、整合の 4 つに分けます。</p>
                <form class="ru-form" data-testid="receipt-check-form">
                  <div class="ru-field">
                    <span class="wf-label">予定の取り方</span>
                    <div class="wf-tabs" role="radiogroup" aria-label="予定の取り方" data-m="6" data-testid="receipt-source">
                      <span class="wf-tab is-active" data-testid="receipt-source-calendar">Google カレンダー</span>
                      <span class="wf-tab" data-testid="receipt-source-csv" data-go="02-csv.html">予定の CSV</span>
                    </div>
                  </div>
                  <div class="ru-field">
                    <span class="wf-label">対象の月</span>
                    <div class="wf-input ru-month" data-m="7" data-testid="receipt-month">2024 年 04 月</div>
                    <span class="ru-hint">その月の 1 日から月末までの予定を、職員の Google カレンダーから取ります。</span>
                  </div>
                  <div class="ru-field">
                    <span class="wf-label">実績の CSV</span>
                    <div class="wf-input ru-file" data-m="8" data-testid="receipt-visits-file"><span class="wf-btn">ファイルを選択</span><span>visits.csv</span></div>
                    <span class="ru-hint">電子カルテから書き出した CSV。UTF-8 か Shift_JIS で、10 MB まで。</span>
                  </div>
                  <div>
                    <span class="wf-btn wf-btn--primary wf-btn--busy" aria-busy="true" data-m="9" data-testid="receipt-check-submit">照合する</span>
                  </div>
                </form>
              </main>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>

</html>
