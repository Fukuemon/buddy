<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-new 通常の予定</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-new.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html"></div>
            <div class="wf-modal" role="dialog" aria-label="予定の作成" data-testid="schedule-form-modal">
              <div class="wf-modal__header">
                <h2 class="wf-modal__title wf-dialog__title" data-m="2">予定の作成</h2>
                <div class="wf-tabs sn-kind" role="radiogroup" aria-label="予定の種類" data-m="3" data-testid="schedule-kind-tab">
                  <span class="wf-tab is-active" data-testid="schedule-kind-tab-normal">通常</span>
                  <span class="wf-tab" data-testid="schedule-kind-tab-visit" data-go="01-visit.html">訪問</span>
                </div>
                <span class="wf-btn wf-btn--icon" aria-label="閉じる" data-m="4" data-testid="modal-close" data-escape data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html">×</span>
              </div>
              <div class="wf-modal__body">
                <div class="wf-split" data-testid="schedule-form">
                  <ul class="wf-stack sn-fields">
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-title" data-go="03-title.html">
                        <span class="wf-label">タイトル</span>
                        <span>タイトル</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary is-active" aria-current="true" data-m="5" data-testid="schedule-field-date-time">
                        <span class="wf-label">予定日時</span>
                        <span>2024-04-01 09:00 - 10:00</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-staff">
                        <span class="wf-label">予定者</span>
                        <span>未選択</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-description">
                        <span class="wf-label">メモ</span>
                        <span>なし</span>
                      </span>
                    </li>
                  </ul>
                  <div>
                    <div class="wf-pane sn-pane--wide">
                      <h3 class="wf-heading">予定日時</h3>
                      <div class="wf-input" data-m="6" data-testid="schedule-form-date"><span class="wf-label">日付</span><span>2024-04-01</span></div>
                      <div class="wf-input" data-m="7" data-testid="schedule-form-start-time"><span class="wf-label">開始時間</span><span>09:00</span></div>
                      <div class="wf-input" data-m="8" data-testid="schedule-form-end-time"><span class="wf-label">終了時間</span><span>10:00</span></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn" data-m="9" data-testid="schedule-new-cancel" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html">キャンセル</span>
                <span class="wf-btn wf-btn--primary" data-m="10" data-testid="schedule-create-submit">作成</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
