<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-new 主訪問者の選択</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-new.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html"></div>
            <div class="wf-modal" role="dialog" aria-label="予定の作成" data-testid="schedule-form-modal">
              <div class="wf-modal__header">
                <h2 class="wf-modal__title wf-dialog__title" data-m="2">予定の作成</h2>
                <div class="wf-tabs sn-kind" role="radiogroup" aria-label="予定の種類" data-m="3" data-testid="schedule-kind-tab">
                  <span class="wf-tab" data-testid="schedule-kind-tab-normal" data-go="02-normal.html">通常</span>
                  <span class="wf-tab is-active" data-testid="schedule-kind-tab-visit">訪問</span>
                </div>
                <span class="wf-btn wf-btn--icon" aria-label="閉じる" data-m="4" data-testid="modal-close" data-escape data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html">×</span>
              </div>
              <div class="wf-modal__body">
                <div class="wf-split" data-testid="schedule-form">
                  <ul class="wf-stack sn-fields">
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-date-time" data-go="01-visit.html">
                        <span class="wf-label">訪問日時</span>
                        <span>2024-04-01 09:00 - 09:29（29 分、訪看I2）</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-patient" data-go="04-patient.html">
                        <span class="wf-label">利用者</span>
                        <span class="sn-placeholder" aria-hidden="true">選んでください</span><span class="wf-visually-hidden">未入力</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary is-active" aria-current="true" data-m="5" data-testid="schedule-field-staff">
                        <span class="wf-label">主訪問者</span>
                        <span class="sn-placeholder" aria-hidden="true">選んでください</span><span class="wf-visually-hidden">未入力</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-category" data-go="06-category.html">
                        <span class="wf-label">訪問の区分</span>
                        <span>通常</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-description" data-go="07-description.html">
                        <span class="wf-label">メモ</span>
                        <span class="wf-visually-hidden">未入力</span>
                      </span>
                    </li>
                  </ul>
                  <div>
                    <div class="wf-pane">
                      <h3 class="wf-heading">主訪問者を選んでください</h3>
                      <div class="wf-search" data-m="6" data-testid="staff-select-search">職員を検索</div>
                      <table class="wf-table">
                        <thead><tr><th>名前</th></tr></thead>
                        <tbody>
                        <tr><td><span class="wf-radio" data-m="7" data-testid="staff-select-option-{職員の id}" data-choice="staff"><span class="wf-text"></span></span></td></tr>
                        <tr><td><span class="wf-radio" data-m="7" data-testid="staff-select-option-{職員の id}" data-choice="staff"><span class="wf-text"></span></span></td></tr>
                        <tr><td><span class="wf-radio" data-m="7" data-testid="staff-select-option-{職員の id}" data-choice="staff"><span class="wf-text"></span></span></td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn" data-m="8" data-testid="schedule-new-cancel" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html">キャンセル</span>
                <span class="wf-btn wf-btn--primary" data-m="9" data-testid="schedule-create-submit" data-go="09-invalid.html">作成</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
