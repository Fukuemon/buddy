<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-new 入力エラー</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-new.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html"></div>
            <div class="wf-modal" role="dialog" aria-label="予定の作成" data-testid="schedule-form-modal">
              <div class="wf-modal__header">
                <span class="wf-btn wf-btn--icon" aria-label="閉じる" data-m="2" data-testid="modal-close" data-escape data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html">×</span>
                <div class="wf-tabs sn-kind" role="radiogroup" aria-label="予定の種類" data-m="3" data-testid="schedule-kind-tab">
                  <span class="wf-tab" data-testid="schedule-kind-tab-normal" data-go="02-normal.html">通常</span>
                  <span class="wf-tab is-active" data-testid="schedule-kind-tab-visit">訪問</span>
                </div>
                <h2 class="wf-modal__title" data-m="4">予定の作成</h2>
              </div>
              <div class="wf-modal__body">
                <div class="wf-split" data-testid="schedule-form">
                  <ul class="wf-stack sn-fields">
                    <li>
                      <span class="wf-summary is-active" aria-current="true" data-m="5" data-testid="schedule-field-date-time">
                        <span class="wf-label">訪問日時</span>
                        <span>2024-04-01 09:00 - 09:29（29 分、訪看I2）</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary is-invalid" data-m="5" data-testid="schedule-field-patient" data-go="04-patient.html">
                        <span class="wf-label">利用者</span>
                        <span>未選択</span>
                        <span class="wf-error" role="alert">利用者を選んでください</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary is-invalid" data-m="5" data-testid="schedule-field-staff" data-go="05-staff.html">
                        <span class="wf-label">担当者</span>
                        <span>未選択</span>
                        <span class="wf-error" role="alert">担当者を選んでください</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-category" data-go="06-category.html">
                        <span class="wf-label">訪問の種類</span>
                        <span>通常</span>
                      </span>
                    </li>
                    <li>
                      <span class="wf-summary" data-m="5" data-testid="schedule-field-description" data-go="07-description.html">
                        <span class="wf-label">メモ</span>
                        <span>なし</span>
                      </span>
                    </li>
                  </ul>
                  <div>
                    <div class="wf-pane sn-pane--wide">
                      <h3 class="wf-heading">訪問日時</h3>
                      <div class="wf-input" data-m="6" data-testid="schedule-form-date"><span class="wf-label">訪問日</span><span>2024-04-01</span></div>
                      <div class="wf-row">
                        <div class="wf-input" data-m="7" data-testid="schedule-form-start-time"><span class="wf-label">開始時間</span><span>09:00</span></div>
                        <div class="wf-input" data-m="8" data-testid="schedule-form-service-time"><span class="wf-label">提供時間（分）</span><span>29</span></div>
                      </div>
                      <p class="wf-label sn-end" data-m="9" data-testid="schedule-form-end-time">終了時間 09:29</p>
                      <fieldset class="wf-pane sn-group">
                        <legend class="wf-heading">サービスコードを選んでください</legend>
                        <div class="wf-chips">
                          <span class="wf-chip is-on" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">訪看I2</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">訪看I3</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">訪看I4</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">訪看I5</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">訪看I5・2超</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">予防看I2</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">予防看I3</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">予防看I4</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">予防看I5</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">予防看I5・2超</span>
                          <span class="wf-chip" data-m="10" data-testid="service-code-{コード}" data-choice="service-code">医</span>
                        </div>
                      </fieldset>
                    </div>
                  </div>
                </div>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn wf-btn--primary" data-m="11" data-testid="schedule-create-submit">作成</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
