<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>account-profile カレンダーを連携していない</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="account-profile.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <header class="wf-site-header">
            <div class="wf-site-header__brand">
              <span class="wf-btn wf-btn--icon wf-site-menu" aria-label="メニュー" data-open="site-nav" data-m="13" data-testid="site-nav-toggle"><svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" fill="currentColor" /></svg></span>
              <strong>buddy</strong>
            </div>
            <div class="wf-site-header__viewer" data-testid="viewer-menu">
              <span class="wf-site-account" aria-label="アカウント（青木 陽菜）" data-open="viewer-menu" data-m="2" data-testid="viewer-menu-open"><span class="wf-site-avatar" aria-hidden="true">青</span><span class="wf-site-account__name">青木 陽菜</span></span>
              <div class="wf-site-viewer-menu" data-panel="viewer-menu" data-panel-dismiss>
                <span class="wf-text wf-text--s">青木 陽菜</span>
                <span class="wf-btn wf-btn--text" data-m="3" data-testid="viewer-profile" data-go="01-profile.html">自分の情報</span>
                <span class="wf-btn" data-m="4" data-testid="viewer-logout">ログアウト</span>
              </div>
            </div>
          </header>
          <div class="wf-site-body">
            <nav class="wf-site-nav" aria-label="画面" data-m="1" data-testid="site-nav" data-panel="site-nav" data-panel-wide="collapse">
              <div class="wf-site-nav__head">
                <strong>buddy</strong>
                <span class="wf-btn wf-btn--icon" aria-label="閉じる" data-escape data-close="site-nav" data-testid="site-nav-close"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
              </div>
              <div class="wf-site-nav__group" role="group" aria-label="予定">
                <span class="wf-site-nav__heading" aria-hidden="true">予定</span>
                <span class="wf-site-nav__item" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html" data-testid="site-nav-schedule"><svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Z" fill="currentColor" /></svg><span class="wf-site-nav__label">カレンダー</span></span>
              </div>
            </nav>
            <div class="wf-overlay wf-site-nav-overlay" tabindex="-1" data-close="site-nav"></div>
            <div class="wf-site-main">
              <main class="wf-page">
                <div class="wf-page-head">
                  <h1 class="wf-heading" data-m="5" data-testid="account-profile-title">自分の情報</h1>
                </div>
                <section class="wf-panel ap-section" aria-label="プロフィール" data-testid="account-profile-profile">
                  <div class="ap-person">
                    <span class="wf-site-avatar ap-avatar" aria-hidden="true">青</span>
                    <div class="ap-person__text">
                      <strong class="ap-name" data-m="6" data-testid="account-profile-name">青木 陽菜</strong>
                      <span class="ap-muted" data-m="7" data-testid="account-profile-email">hina.aoki@example.com</span>
                    </div>
                  </div>
                  <dl class="ap-dl" data-m="8">
                    <dt>部署</dt><dd data-testid="account-profile-department">看護部</dd>
                    <dt>チーム</dt><dd data-testid="account-profile-team">東チーム</dd>
                    <dt>役職</dt><dd data-testid="account-profile-position">メンバー</dd>
                  </dl>
                </section>
                <section class="wf-panel ap-section" aria-labelledby="ap-policies" data-testid="account-profile-policies">
                  <h2 class="ap-h2" id="ap-policies">持っている権限</h2>
                  <ul class="ap-policy-items" data-m="9" data-testid="account-profile-policy-list">
                    <li class="ap-policy-item" data-testid="account-profile-policy-{権限の code}">自分の予定の編集</li>
                    <li class="ap-policy-item" data-testid="account-profile-policy-{権限の code}">指定した職員の予定の閲覧<span class="ap-policy-item__targets" data-m="10" data-testid="account-profile-policy-targets-{権限の code}">森 健太、佐藤 美咲</span></li>
                  </ul>
                </section>
                <section class="wf-panel ap-section" aria-labelledby="ap-calendar" data-m="11" data-testid="account-profile-calendar">
                  <h2 class="ap-h2" id="ap-calendar">カレンダーの連携</h2>
                  <p class="ap-muted" data-m="12" data-testid="account-profile-calendar-not-linked">連携していません。</p>
                </section>
              </main>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
