<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-cutover やめる前の確認</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-cutover.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <main class="wf-page">
            <div class="sc-title">
              <h1 class="wf-heading">予定の正本の切り替え</h1>
              <span class="wf-btn wf-btn--text" data-testid="calendar-cutover-link-settings" data-go="../../schedule-link_カレンダーの連携/mocks/01-list.html">カレンダーの連携</span>
            </div>
            <p class="wf-lead">Google カレンダーで管理している予定を buddy に取り込み、この事業所の予定の正本を buddy に切り替えます。切り替えた後は、予定を buddy で作成、変更し、Google カレンダーには buddy の予定を書き出します。</p>
          </main>
          <div class="wf-overlay" tabindex="-1" data-m="1" data-go="02-open.html"></div>
          <div class="wf-dialog wf-dialog--narrow" role="alertdialog" aria-modal="true" aria-labelledby="cancel-title" data-testid="calendar-cutover-cancel-confirm-dialog">
            <div class="wf-dialog__body">
              <h2 class="wf-heading" id="cancel-title" data-m="2">切り替えをやめますか</h2>
              <p data-m="3">この切り替えで取り込んだ予定を、buddy から消します。事業所の予定は、Google カレンダーで管理したままです。もう一度始めると、初めから取り込み直します。</p>
            </div>
            <div class="wf-dialog__footer">
              <span class="wf-btn" data-escape data-m="4" data-testid="calendar-cutover-cancel-confirm-cancel" data-go="02-open.html">戻る</span>
              <span class="wf-btn wf-btn--danger" data-m="5" data-testid="calendar-cutover-cancel-confirm-submit" data-go="01-not-started.html">やめる</span>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
