<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-cutover 完了した</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-cutover.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <main class="wf-page">
            <div class="sc-title">
              <h1 class="wf-heading" data-m="1">予定の管理を buddy に移す</h1>
              <span class="wf-btn wf-btn--text" data-m="2" data-testid="calendar-cutover-link-settings" data-go="../../schedule-link_カレンダーの連携/mocks/01-list.html">カレンダーの連携</span>
            </div>
            <p class="wf-lead" data-m="3">Google カレンダーで管理している予定を buddy に取り込み、この事業所の予定の管理を buddy に移します。移した後は、予定を buddy で作成、変更し、Google カレンダーには buddy の予定を書き出します。</p>
            <output class="sc-notice sc-notice--success" data-m="4" data-testid="calendar-cutover-completed">移行を完了しました。この事業所は、予定を buddy で管理しています。予定のカレンダーで、予定を作成できます。</output>
            <div><span class="wf-btn wf-btn--primary" data-m="5" data-testid="calendar-cutover-open-calendar" data-go="../../schedule-calendar_予定のカレンダー/mocks/01-month.html">予定のカレンダーを開く</span></div>
          </main>

        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
