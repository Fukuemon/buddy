<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-calendar 取得の失敗</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-calendar.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <header class="wf-site-header">
            <div class="wf-site-header__brand">
              <strong>buddy</strong>
              <nav data-m="1" data-testid="site-nav">
                <span aria-current="page" data-go="01-month.html">予定</span>
                <span data-go="../../receipt-upload_照合/mocks/01-initial.html">照合</span>
              </nav>
            </div>
            <div class="wf-site-header__viewer" data-testid="viewer-menu">
              <span class="wf-text wf-text--s" data-m="2"></span>
              <span class="wf-btn" data-m="3" data-testid="viewer-logout">ログアウト</span>
            </div>
          </header>
          <div class="sc-body">
            <div class="sc-drawer" role="dialog" aria-label="職員の絞り込み" data-m="16" data-testid="staff-filter-drawer" data-panel="staff-filter" data-panel-modal>
              <div class="sc-drawer__head">
                <strong class="sc-drawer__title">職員の絞り込み</strong>
                <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="閉じる" data-escape data-close="staff-filter" data-m="17" data-testid="staff-filter-close"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
              </div>
              <nav class="sc-side" aria-label="職員の絞り込み" data-m="4" data-testid="staff-filter-sidebar">
                <div class="sc-side__head">
                  <strong class="wf-label">職員</strong>
                  <span class="sc-side__actions"><span class="wf-btn wf-btn--text" data-m="19" data-testid="staff-filter-only-me">自分だけ</span><span class="wf-btn wf-btn--text" aria-disabled="true" data-m="5" data-testid="staff-filter-reset">全員を表示</span></span>
                </div>
                <div class="wf-search" data-m="20" data-testid="staff-filter-search">
                  <span class="wf-label">名前で絞り込む</span>
                </div>
                <div class="sc-team">
                  <span class="wf-check is-on" data-m="6" data-testid="staff-filter-team-{チームの id}" data-toggle>チーム 1</span>
                  <span class="wf-check is-on sc-member" data-m="7" data-testid="staff-filter-staff-{職員の id}" data-toggle>職員 A</span>
                  <span class="wf-check is-on sc-member" data-testid="staff-filter-staff-{職員の id}" data-toggle>職員 B</span>
                  <span class="wf-check is-on sc-member" data-testid="staff-filter-staff-{職員の id}" data-toggle>職員 C</span>
                </div>
                <div class="sc-team">
                  <span class="wf-check is-on" data-testid="staff-filter-team-{チームの id}" data-toggle>チーム 2</span>
                  <span class="wf-check is-on sc-member" data-testid="staff-filter-staff-{職員の id}" data-toggle>職員 D</span>
                  <span class="wf-check is-on sc-member" data-testid="staff-filter-staff-{職員の id}" data-toggle>職員 E</span>
                  <span class="wf-check is-on sc-member" data-testid="staff-filter-staff-{職員の id}" data-toggle>職員 F</span>
                </div>
              </nav>
            </div>
            <div class="wf-overlay sc-drawer-overlay" tabindex="-1" data-close="staff-filter"></div>
            <main class="sc-main">
              <div class="sc-toolbar">
                <div class="sc-toolbar__group">
                  <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="前へ" data-m="8" data-testid="calendar-prev"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4 6 10l6 6" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                  <span class="wf-btn" data-m="9" data-testid="calendar-today">今日</span>
                  <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="次へ" data-m="10" data-testid="calendar-next"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                  <span class="sc-title" data-m="18" data-testid="calendar-title">2026年10月</span>
                  <span class="wf-input sc-date" data-m="11" data-testid="calendar-date">2026/10/21</span>
                </div>
                <div class="sc-toolbar__group">
                  <div class="wf-tabs sc-view" data-m="12" data-testid="calendar-view">
                    <span class="wf-tab is-active" data-testid="calendar-view-month">月</span>
                    <span class="wf-tab" data-testid="calendar-view-week">週</span>
                    <span class="wf-tab" data-testid="calendar-view-day">日</span>
                  </div>
                  <span class="wf-btn sc-filter-open" aria-expanded="false" data-open="staff-filter" data-m="15" data-testid="staff-filter-open">職員の絞り込み</span>
                  <span class="wf-btn wf-btn--primary" data-m="13" data-testid="schedule-create-open" data-go="../../schedule-new_予定の作成/mocks/01-visit.html">予定を作成</span>
                </div>
              </div>
              <p class="wf-alert sc-error" role="alert" data-m="14">予定を取得できませんでした。</p>
            </main>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
