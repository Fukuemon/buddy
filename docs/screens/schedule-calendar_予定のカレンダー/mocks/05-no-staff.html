<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-calendar 表示する職員が無い</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-calendar.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <header class="wf-site-header">
            <div class="wf-site-header__brand">
              <strong>buddy</strong>
              <nav data-m="1" data-testid="site-nav">
                <span aria-current="page">予定</span>
                <span>照合</span>
              </nav>
            </div>
            <div class="wf-site-header__viewer" data-testid="viewer-menu">
              <span class="sc-viewer" data-m="2">職員 A</span>
              <span class="wf-btn" data-m="3" data-testid="viewer-logout">ログアウト</span>
            </div>
          </header>
          <div class="sc-body">
            <div class="sc-drawer" role="dialog" aria-label="職員の絞り込み" data-m="16" data-testid="staff-filter-drawer">
              <div class="sc-drawer__head">
                <strong class="sc-drawer__title">職員の絞り込み</strong>
                <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="閉じる" data-drawer="close" data-m="17" data-testid="staff-filter-close"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
              </div>
              <nav class="sc-side" aria-label="職員の絞り込み" data-m="4" data-testid="staff-filter-sidebar">
                <div class="sc-side__head">
                  <strong class="wf-label">職員</strong>
                  <span class="wf-btn wf-btn--text" data-m="5" data-testid="staff-filter-reset">全員を表示</span>
                </div>
                <div class="sc-team">
                  <span class="wf-check" data-m="6" data-testid="staff-filter-team-{チームの id}">チーム 1</span>
                  <span class="wf-check sc-member" data-m="7" data-testid="staff-filter-staff-{職員の id}">職員 A</span>
                  <span class="wf-check sc-member" data-testid="staff-filter-staff-{職員の id}">職員 B</span>
                  <span class="wf-check sc-member" data-testid="staff-filter-staff-{職員の id}">職員 C</span>
                </div>
                <div class="sc-team">
                  <span class="wf-check" data-testid="staff-filter-team-{チームの id}">チーム 2</span>
                  <span class="wf-check sc-member" data-testid="staff-filter-staff-{職員の id}">職員 D</span>
                  <span class="wf-check sc-member" data-testid="staff-filter-staff-{職員の id}">職員 E</span>
                  <span class="wf-check sc-member" data-testid="staff-filter-staff-{職員の id}">職員 F</span>
                </div>
              </nav>
            </div>
            <div class="wf-overlay sc-drawer-overlay" data-drawer="close"></div>
            <main class="sc-main">
              <div class="sc-toolbar">
                <div class="sc-toolbar__group">
                  <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="前へ" data-m="8" data-testid="calendar-prev"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4 6 10l6 6" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                  <span class="wf-btn" data-m="9" data-testid="calendar-today">今日</span>
                  <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="次へ" data-m="10" data-testid="calendar-next"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                  <span class="wf-input sc-date" data-m="11" data-testid="calendar-date">2026/10/21</span>
                </div>
                <div class="sc-toolbar__group">
                  <div class="wf-tabs sc-view" data-m="12" data-testid="calendar-view">
                    <span class="wf-tab" data-testid="calendar-view-month">月</span>
                    <span class="wf-tab" data-testid="calendar-view-week">週</span>
                    <span class="wf-tab is-active" data-testid="calendar-view-day">日</span>
                  </div>
                  <span class="wf-btn sc-filter-open" aria-expanded="false" data-drawer="open" data-m="15" data-testid="staff-filter-open">職員の絞り込み</span>
                  <span class="wf-btn wf-btn--primary" data-m="13" data-testid="schedule-create-open">予定を作成</span>
                </div>
              </div>
              <div class="sc-day-wrap" data-m="14" data-testid="staff-schedule-day-grid">
                <div class="sc-day sc-day--empty">
                  <div class="sc-head"></div>
                  <div class="sc-times"><div>06:00</div><div>07:00</div><div>08:00</div><div>09:00</div><div>10:00</div><div>11:00</div><div>12:00</div><div>13:00</div><div>14:00</div><div>15:00</div><div>16:00</div><div>17:00</div><div>18:00</div><div>19:00</div><div>20:00</div><div>21:00</div></div>
                </div>
              </div>
            </main>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script>
      // 幅 768px 未満で、職員の絞り込みのドロワーを開閉する。開く、閉じる、背景、Escape で切り替え、端末を変えると閉じる
      ;(() => {
        const body = document.querySelector('.sc-body')
        const opener = document.querySelector('[data-testid="staff-filter-open"]')
        const setOpen = (isOpen) => {
          body.classList.toggle('is-drawer-open', isOpen)
          opener.setAttribute('aria-expanded', String(isOpen))
          // 開いている間は、覆いの後ろの要素に番号の印を出さない
          for (const el of document.querySelectorAll('.screen [data-m], .screen [data-m-covered]')) {
            if (el.closest('.sc-drawer')) continue
            if (isOpen && el.dataset.m) {
              el.dataset.mCovered = el.dataset.m
              delete el.dataset.m
            } else if (!isOpen && el.dataset.mCovered) {
              el.dataset.m = el.dataset.mCovered
              delete el.dataset.mCovered
            }
          }
          mockRefresh()
        }
        body.addEventListener('click', (event) => {
          const toggle = event.target.closest('[data-drawer]')
          if (toggle) setOpen(toggle.dataset.drawer === 'open')
        })
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && body.classList.contains('is-drawer-open')) setOpen(false)
        })
        document.querySelector('.mock-toolbar').addEventListener('click', (event) => {
          if (event.target.closest('[data-view-name]')) setOpen(false)
        })
      })()
    </script>
  </body>
</html>
