<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-calendar 読み込み中</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-calendar.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <header class="wf-site-header">
            <div class="wf-site-header__brand">
              <span class="wf-btn wf-btn--icon wf-site-menu" aria-label="メニュー" data-open="site-nav" data-m="19" data-testid="site-nav-open"><svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" fill="currentColor" /></svg></span>
              <strong>buddy</strong>
            </div>
            <div class="wf-site-header__viewer" data-testid="viewer-menu">
              <span class="wf-text wf-text--s" data-m="2"></span>
              <span class="wf-btn" data-m="3" data-testid="viewer-logout">ログアウト</span>
            </div>
          </header>
          <div class="wf-site-body">
            <div class="wf-site-drawer" role="dialog" aria-label="メニュー" data-testid="site-nav-drawer" data-panel="site-nav" data-panel-modal>
              <div class="wf-site-drawer__head">
                <strong>メニュー</strong>
                <span class="wf-btn wf-btn--icon" aria-label="閉じる" data-escape data-close="site-nav" data-m="20" data-testid="site-nav-close"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
              </div>
              <nav class="wf-site-nav" aria-label="画面" data-m="1" data-testid="site-nav">
                <span class="wf-site-nav__item" aria-current="page" data-go="01-month.html" data-testid="site-nav-schedule"><svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Z" fill="currentColor" /></svg><span>予定</span></span>
                <span class="wf-site-nav__item" data-go="../../receipt-upload_照合/mocks/01-initial.html" data-testid="site-nav-receipt"><svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm40-80h200v-80H200v80Zm382-80 198-198-57-57-141 142-57-57-56 57 113 113Zm-382-80h200v-80H200v80Zm0-160h200v-80H200v80Z" fill="currentColor" /></svg><span>照合</span></span>
              </nav>
            </div>
            <div class="wf-overlay wf-site-drawer-overlay" tabindex="-1" data-close="site-nav"></div>
            <div class="wf-site-main">
              <div class="sc-body">
                <div class="sc-drawer" role="dialog" aria-label="職員の絞り込み" data-m="14" data-testid="staff-filter-drawer" data-panel="staff-filter" data-panel-modal>
                  <div class="sc-drawer__head">
                    <strong class="sc-drawer__title">職員の絞り込み</strong>
                    <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="閉じる" data-escape data-close="staff-filter" data-m="15" data-testid="staff-filter-close"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                  </div>
                  <nav class="sc-side" aria-label="職員の絞り込み" data-m="4" data-testid="staff-filter-sidebar">
                    <div class="sc-side__head">
                      <strong class="wf-label">職員</strong>
                      <span class="wf-btn wf-btn--text" aria-disabled="true" data-m="5" data-testid="staff-filter-reset">全員を表示</span>
                    </div>
                    <div class="wf-search" data-m="17" data-testid="staff-filter-search">
                      <span class="wf-label">名前で絞り込む</span>
                    </div>
                  </nav>
                </div>
                <div class="wf-overlay sc-drawer-overlay" tabindex="-1" data-close="staff-filter"></div>
                <main class="sc-main">
                  <div class="sc-toolbar">
                    <div class="sc-toolbar__group">
                      <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="前へ" data-m="6" data-testid="calendar-prev"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4 6 10l6 6" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                      <span class="wf-btn" data-m="7" data-testid="calendar-today">今日</span>
                      <span class="wf-btn wf-btn--icon sc-icon-btn" aria-label="次へ" data-m="8" data-testid="calendar-next"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></span>
                      <span class="sc-title" data-m="16" data-testid="calendar-title">2026年10月</span>
                      <span class="wf-input sc-date" data-m="9" data-testid="calendar-date">2026/10/21</span>
                    </div>
                    <div class="sc-toolbar__group">
                      <span class="wf-check" data-m="18" data-testid="calendar-show-cancelled" data-toggle>キャンセルした予定を出す</span>
                      <div class="wf-tabs sc-view" data-m="10" data-testid="calendar-view">
                        <span class="wf-tab is-active" data-testid="calendar-view-month">月</span>
                        <span class="wf-tab" data-testid="calendar-view-week">週</span>
                        <span class="wf-tab" data-testid="calendar-view-day">日</span>
                      </div>
                      <span class="wf-btn sc-filter-open" aria-expanded="false" data-open="staff-filter" data-m="13" data-testid="staff-filter-open">職員の絞り込み</span>
                      <span class="wf-btn wf-btn--primary" data-m="11" data-testid="schedule-create-open" data-go="../../schedule-new_予定の作成/mocks/01-visit.html">予定を作成</span>
                    </div>
                  </div>
                  <div class="wf-loading" data-m="12">カレンダーを表示中...</div>
                </main>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
