<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="wireframe-states"
      content="initial:初期表示,lookup-loading:職員と利用者の読み込み中,lookup-error:職員と利用者の取得の失敗,invalid:入力の誤り,submitting:送信中,success:成功,submit-error:送信の失敗,error-401:未認証（401）,error-403:権限なし（403）,error-400:入力の誤り（400）"
    />
    <title>予定の作成</title>
    <link rel="stylesheet" href="wireframe.css" />
    <style>
      .pane {
        display: none;
      }

      .row {
        display: flex;
        gap: 16px;
      }

      .row > * {
        flex: 1;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* 種類のタブ。ラジオボタンで、訪問だけ、通常だけの要素を出し分ける */
      html:has(#kind-visit:checked) .only-normal,
      html:has(#kind-normal:checked) .only-visit {
        display: none !important;
      }

      html:has(#kind-visit:checked) label[for='kind-visit'],
      html:has(#kind-normal:checked) label[for='kind-normal'] {
        background: var(--wf-surface);
        color: var(--wf-ink);
        font-weight: 700;
      }

      /* 要約の一覧で選んだ項目の入力だけを右に出す。種類の切り替えで項目が消えたら、日時の入力に戻す */
      html:has(#field-title:checked) .pane--title,
      html:has(#field-dateTime:checked) .pane--dateTime,
      html:has(#field-patient:checked) .pane--patient,
      html:has(#field-staff:checked) .pane--staff,
      html:has(#field-category:checked) .pane--category,
      html:has(#field-description:checked) .pane--description,
      html:has(#kind-visit:checked):has(#field-title:checked) .pane--dateTime,
      html:has(#kind-normal:checked):has(#field-patient:checked) .pane--dateTime,
      html:has(#kind-normal:checked):has(#field-category:checked) .pane--dateTime {
        display: flex;
      }

      html:has(#field-title:checked) label[for='field-title'],
      html:has(#field-dateTime:checked) label[for='field-dateTime'],
      html:has(#field-patient:checked) label[for='field-patient'],
      html:has(#field-staff:checked) label[for='field-staff'],
      html:has(#field-category:checked) label[for='field-category'],
      html:has(#field-description:checked) label[for='field-description'] {
        border: 2px solid var(--wf-ink);
        background: var(--wf-fill);
      }

      html[data-state='invalid'] .is-invalid {
        border: 2px solid var(--wf-ink);
      }
    </style>
  </head>
  <body>
    <input class="wf-switch" id="kind-normal" name="kind" type="radio" />
    <input checked class="wf-switch" id="kind-visit" name="kind" type="radio" />
    <input class="wf-switch" id="field-title" name="field" type="radio" />
    <input checked class="wf-switch" id="field-dateTime" name="field" type="radio" />
    <input class="wf-switch" id="field-patient" name="field" type="radio" />
    <input class="wf-switch" id="field-staff" name="field" type="radio" />
    <input class="wf-switch" id="field-category" name="field" type="radio" />
    <input class="wf-switch" id="field-description" name="field" type="radio" />

    <div class="wf-modal-stage">
      <div aria-hidden="true" class="wf-bg-calendar"></div>
      <div
        class="wf-overlay"
        data-component="モーダルの背景"
        data-hide-when="success"
        data-ref="2"
        data-testid="modal-overlay"
      ></div>
      <p class="wf-hint" data-show-when="success" style="position: relative; max-width: 480px; margin: 0 auto">
        モーダルを閉じ、作った予定の日のカレンダーに戻る。成功の文は出さない。
      </p>

      <div
        aria-label="予定の作成"
        class="wf-modal"
        data-component="Modal"
        data-hide-when="success"
        data-ref="1"
        data-testid="schedule-form-modal"
        role="dialog"
      >
        <div class="wf-modal__header">
          <span aria-label="閉じる" class="wf-btn wf-btn--icon" data-component="閉じるボタン" data-ref="1-1" data-testid="modal-close"
            >×</span
          >
          <div
            class="wf-tabs"
            data-component="種類の TextTab"
            data-ref="1-2"
            data-testid="schedule-kind-tab"
            style="width: 200px"
          >
            <label class="wf-tab" for="kind-normal" style="flex: 1">通常</label>
            <label class="wf-tab" for="kind-visit" style="flex: 1">訪問</label>
          </div>
          <h1 class="wf-modal__title">予定の作成</h1>
        </div>

        <div class="wf-modal__body">
          <div class="wf-split">
            <div class="wf-stack">
              <label class="wf-summary only-normal is-invalid" for="field-title">
                <span class="wf-label">タイトル</span>
                <span class="wf-text"></span>
                <span class="wf-error" data-show-when="invalid">タイトルを入力してください</span>
              </label>
              <label
                class="wf-summary"
                data-component="ScheduleFieldSummaryList の項目"
                data-ref="3"
                data-testid="schedule-field-{title、dateTime、patient、staff、category、description}"
                for="field-dateTime"
              >
                <span class="wf-label"><span class="only-visit">訪問日時</span><span class="only-normal">予定日時</span></span>
                <span class="wf-text wf-text--l"></span>
              </label>
              <label class="wf-summary only-visit is-invalid" for="field-patient">
                <span class="wf-label">利用者</span>
                <span>未選択</span>
                <span class="wf-error" data-show-when="invalid">利用者を選んでください</span>
              </label>
              <label class="wf-summary is-invalid" for="field-staff">
                <span class="wf-label"><span class="only-visit">担当者</span><span class="only-normal">予定者</span></span>
                <span>未選択</span>
                <span class="wf-error" data-show-when="invalid">担当者を選んでください</span>
              </label>
              <label class="wf-summary only-visit" for="field-category">
                <span class="wf-label">訪問の種類</span>
                <span>通常</span>
              </label>
              <label class="wf-summary" for="field-description">
                <span class="wf-label">メモ</span>
                <span>なし</span>
              </label>
            </div>

            <div data-component="右の入力" data-ref="4">
              <p class="wf-hint" data-show-when="lookup-loading lookup-error" style="margin: 0 0 12px">
                利用者と担当者の一覧は空になる。要約の一覧の「利用者」か「担当者」を押すと見える。
              </p>

              <div class="pane pane--title wf-stack">
                <div
                  class="wf-input wf-input--area"
                  data-component="タイトルの TextareaField"
                  data-ref="4-1"
                >
                  <span class="wf-label">タイトル</span>
                </div>
              </div>

              <div class="pane pane--dateTime wf-stack" style="gap: 16px">
                <h2 class="wf-heading"><span class="only-visit">訪問日時</span><span class="only-normal">予定日時</span></h2>
                <div class="wf-input" data-component="日付の DatePicker" data-ref="4-2" data-testid="schedule-form-date">
                  <span class="wf-label"><span class="only-visit">訪問日</span><span class="only-normal">日付</span></span>
                  <span class="wf-text"></span>
                </div>
                <div class="row">
                  <div
                    class="wf-input"
                    data-component="開始時間の TimePicker"
                    data-ref="4-3"
                    data-testid="schedule-form-start-time"
                  >
                    <span class="wf-label">開始時間</span>
                    <span class="wf-text wf-text--s"></span>
                  </div>
                  <div
                    class="wf-input only-visit"
                    data-component="提供時間の NumberPicker（訪問）"
                    data-ref="4-6"
                    data-testid="schedule-form-service-time"
                  >
                    <span class="wf-label">提供時間（分）</span>
                    <span class="wf-text wf-text--s"></span>
                  </div>
                  <div
                    class="wf-input only-normal"
                    data-component="終了時間の TimePicker（通常）"
                    data-ref="4-4"
                    data-testid="schedule-form-end-time"
                  >
                    <span class="wf-label">終了時間</span>
                    <span class="wf-text wf-text--s"></span>
                  </div>
                </div>
                <p
                  class="wf-label only-visit"
                  data-component="終了時間の文（訪問）"
                  data-ref="4-5"
                  data-testid="schedule-form-end-time"
                  style="margin: 0"
                >
                  終了時間 <span class="wf-text wf-text--s"></span>
                </p>
                <div
                  class="wf-stack only-visit"
                  data-component="ServiceCodeRadioGroup（訪問）"
                  data-ref="4-7"
                  data-testid="service-code-{コード}"
                >
                  <strong>サービスコードを選んでください</strong>
                  <div class="chips">
                    <span class="wf-chip is-on"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                  </div>
                </div>
              </div>

              <div
                class="pane pane--patient wf-stack"
                data-component="PatientSelectList（訪問）"
                data-ref="4-8"
                data-testid="patient-select-search、patient-select-option-{利用者の id}"
              >
                <h2 class="wf-heading">利用者</h2>
                <div class="wf-input" style="min-height: 40px"><span class="wf-label">名前で検索</span></div>
                <div class="wf-stack" data-hide-when="lookup-loading lookup-error">
                  <span class="wf-check"><span class="wf-text"></span></span>
                  <span class="wf-check"><span class="wf-text"></span></span>
                  <span class="wf-check"><span class="wf-text"></span></span>
                </div>
                <p
                  class="wf-label"
                  data-component="「該当する名前がありません。」"
                  data-ref="4-12"
                  data-show-when="lookup-loading lookup-error"
                >
                  該当する名前がありません。
                </p>
              </div>

              <div
                class="pane pane--staff wf-stack"
                data-component="StaffSelectList"
                data-ref="4-9"
                data-testid="staff-select-search、staff-select-option-{職員の id}"
              >
                <h2 class="wf-heading"><span class="only-visit">担当者</span><span class="only-normal">予定者</span></h2>
                <div class="wf-input" style="min-height: 40px"><span class="wf-label">名前で検索</span></div>
                <div class="wf-stack" data-hide-when="lookup-loading lookup-error">
                  <span class="wf-check"><span class="wf-text"></span></span>
                  <span class="wf-check"><span class="wf-text"></span></span>
                  <span class="wf-check"><span class="wf-text"></span></span>
                </div>
                <p
                  class="wf-label"
                  data-component="「該当する名前がありません。」"
                  data-ref="4-12"
                  data-show-when="lookup-loading lookup-error"
                >
                  該当する名前がありません。
                </p>
              </div>

              <div
                class="pane pane--category wf-stack"
                data-component="ScheduleCategoryCheckboxGroup（訪問）"
                data-ref="4-10"
                data-testid="schedule-category-{night、emergency、hospitalization}"
              >
                <h2 class="wf-heading">訪問の種類</h2>
                <span class="wf-check">夜勤</span>
                <span class="wf-check">緊急</span>
                <span class="wf-check">入院</span>
              </div>

              <div class="pane pane--description wf-stack">
                <div class="wf-input wf-input--area" data-component="メモの TextareaField" data-ref="4-11">
                  <span class="wf-label">メモ</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="wf-modal__footer">
          <p
            class="wf-alert"
            data-component="送信の失敗の文"
            data-ref="1-3"
            data-show-when="submit-error error-401 error-403 error-400"
            role="alert"
          >
            予定を作成できませんでした。
          </p>
          <span class="wf-btn wf-btn--primary" data-component="作成のボタン" data-hide-when="submitting" data-ref="1-4" data-testid="schedule-create-submit"
            >作成</span
          >
          <span
            aria-disabled="true"
            class="wf-btn wf-btn--primary wf-btn--busy"
            data-component="作成のボタン"
            data-ref="1-4"
            data-show-when="submitting"
            data-testid="schedule-create-submit"
            >作成</span
          >
        </div>
      </div>
    </div>
    <script src="wireframe.js"></script>
  </body>
</html>
