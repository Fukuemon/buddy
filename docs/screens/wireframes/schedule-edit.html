<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="wireframe-states"
      content="loading:読み込み中,error:取得の失敗,initial:初期表示,invalid:入力の誤り,submitting:送信中,success:成功,submit-error:送信の失敗,error-403:権限なし（403）,error-401:未認証（401）"
    />
    <title>予定の編集</title>
    <link rel="stylesheet" href="wireframe.css" />
    <style>
      .pane {
        display: none;
      }

      .row {
        display: flex;
        gap: 16px;
      }

      .row > * {
        flex: 1;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* 要約の一覧で選んだ項目の入力だけを右に出す */
      html:has(#field-dateTime:checked) .pane--dateTime,
      html:has(#field-patient:checked) .pane--patient,
      html:has(#field-staff:checked) .pane--staff,
      html:has(#field-category:checked) .pane--category,
      html:has(#field-description:checked) .pane--description {
        display: flex;
      }

      html:has(#field-dateTime:checked) label[for='field-dateTime'],
      html:has(#field-patient:checked) label[for='field-patient'],
      html:has(#field-staff:checked) label[for='field-staff'],
      html:has(#field-category:checked) label[for='field-category'],
      html:has(#field-description:checked) label[for='field-description'] {
        border: 2px solid var(--wf-ink);
        background: var(--wf-fill);
      }

      html[data-state='invalid'] .is-invalid {
        border: 2px solid var(--wf-ink);
      }
    </style>
  </head>
  <body>
    <input checked class="wf-switch" id="field-dateTime" name="field" type="radio" />
    <input class="wf-switch" id="field-patient" name="field" type="radio" />
    <input class="wf-switch" id="field-staff" name="field" type="radio" />
    <input class="wf-switch" id="field-category" name="field" type="radio" />
    <input class="wf-switch" id="field-description" name="field" type="radio" />

    <div class="wf-modal-stage">
      <div aria-hidden="true" class="wf-bg-calendar"></div>
      <div
        class="wf-overlay"
        data-component="モーダルの背景"
        data-hide-when="success"
        data-ref="2"
        data-testid="modal-overlay"
      ></div>
      <p class="wf-hint" data-show-when="success" style="position: relative; max-width: 480px; margin: 0 auto">
        予定の詳細に戻る。成功の文は出さない。
      </p>

      <div
        aria-label="予定の編集"
        class="wf-modal"
        data-component="Modal"
        data-hide-when="success"
        data-ref="1"
        data-testid="schedule-form-modal"
        role="dialog"
      >
        <div class="wf-modal__header">
          <span aria-label="閉じる" class="wf-btn wf-btn--icon" data-component="閉じるボタン" data-ref="1-1" data-testid="modal-close"
            >×</span
          >
          <span class="wf-absent" data-component="種類の TextTab" data-hide-when="loading error" data-ref="1-2">種類のタブ</span>
          <h1 class="wf-modal__title">予定の編集</h1>
        </div>

        <div class="wf-modal__body">
          <div class="wf-loading" data-component="読み込み中の Loading" data-ref="4" data-show-when="loading"></div>
          <p class="wf-alert" data-component="取得の失敗の文" data-ref="5" data-show-when="error" role="alert">
            予定を取得できませんでした。
          </p>

          <p class="wf-hint" data-show-when="error-403 error-401" style="margin: 0 0 12px">
            保存で失敗したときの見え方。読み込みで失敗したときは、取得の失敗と同じ文になる。
          </p>
          <div class="wf-split" data-component="ScheduleForm" data-hide-when="loading error" data-ref="3" data-testid="schedule-form">
            <div class="wf-stack">
              <label class="wf-summary" for="field-dateTime">
                <span class="wf-label">訪問日時</span>
                <span class="wf-text wf-text--l"></span>
                <span class="wf-error" data-show-when="invalid">提供時間を入力してください</span>
              </label>
              <label class="wf-summary" for="field-patient">
                <span class="wf-label">利用者</span>
                <span class="wf-text"></span>
              </label>
              <label class="wf-summary" for="field-staff">
                <span class="wf-label">担当者</span>
                <span class="wf-text"></span>
              </label>
              <label class="wf-summary" for="field-category">
                <span class="wf-label">訪問の種類</span>
                <span class="wf-text wf-text--s"></span>
              </label>
              <label class="wf-summary" for="field-description">
                <span class="wf-label">メモ</span>
                <span class="wf-text"></span>
              </label>
            </div>

            <div>
              <div class="pane pane--dateTime wf-stack" style="gap: 16px">
                <h2 class="wf-heading">訪問日時</h2>
                <div class="wf-input">
                  <span class="wf-label">訪問日</span>
                  <span class="wf-text"></span>
                </div>
                <div class="row">
                  <div class="wf-input">
                    <span class="wf-label">開始時間</span>
                    <span class="wf-text wf-text--s"></span>
                  </div>
                  <div
                    class="wf-input is-invalid"
                    data-component="提供時間の NumberPicker の初期値"
                    data-ref="3-1"
                    data-testid="schedule-form-service-time"
                  >
                    <span class="wf-label">提供時間（分）</span>
                    <span class="wf-text wf-text--s"></span>
                    <span class="wf-error" data-show-when="invalid">提供時間を入力してください</span>
                  </div>
                </div>
                <p class="wf-label" style="margin: 0">終了時間 <span class="wf-text wf-text--s"></span></p>
                <div class="wf-stack">
                  <strong>サービスコードを選んでください</strong>
                  <div class="chips">
                    <span class="wf-chip is-on"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                    <span class="wf-chip"><span class="wf-text"></span></span>
                    <span class="wf-chip"><span class="wf-text wf-text--s"></span></span>
                  </div>
                </div>
              </div>

              <div class="pane pane--patient wf-stack">
                <h2 class="wf-heading">利用者</h2>
                <div class="wf-input" style="min-height: 40px"><span class="wf-label">名前で検索</span></div>
                <span class="wf-check is-on"><span class="wf-text"></span></span>
                <span class="wf-check"><span class="wf-text"></span></span>
                <span class="wf-check"><span class="wf-text"></span></span>
              </div>

              <div class="pane pane--staff wf-stack">
                <h2 class="wf-heading">担当者</h2>
                <div class="wf-input" style="min-height: 40px"><span class="wf-label">名前で検索</span></div>
                <span class="wf-check is-on"><span class="wf-text"></span></span>
                <span class="wf-check"><span class="wf-text"></span></span>
                <span class="wf-check"><span class="wf-text"></span></span>
              </div>

              <div class="pane pane--category wf-stack">
                <h2 class="wf-heading">訪問の種類</h2>
                <span class="wf-check">夜勤</span>
                <span class="wf-check">緊急</span>
                <span class="wf-check">入院</span>
              </div>

              <div class="pane pane--description wf-stack">
                <div class="wf-input wf-input--area">
                  <span class="wf-label">メモ</span>
                  <span class="wf-text wf-text--l"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="wf-modal__footer" data-hide-when="loading error">
          <p
            class="wf-alert"
            data-component="送信の失敗の文"
            data-ref="1-3"
            data-show-when="submit-error error-403 error-401"
            role="alert"
          >
            予定を更新できませんでした。
          </p>
          <span class="wf-btn wf-btn--primary" data-component="保存のボタン" data-hide-when="submitting" data-ref="1-4" data-testid="schedule-edit-submit"
            >保存</span
          >
          <span
            aria-disabled="true"
            class="wf-btn wf-btn--primary wf-btn--busy"
            data-component="保存のボタン"
            data-ref="1-4"
            data-show-when="submitting"
            data-testid="schedule-edit-submit"
            >保存</span
          >
        </div>
      </div>
    </div>
    <script src="wireframe.js"></script>
  </body>
</html>
