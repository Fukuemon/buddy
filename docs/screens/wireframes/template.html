<!doctype html>
<!--
  1 画面分のワイヤーフレームの雛形。<画面の ID>.html の名前で写して書く。

  - wireframe-states: 画面仕様書の「状態ごとの UI」の行を同じ順に、<id>:<状態の名前> で並べる。先頭が既定の状態。
    id は小文字の英語、数字、`-` だけを使い、ビューアの URL の state に入る。
  - data-show-when="<id> <id>": 挙げた状態のときだけ出す。data-hide-when="<id>": 挙げた状態のときは隠す。
  - data-ref: 画面仕様書の構成要素の表の構成番号。振り方は docs/screens/template.md の構成要素の節にある。
    同じ番号を、状態ごとに出し分ける複数の要素に振ってよい。
  - data-component: 構成要素の表の「構成要素」の列の名前。data-testid: 実装の data-testid。無ければ書かない。
  - 画面の中の切り替え（タブなど）は、.wf-switch のラジオボタンと label、:has() のセレクタで書く。例は schedule-calendar.html の表示の種類。
  - 食い違いは pnpm check:screens で確かめる。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="wireframe-states" content="initial:初期表示,loading:読み込み中,error:取得の失敗" />
    <title>画面の名前</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <main style="padding: 24px">
      <section class="wf-panel" style="padding: 16px" data-ref="1" data-component="ExampleList" data-testid="example-list">
        <h1 class="wf-heading">一覧の見出し</h1>

        <div data-show-when="loading" class="wf-loading" data-ref="2" data-component="Loading">読み込み中...</div>
        <p data-show-when="error" class="wf-alert" role="alert" data-ref="3" data-component="取得の失敗の文">
          取得できませんでした。
        </p>

        <ul data-show-when="initial" style="display: grid; gap: 8px; padding: 0; list-style: none">
          <li class="wf-box" style="padding: 8px" data-ref="1-1" data-component="一覧の行" data-testid="example-row-{id}">
            <span class="wf-text wf-text--l"></span>
          </li>
          <li class="wf-box" style="padding: 8px"><span class="wf-text wf-text--l"></span></li>
        </ul>

        <button class="wf-btn wf-btn--primary" type="button" data-ref="1-2" data-component="作成のボタン" data-testid="example-create">
          作成
        </button>
      </section>
    </main>
    <script src="wireframe.js"></script>
  </body>
</html>
