<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="wireframe-states"
      content="loading:読み込み中,ready:表示,unknown-names:職員か利用者が分からない,not-found:見つからない（404）,error:取得の失敗,error-403:権限なし（403）,error-401:未認証（401）"
    />
    <title>予定の詳細</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <div class="wf-modal-stage">
      <div aria-hidden="true" class="wf-bg-calendar"></div>
      <div class="wf-overlay" data-component="モーダルの背景" data-ref="2" data-testid="modal-overlay"></div>

      <div
        aria-label="予定の詳細"
        class="wf-modal"
        data-component="Modal"
        data-ref="1"
        data-testid="schedule-detail-modal"
        role="dialog"
      >
        <div class="wf-modal__header">
          <span aria-label="閉じる" class="wf-btn wf-btn--icon" data-component="閉じるボタン" data-ref="1-1" data-testid="modal-close"
            >×</span
          >
          <h1 class="wf-modal__title">予定の詳細</h1>
        </div>

        <div class="wf-modal__body">
          <div class="wf-loading" data-component="Loading" data-ref="1-12" data-show-when="loading"></div>
          <p class="wf-alert" data-component="失敗の文" data-ref="1-11" data-show-when="not-found" role="alert">
            予定が見つかりません。
          </p>
          <p class="wf-alert" data-component="失敗の文" data-ref="1-11" data-show-when="error error-403 error-401" role="alert">
            予定を取得できませんでした。
          </p>

          <dl class="wf-rows" data-show-when="ready unknown-names">
            <div class="wf-row" data-component="種類の行" data-ref="1-2">
              <dt>種類</dt>
              <dd><span class="wf-text wf-text--s"></span></dd>
            </div>
            <div class="wf-row wf-cond" data-component="タイトルの行" data-cond="通常の予定だけ" data-ref="1-3">
              <dt>タイトル</dt>
              <dd><span class="wf-text wf-text--l"></span></dd>
            </div>
            <div class="wf-row" data-component="日時の行" data-ref="1-4" data-testid="schedule-detail-datetime">
              <dt>日時</dt>
              <dd><span class="wf-text wf-text--l"></span></dd>
            </div>
            <div class="wf-row wf-cond" data-component="利用者の行" data-cond="訪問の予定だけ" data-ref="1-5">
              <dt>利用者</dt>
              <dd>
                <span class="wf-text" data-hide-when="unknown-names"></span>
                <span data-show-when="unknown-names">利用者不明</span>
              </dd>
            </div>
            <div class="wf-row wf-cond" data-component="サービスコードの行" data-cond="訪問の予定だけ" data-ref="1-6">
              <dt>サービスコード</dt>
              <dd><span class="wf-text wf-text--s"></span></dd>
            </div>
            <div class="wf-row wf-cond" data-component="訪問の種類の行" data-cond="訪問の予定だけ" data-ref="1-7">
              <dt>訪問の種類</dt>
              <dd><span class="wf-text"></span></dd>
            </div>
            <div class="wf-row" data-component="担当者、予定者の行" data-ref="1-8">
              <dt>担当者 / 予定者</dt>
              <dd>
                <span class="wf-text" data-hide-when="unknown-names"></span>
                <span data-show-when="unknown-names">職員不明</span>
              </dd>
            </div>
            <div class="wf-row" data-component="メモの行" data-ref="1-9">
              <dt>メモ</dt>
              <dd><span class="wf-text wf-text--l"></span></dd>
            </div>
          </dl>
        </div>

        <div class="wf-modal__footer" data-show-when="ready unknown-names">
          <span class="wf-btn" data-component="編集のボタン" data-ref="1-10" data-testid="schedule-detail-edit">編集</span>
        </div>
      </div>
    </div>
    <script src="wireframe.js"></script>
  </body>
</html>
