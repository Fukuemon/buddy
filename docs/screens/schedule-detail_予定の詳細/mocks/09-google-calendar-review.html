<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-detail 確認が必要な Google カレンダーの予定</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-detail.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-calendar_予定のカレンダー/mocks/09-google-primary.html"></div>
            <div aria-label="予定の詳細" class="wf-modal" data-m="2" data-testid="schedule-detail-modal" role="dialog">
              <div class="wf-modal__header">
                <h2 class="wf-modal__title wf-dialog__title" data-m="3">予定の詳細</h2>
              </div>
              <div class="wf-modal__body">
                <p class="sd-google" data-m="4" data-testid="schedule-detail-google-calendar">Google カレンダーの予定です。buddy で変更かキャンセルすると、Google カレンダーにも書きます。</p>
                <p class="sd-review" data-m="5" data-testid="schedule-detail-review-reason"><strong>確認が必要な予定です。</strong>タイトルの利用者が見つかりません。Google カレンダーでタイトルを直してください。</p>
                <h3 class="sd-datetime" data-m="6" data-testid="schedule-detail-datetime">2026年10月13日（火） 14:00〜14:59</h3>
                <dl class="wf-rows sd-rows">
                  <div class="wf-row" data-m="7">
                    <dt>種類</dt>
                    <dd>通常</dd>
                  </div>
                  <div class="wf-row" data-m="8">
                    <dt>タイトル</dt>
                    <dd>利用者 X 訪看I2</dd>
                  </div>
                  <div class="wf-row" data-m="9">
                    <dt>予定者</dt>
                    <dd><span class="wf-text"></span></dd>
                  </div>
                </dl>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn" data-escape data-m="10" data-testid="schedule-detail-close" data-go="../../schedule-calendar_予定のカレンダー/mocks/09-google-primary.html">閉じる</span>
                <span class="wf-btn" data-m="11" data-testid="schedule-detail-cancel-schedule" data-go="10-cancel.html">予定をキャンセル</span>
                <span class="wf-btn" data-m="12" data-testid="schedule-detail-edit" data-go="../../schedule-edit_予定の編集/mocks/08-normal.html">編集</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
