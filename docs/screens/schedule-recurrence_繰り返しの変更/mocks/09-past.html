<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>schedule-recurrence 今日より前の回から開いた</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="schedule-recurrence.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <div class="wf-modal-stage">
            <div aria-hidden="true" class="wf-bg-calendar"></div>
            <div class="wf-overlay" data-m="1" tabindex="-1" data-go="../../schedule-detail_予定の詳細/mocks/13-recurring.html"></div>
            <div aria-label="繰り返しの変更" class="wf-modal" data-testid="schedule-recurrence-modal" role="dialog">
              <div class="wf-modal__header">
                <h2 class="wf-modal__title wf-dialog__title" data-m="2">繰り返しの変更</h2>
              </div>
              <div class="wf-modal__body sr-body">
                <p class="sr-lead" data-m="3" data-testid="schedule-recurrence-lead">今日（11月8日（日））以降の回の繰り返しを変えます。今日より前の回は変わりません。時刻、利用者、職員、内容は変わりません。</p>
                <dl class="sr-summary" data-m="4" data-testid="schedule-recurrence-summary">
                  <dt>時刻</dt>
                  <dd>09:00〜09:29</dd>
                  <dt>利用者</dt>
                  <dd><span class="wf-text"></span></dd>
                  <dt>主訪問者</dt>
                  <dd><span class="wf-text"></span></dd>
                </dl>
                <div class="sr-rule">
                  <span class="sr-rule__label">繰り返し</span>
                  <div class="sr-rule__field">
                    <span class="wf-select sr-preset" data-m="5" data-testid="recurring-rule-preset" data-go="04-custom-weekly.html">毎週 月曜日</span>
                  </div>
                  <span class="sr-rule__label">終了日</span>
                  <div class="sr-rule__field sr-ends" role="radiogroup" aria-label="終了日">
                    <span class="wf-radio is-on" data-m="6" data-testid="recurring-rule-ends-never">なし</span>
                    <span></span>
                    <span class="wf-radio" data-m="7" data-testid="recurring-rule-ends-on" data-go="06-end-date.html">あり</span>
                    <span class="sr-date sr-disabled" aria-disabled="true" aria-label="終了日" data-m="8" data-testid="recurring-rule-end-date">2026/11/02</span>
                  </div>
                </div>
              </div>
              <div class="wf-modal__footer">
                <span class="wf-btn" data-escape data-m="9" data-testid="schedule-recurrence-cancel" data-go="../../schedule-detail_予定の詳細/mocks/13-recurring.html">キャンセル</span>
                <span class="wf-btn wf-btn--primary" data-m="10" data-testid="schedule-recurrence-submit">保存</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
