<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>account-login メールの入力</title>
    <link rel="stylesheet" href="../../_common/mock.css" />
    <link rel="stylesheet" href="../../_common/tokens.css" />
    <link rel="stylesheet" href="../../_common/wireframe.css" />
    <link rel="stylesheet" href="account-login.css" />
  </head>
  <body data-view="desktop">
    <div class="stage">
      <div class="screen">
        <div class="screen-body">
          <main class="al-page">
            <div class="al-card">
              <p class="al-logo" data-m="1">buddy</p>
              <h1 class="al-title" data-m="2">buddy にログイン</h1>
              <span class="al-field-label">メールアドレス</span>
              <div class="wf-input" data-m="3"></div>
              <p class="al-hint" data-m="4">事業所に登録したメールアドレスを入れてください。事業所のログインの画面へ移ります。</p>
              <span class="wf-btn wf-btn--primary al-submit" data-m="5">次へ</span>
            </div>
          </main>
        </div>
      </div>
      <div class="markers"></div>
    </div>
    <script src="../../_common/mock.js"></script>
    <script src="../../_common/interact.js"></script>
  </body>
</html>
