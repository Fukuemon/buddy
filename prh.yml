# 文章の規則。どのプロジェクトでも成り立つものだけを置く。プロジェクトの用語の規則は、この下に足す
version: 1

rules:
  - expected: 名前で指す
    pattern: /\b(?!S3\b|M[1-6]\b|V8\b|D1\b|R2\b)(?:DQ|[GSMQRVD])\d{1,2}\b/
    prh: 記号の採番は使わない。記号だけでは、その文が単独で意味を持たない。名前や節の見出しで指す
  - expected: この文書に必要な事実だけを書く
    pattern: /(?:詳細|実現方法|調査結果|選定|結果|書式)は、?\s?(?:DesignDoc|Design Doc|PRD|ADR)(?:\.md)?\s?(?:に|で)(?:書|定め|記載)/
    prh: 「詳細は Design Doc に書く」のような案内文は書かない。内容は各文書の中で完結させる
  - expected: 日付を書かない
    pattern: /\d{4}\s?年(?!分|間|目|以上|後|前|ごと)(?:\s?\d{1,2}\s?月)?/
    prh: 文書に日付を書かない。履歴はコミットから読み取れる。バージョンなど、日付を使わずに時点を特定できる情報で書く
  - expected: 更新日を書かない
    pattern: /\bUpdated:/
    prh: 文書に更新日を書かない。履歴はコミットから読み取れる
  - expected: 次の $1 つ$2。
    pattern: /次の\s?(\d+)\s?つ(だけ)?である。/
    prh: 箇条書きや表を導く文は体言止めにする。「である」を重ねると不自然に読める
  - expected: 例は次の $1 つ。
    pattern: /次の\s?(\d+)\s?つが例である。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: 次のとおり。
    pattern: /次のとおりである。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: $1バージョン
    pattern: /(新しい|古い|最新の|最初の|次の|前の|同じ|別の|特定の|誤った|取り消した)版/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: 新しい版を出す
        to: 新しいバージョンを出す
  - expected: バージョン
    pattern: /(?<!(?:語|\d\s?|[A-Za-z]\s?|無料|有料|体験|製品|完全|簡易|限定|特別|海外|国内|ベータ|デスクトップ|モバイル|スマホ))版(?=[をがはもにで]?(?:上げ|上が|下げ|戻|固定|指定|揃|そろ|ずれ|変え|書き換|宣言|定め|管理|配置先|所在|決め方|そのもの|更新))/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: 版を上げる
        to: バージョンを上げる
      - from: 日本語版を更新する
        to: 日本語版を更新する
      - from: Web 版を更新する
        to: Web 版を更新する
  - expected: $1$2バージョン
    pattern: /([A-Za-z0-9`]|ツール|パッケージ|プラグイン|ライブラリ|ランタイム|依存|schema)(\s?の\s?)版/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: Node.js の版
        to: Node.js のバージョン
      - from: 日本語版の違い
        to: 日本語版の違い
      - from: ツールの版
        to: ツールのバージョン
  # 技術者がカタカナ語で呼ぶ技術用語。文脈で意味が変わる語（表、列、題、写す、取り込む）は、スキル write-prose の規則で判断し、ここに置かない
  - expected: デフォルト値
    pattern: /既定の?値/
    prh: default value はデフォルト値と書く
    specs:
      - from: 既定の値を使う
        to: デフォルト値を使う
      - from: 既定値を変える
        to: デフォルト値を変える
  - expected: デフォルト$1
    pattern: /既定(?!の?値)(では|で|は|の|に|を|と|から)/
    prh: default はデフォルトと書く
    specs:
      - from: 既定では無効
        to: デフォルトでは無効
      - from: 既定のブランチ
        to: デフォルトのブランチ
  - expected: テンプレート
    pattern: 雛形
    prh: template はテンプレートと書く
    specs:
      - from: issue の雛形
        to: issue のテンプレート
  - expected: リクエスト$1レスポンス
    pattern: /要求(と|や|、)応答/
    prh: HTTP の request と response は、リクエストとレスポンスと書く
    specs:
      - from: 要求と応答を記録する
        to: リクエストとレスポンスを記録する
  - expected: $1$2の$3テーブル
    pattern: /(DB|データベース)(\s?)の(\s?)表(?![現示記])/
    prh: DB の table はテーブルと書く。Markdown の表は検出しない
    specs:
      - from: DB の表の名前
        to: DB のテーブルの名前
      - from: DB の表現力
        to: DB の表現力
  - expected: ローカル環境
    pattern: 手元の環境
    prh: 開発者のマシンの環境は、ローカル環境と書く
    specs:
      - from: 手元の環境で試す
        to: ローカル環境で試す
  - expected: ローカル環境で
    pattern: /手元で(?=動か|起動|実行)/
    prh: 開発者のマシンで動かすことは、ローカル環境で起動する、のように書く
    specs:
      - from: 手元で動かす
        to: ローカル環境で動かす
      - from: 手元で扱う
        to: 手元で扱う
  - expected: シークレット
    patterns:
      - 秘密の値
      - 秘密情報
      - 秘密の情報
    prh: secret はシークレットと書く
    specs:
      - from: 秘密情報の置き場
        to: シークレットの置き場
  - expected: 何をどう決めたかを書く
    pattern: /側に倒[さしすせそ]/
    prh: 判断を方向の比喩で書かない。「失敗したら処理を止める」のように、決めた動作を書く
    specs:
      - from: 安全側に倒す
        to: 安全何をどう決めたかを書く
  - expected: 起きることを書く
    patterns:
      - /引き返[さしすせそ]/
      - 収斂
      - 沈黙
    prh: 比喩の動詞を使わない。「元の状態に戻す」「エラーを出さずに終了する」のように、起きる操作や状態を書く
    specs:
      - from: 処理が沈黙する
        to: 処理が起きることを書くする
  - expected: 間違え
    pattern: 取り違え
    prh: 比喩の動詞を使わない
    specs:
      - from: 設定を取り違えた
        to: 設定を間違えた
  - expected: 比べた結果を書く
    patterns:
      - 主役
      - 別物
      - 桁違い
    prh: 評価を装う名詞を使わない。何がどう違うか、どれだけ違うかを書く
    specs:
      - from: 両者は別物である
        to: 両者は比べた結果を書くである
  - expected: 確かめた事実を書く
    patterns:
      - 手触り
      - 肌感
      - 温度感
      - 腹落ち
      - /解像度[をがの]?(?:上げ|上が|高)/
      - /本質(?:的)?/
    prh: 質感や理解を装う語を使わない。行った操作、読んだもの、測った値を書く
    specs:
      - from: 解像度を上げる
        to: 確かめた事実を書くる
  - expected: 具体的な出来事を書く
    patterns:
      - 真理
      - 境地
      - 美学
      - 深淵
      - 羅針盤
      - 起爆剤
    prh: 体験や判断を大げさな語で言わない
    specs:
      - from: 設計の美学
        to: 設計の具体的な出来事を書く
  - expected: 前置きを削る
    patterns:
      - /(?:まず|ここで)?重要なのは、?/
      - /結論から言うと、?/
      - /正直に言うと、?/
      - /注目すべき(?:点|こと)がある。?/
    prh: 前置きを書かず、言いたいことから書き始める
    specs:
      - from: 重要なのは、テストである
        to: 前置きを削るテストである
  - expected: 言い切る
    patterns:
      - /に他な(?:らない|らず|らぬ|らなかった|りません)/
      - /と言える(?:でしょう|だろう)/
    prh: 文末を飾らず、事実を言い切る
    specs:
      - from: 設定の誤りに他ならない
        to: 設定の誤り言い切る
      - from: 設定の誤りに他なりません
        to: 設定の誤り言い切る
  - expected: 結びの定型を削る
    patterns:
      - /いかがでした(?:でしょう)?か/
      - 参考になれば幸い
    prh: 読み手への形だけの呼びかけで結ばない
    specs:
      - from: いかがでしたか
        to: 結びの定型を削る

  # buddy の用語。表記は context/domain.md の用語にそろえる
  - expected: 通常
    pattern: 通常業務
    prh: 予定の種類の名前は、マイグレーションとコードの「通常」にそろえる
  - expected: 区分
    pattern: /(?<=訪問の?)カテゴリー?/
    prh: 夜勤、緊急、入院は訪問の区分と呼ぶ。Go と API の名前にそろえる
  - expected: 権限
    pattern: /ポリシー(?!エンジン)/
    prh: 職員に付けるものは権限と呼ぶ。PRD の呼び方にそろえる
  - expected: 職員か利用者
    pattern: /(?<!「[^」]*)ユーザー/
    prh: ユーザーは職員と利用者のどちらにも読める。指す相手の名前で書く。画面の文言を「」で引くときは除く
  # 技術用語は、一般的なカタカナ語か英語で書く。業務の機能の名前（予定の取り込み、予定の書き出し、結び付け）は和語のまま書く
  - expected: フェイク
    pattern: 偽物
    prh: テストのための偽の実装はフェイクと呼ぶ。コードの名前 fake に合わせる
  - expected: プレビュー
    pattern: 下見
    prh: 取り込む前の確かめはプレビューと呼ぶ。コードの名前 import_preview と画面の文言に合わせる
  - expected: スクリーンショット
    pattern: 静止画
  - expected: ローカル
    pattern: /手元(?!で扱|に置|の環境|で(?:動か|起動|実行))/
    prh: 開発者の環境はローカル、ローカル環境と書く。照合の担当が CSV を手元で扱う、手元に置く話は除く。手元の環境と、手元で動かす、起動する、実行するは、上半分の規則が指摘する
  - expected: マージする
    pattern: /(?<=(?:pull request|ブランチ|`develop`|`main`)\s?(?:を|へ|に|から)[^。予]{0,20})(?<!予定[のを]?)取り込む/
    prh: pull request のマージは、業務の機能の「予定の取り込み」と分けてマージと書く。前に「予定の」「予定を」があるときは除く
    specs:
      - from: pull request を通して取り込む
        to: pull request を通してマージする
      - from: ブランチから予定を取り込む処理
        to: ブランチから予定を取り込む処理
  - expected: マージして
    pattern: /(?<=(?:pull request|ブランチ|`develop`|`main`)\s?(?:を|へ|に|から)[^。予]{0,20})(?<!予定[のを]?)取り込んで/
    prh: pull request のマージは、業務の機能の「予定の取り込み」と分けてマージと書く。前に「予定の」「予定を」があるときは除く
    specs:
      - from: "`develop` へ取り込んでから"
        to: "`develop` へマージしてから"
  - expected: マージした
    pattern: /(?<=(?:pull request|ブランチ|`develop`|`main`)\s?(?:を|へ|に|から)[^。予]{0,20})(?<!予定[のを]?)取り込んだ/
    prh: pull request のマージは、業務の機能の「予定の取り込み」と分けてマージと書く。前に「予定の」「予定を」があるときは除く
    specs:
      - from: "`main` へ取り込んだ後"
        to: "`main` へマージした後"
  - expected: マージしない
    pattern: /(?<=(?:pull request|ブランチ|`develop`|`main`)\s?(?:を|へ|に|から)[^。予]{0,20})(?<!予定[のを]?)取り込まない/
    prh: pull request のマージは、業務の機能の「予定の取り込み」と分けてマージと書く。前に「予定の」「予定を」があるときは除く
    specs:
      - from: pull request を取り込まない
        to: pull request をマージしない
  - expected: マージ
    pattern: /(?<=(?:pull request|ブランチ|`develop`|`main`)\s?(?:を|へ|に|から)[^。予]{0,20})(?<!予定[のを]?)取り込み/
    prh: pull request のマージは、業務の機能の「予定の取り込み」と分けてマージと書く。前に「予定の」「予定を」があるときは除く
    specs:
      - from: "`develop` への取り込みは"
        to: "`develop` へのマージは"
      - from: ブランチの予定の取り込みのプレビュー
        to: ブランチの予定の取り込みのプレビュー
  - expected: リソース
    pattern: 資源
  - expected: エビデンス
    pattern: 証跡
    prh: 確かめたことの記録はエビデンスと呼ぶ。スキル attach-evidence の名前に合わせる
  - expected: 手動検証
    pattern: 人手検証
  - expected: タイトル
    pattern: 題名
    prh: 予定と画面の要素の title はタイトルと書く。画面の文言と Google カレンダーの表記に合わせる
  - expected: 配置先
    pattern: 置き場
  - expected: キー
    pattern: /(?<=アカウントの?\s?)鍵/
    prh: Google Cloud の文書の表記（サービス アカウント キー）に合わせる
