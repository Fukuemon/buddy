    { "外部のカレンダーの取り込みと書き出し" = "db/schedule/viewpoint-calendar-sync.md" },
  ] },
  { "ADR" = [
    "adr/0001-auth.md",
    "adr/0002-pbac.md",
    "adr/0003-branch-and-release.md",
    "adr/0004-design-system.md",
    "adr/0005-schedule-api-packages.md",
    "adr/0006-staff-manage-policy.md",
    "adr/0007-go-shared-module.md",
    "adr/0008-web-view-types.md",
    "adr/0009-google-calendar-sync.md",
    "adr/0010-schedule-api-usecase-boundaries.md",
    "adr/0011-schedule-api-postgresql.md",
    "adr/0012-google-calendar-facility-service-accounts.md",
    "adr/0013-services-directory.md",
    "adr/0014-service-names.md",
    "adr/0015-key-color-and-canvas.md",
    "adr/0016-id-broker-hydra.md",
    "adr/0017-identity-boundary.md",
    "adr/0018-staff-leave-and-retirement.md",
    "adr/0019-docs-site-publish-and-contrast-check.md",
    "adr/0020-docs-site-without-access.md",
    "adr/0021-patient-service-end.md",
    "adr/0022-receipt-check-policy-and-non-visiting-staff.md",
    "adr/0023-overnight-schedule.md",
    "adr/0024-e2e-functions-without-page-object.md",
    "adr/0025-web-permission-checks.md",
    "adr/0026-schedule-api-features-directory.md",
    "adr/0027-broker-login-pages-source.md",
    "adr/0028-web-site-frame-in-root-route.md",
    "adr/0029-schedule-api-feature-package-layout.md",
    "adr/0030-go-file-names-by-role.md",
    "adr/0031-go-operation-types.md",
    "adr/0032-schedule-api-calendar-split.md",
