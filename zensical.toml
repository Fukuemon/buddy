# 書体を画面と同じデザインシステムの書体（tokens.css の --font-family-sans と --font-family-mono）にする。Zensical が Google Fonts から読み込む
[project.theme.font]
text = "Noto Sans JP"
code = "Noto Sans Mono"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# 見出しのアンカーを GitHub と同じく日本語のまま残し、どちらで読んでもリンクが切れないようにする
[project.markdown_extensions.toc]
permalink = true
slugify.object = "pymdownx.slugs.slugify"
slugify.kwds.case = "lower"

# 画面仕様書の状態をタブで切り替える
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# 2 文字字下げの入れ子の箇条書きを入れ子として読む。Python-Markdown は入れ子に 4 文字を求めるが、文書は 2 文字で書く
[project.markdown_extensions.mdx_truly_sane_lists]
nested_indent = 2
