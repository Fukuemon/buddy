# ドキュメントサイトの設定。文書の配置先は context/project.yml の docs と揃える
[project]
site_name = "buddy"
site_description = "予定の管理とレセプトの照合の設計書"
docs_dir = "docs"
site_dir = "site"
# docs/design/ のシンボリックリンクの先を、プレビューでたどって再読み込みする
watch = [
  "services/schedule/DesignDoc.md",
  "services/schedule/internal/features/calendar/DesignDoc.md",
  "services/schedule/internal/access/DesignDoc.md",
  "services/schedule/internal/features/staff/DesignDoc.md",
  "services/receipt/DesignDoc.md",
  "services/broker/DesignDoc.md",
  "packages/ui/DESIGN.md",
  "packages/e2e/DesignDoc.md",
]
# ADR、画面仕様書、ワイヤーフレームのテンプレートは文書ではないので、サイトに載せない
exclude_docs = """
adr/template.md
screens/_template/
"""
# 画面仕様書に埋め込んだモックの iframe の高さを、中身に合わせる
extra_javascript = ["screens/_common/embed-mock.js"]
# サイトの色を画面と同じデザインシステムのトークンにする。tokens.css は `pnpm build:tokens`（`scripts/build-static-tokens.mjs`）の生成物
extra_css = ["screens/_common/tokens.css", "stylesheets/extra.css"]
nav = [
  { "トップ" = "index.md" },
  { "PRD" = "PRD.md" },
  { "Design Doc" = [
    { "全体" = "design/DesignDoc.md" },
    { "予定の管理" = "design/services/schedule.md" },
    { "Google カレンダーとの連携" = "design/services/schedule-calendar.md" },
    { "権限" = "design/services/schedule-access.md" },
    { "職員の管理" = "design/services/schedule-staff.md" },
    { "レセプトの照合" = "design/services/receipt.md" },
    { "ID ブローカー" = "design/services/broker.md" },
    { "E2E のテストのコード" = "design/packages/e2e.md" },
  ] },
  { "画面仕様書" = [
    { "画面の一覧" = "screens/index.md" },
    { "画面仕様書の規約" = "screens/rules.md" },
    { "予定のカレンダー" = "screens/schedule-calendar_予定のカレンダー/index.md" },
    { "予定の作成" = "screens/schedule-new_予定の作成/index.md" },
    { "予定の詳細" = "screens/schedule-detail_予定の詳細/index.md" },
    { "予定の編集" = "screens/schedule-edit_予定の編集/index.md" },
    { "カレンダーの連携" = "screens/schedule-link_カレンダーの連携/index.md" },
    { "予定の取り込み" = "screens/schedule-import_予定の取り込み/index.md" },
    { "確認が必要な予定" = "screens/schedule-review_確認が必要な予定/index.md" },
    { "予定の正本の切り替え" = "screens/schedule-cutover_予定の正本の切り替え/index.md" },
    { "職員の一覧" = "screens/staff-list_職員の一覧/index.md" },
    { "職員の登録" = "screens/staff-new_職員の登録/index.md" },
    { "職員の詳細" = "screens/staff-detail_職員の詳細/index.md" },
    { "部署とチーム" = "screens/organization-list_部署とチーム/index.md" },
    { "利用者の一覧" = "screens/patient-list_利用者の一覧/index.md" },
