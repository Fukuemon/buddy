# 文書のサイトの設定。文書の置き場は context/project.yml の docs と揃える
[project]
site_name = "buddy"
site_description = "予定の管理とレセプトの照合の設計書"
docs_dir = "docs"
site_dir = "site"
# docs/design/ のシンボリックリンクの先を、プレビューでたどって再読み込みする
watch = [
  "apps/schedule-api/DesignDoc.md",
  "apps/receipt-api/DesignDoc.md",
  "packages/ui/DESIGN.md",
  "packages/e2e/DesignDoc.md",
  "packages/e2e/kit/recording/DesignDoc.md",
]
# ADR、画面仕様書、ワイヤーフレームの雛形は文書ではないので、サイトに載せない
exclude_docs = """
adr/template.md
screens/_template/
"""
# 画面仕様書に埋め込んだモックの iframe の高さを、中身に合わせる
extra_javascript = ["javascripts/embed-mock.js"]
# サイトの色を画面と同じデザインシステムのトークンにする。tokens.css は scripts/build-mock-tokens.mjs の生成物
extra_css = ["screens/_common/tokens.css", "stylesheets/extra.css"]
nav = [
  { "トップ" = "index.md" },
  { "PRD" = "PRD.md" },
  { "Design Doc" = [
    { "全体" = "design/DesignDoc.md" },
    { "予定の管理" = "design/apps/schedule-api.md" },
    { "レセプトの照合" = "design/apps/receipt-api.md" },
    { "E2E のテストのコード" = "design/packages/e2e.md" },
    { "証跡の録画" = "design/packages/e2e-recording.md" },
  ] },
  # 予定の管理の表。tbls の生成物（scripts/build-db-docs.sh）で、viewpoint の文書は全て載せる（build-db-docs.sh が確かめる）
  # 表ごとの文書は載せず、表の一覧と viewpoint の文書から開く
  { "DB の設計" = [
    { "表の一覧" = "db/schedule-api/README.md" },
    # Liam ERD で描く、操作できる ER 図（pnpm build:erd）。同じサイトの /erd/ に置き、手元の zensical serve には無い
    { "ER 図（Liam ERD）" = "/erd/" },
    { "事業所と組織" = "db/schedule-api/viewpoint-organization.md" },
    { "職員と権限" = "db/schedule-api/viewpoint-policies.md" },
    { "利用者" = "db/schedule-api/viewpoint-patients.md" },
    { "予定と訪問" = "db/schedule-api/viewpoint-schedules.md" },
    { "繰り返しの予定" = "db/schedule-api/viewpoint-recurring.md" },
  ] },
  { "デザインシステム" = [
    { "使い方" = "design/packages/ui.md" },
    # カタログは同じサイトの /storybook/ に置く（apps/docs-site）。手元の zensical serve には無い
    { "カタログ（Storybook）" = "/storybook/" },
  ] },
  { "API の仕様" = [
    # 各アプリの openapi.yaml を Scalar で描く単独のページ（docs/api/）。サイトのテーマの外で開く
    { "予定の API" = "/api/schedule-api.html" },
    { "照合の API" = "/api/receipt-api.html" },
  ] },
  { "画面仕様書" = [
    { "画面の一覧" = "screens/index.md" },
    { "画面仕様書の規約" = "screens/rules.md" },
    { "予定のカレンダー" = "screens/schedule-calendar_予定のカレンダー/index.md" },
    { "予定の作成" = "screens/schedule-new_予定の作成/index.md" },
    { "予定の詳細" = "screens/schedule-detail_予定の詳細/index.md" },
    { "予定の編集" = "screens/schedule-edit_予定の編集/index.md" },
    { "照合" = "screens/receipt-upload_照合/index.md" },
    { "照合の結果" = "screens/receipt-result_照合の結果/index.md" },
    { "ログインの失敗" = "screens/account-error_ログインの失敗/index.md" },
  ] },
  { "ADR" = [
    "adr/0001-auth.md",
    "adr/0002-pbac.md",
    "adr/0003-branch-and-release.md",
    "adr/0004-design-system.md",
    "adr/0005-schedule-api-packages.md",
    "adr/0006-staff-manage-policy.md",
    "adr/0007-go-shared-module.md",
    "adr/0008-web-view-types.md",
  ] },
]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# 見出しのアンカーを GitHub と同じく日本語のまま残し、どちらで読んでもリンクが切れないようにする
[project.markdown_extensions.toc]
permalink = true
slugify.object = "pymdownx.slugs.slugify"
slugify.kwds.case = "lower"

# 画面仕様書の状態をタブで切り替える
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
