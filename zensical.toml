  { "DB の設計" = [
    { "テーブルの一覧" = "db/schedule/README.md" },
    # Liam ERD で描く、操作できる ER 図（pnpm build:erd）。同じサイトの /erd/ に置き、ローカルの zensical serve には無い
    { "ER 図（Liam ERD）" = "/erd/" },
