# ローカル環境で全体を起動する構成。手順は CONTRIBUTING.md の「ローカル環境で全体を起動する」にある。
# 値は全て開発用のダミーの値で、ほかの環境で使わない。

name: buddy

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USER: buddy
  DB_PASSWORD: buddy-dev
  DB_NAME: buddy

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: buddy
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy-dev
    ports: ['127.0.0.1:${POSTGRES_PORT:-15432}:5432']
    # 18 からのイメージは、メジャーバージョンごとのディレクトリを /var/lib/postgresql の下に作る
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      # 初期化の間の一時のサーバーは TCP で待ち受けないので、127.0.0.1 に届けば初期化が終わっている
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'buddy', '-d', 'buddy']
      interval: 2s
      timeout: 5s
      retries: 60

  valkey:
    image: valkey/valkey:9.1.2
    ports: ['127.0.0.1:${VALKEY_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # 開発用の OIDC の IdP。ログインの画面で入れた名前が sub になり、ほかのクレームは compose/idp.json の値になる
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      SERVER_PORT: '9000'
      JSON_CONFIG_PATH: /config/idp.json
    ports: ['127.0.0.1:${IDP_PORT:-9000}:9000']
    volumes: [./compose/idp.json:/config/idp.json:ro]
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9000/buddy/.well-known/openid-configuration',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # Google Calendar API と OAuth をローカル環境で再現する calendarpit。職員のカレンダーと予定は compose/calendarpit/fixture.json にある。
  # 書いた予定と token は volume に残り、docker compose down -v で消える。カレンダーと予定は、ブラウザで http://localhost:4173 の管理の画面に出る
  calendarpit:
    image: ghcr.io/iktakahiro/calendarpit:0.9.5@sha256:c492440490c5b39d43565593e40ce5f07ed72d901652f9778bad2e7fcc9ffeab
    environment:
      CALENDARPIT_CONFIG: /config/fixture.json
    # fixture は、volume が空のときだけ読む
    volumes: [./compose/calendarpit/fixture.json:/config/fixture.json:ro, calendarpit:/data]
    ports: ['127.0.0.1:${CALENDARPIT_PORT:-4173}:4173']
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:4173/__calendarpit/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # calendarpit の同意を通して、予定の API と照合の API が使う refresh token を取り、Application Default Credentials の形で書く
  calendarpit-authorize:
    image: ghcr.io/iktakahiro/calendarpit:0.9.5@sha256:c492440490c5b39d43565593e40ce5f07ed72d901652f9778bad2e7fcc9ffeab
    entrypoint: ['bun']
    command: ['/config/authorize.mjs', 'http://calendarpit:4173', '/data/google-calendar.json']
    # /data は、イメージの中で bun の利用者が書ける
    volumes:
      [./compose/calendarpit/authorize.mjs:/config/authorize.mjs:ro, calendarpit-credentials:/data]
    depends_on:
      calendarpit: { condition: service_healthy }

  # 予定の API と calendarpit の間の中継。E2E が、Google の変更を予定の API に渡さないようにするのに使う
  gcalhold:
    build: { context: ., dockerfile: services/schedule/Dockerfile, target: gcalhold }
    ports: ['127.0.0.1:${GCALHOLD_PORT:-8085}:8080']
    healthcheck:
      test: ['CMD', '/usr/local/bin/gcalhold', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      calendarpit: { condition: service_healthy }

  schedule-api-migrate:
    build: { context: ., dockerfile: services/schedule/Dockerfile }
    # イメージの名前にプロジェクトの名前を含め、-p で分けた別の worktree のビルドに上書きされないようにする
    image: ${COMPOSE_PROJECT_NAME}-schedule-api
    entrypoint: ['/usr/local/bin/migrate']
    command: ['up']
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }

  schedule-api-seed:
    image: ${COMPOSE_PROJECT_NAME}-schedule-api
    # イメージは schedule-api-migrate がビルドする
    pull_policy: never
    entrypoint: ['/usr/local/bin/migrate']
    command: ['seed']
    environment: *db-env
    depends_on:
      schedule-api-migrate: { condition: service_completed_successfully }

  schedule-api:
    image: ${COMPOSE_PROJECT_NAME}-schedule-api
    # イメージは schedule-api-migrate がビルドする
    pull_policy: never
    environment:
      <<: *db-env
      # トークンの iss は、IdP がトークンのリクエストの Host から決める。API とトークンを取る web は、コンテナの間の名前 idp で呼ぶ
      OIDC_ISSUER: http://idp:9000/buddy
      OIDC_AUDIENCE: schedule-api
      # web と、API の仕様のページでリクエストを試すローカル環境の文書のサイト（zensical serve）に許す
      CORS_ALLOW_ORIGINS: http://localhost:${WEB_PORT:-3000},http://localhost:8000
      # 事業所の組織と、ダミーのサービスアカウントの対応
      GOOGLE_CALENDAR_SERVICE_ACCOUNTS_FILE: /config/google-calendar-service-accounts.json
      # calendarpit はサービスアカウントの token を出さないので、calendarpit-authorize が書いた fixture の利用者の認証の情報で呼ぶ
      GOOGLE_CALENDAR_ENDPOINT: http://gcalhold:8080/calendar/v3/
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google-calendar.json
      GOOGLE_CALENDAR_EXPORT_ENABLED: 'true'
      # E2E が書き出しを待つ時間を短くする
      GOOGLE_CALENDAR_EXPORT_INTERVAL: 2s
      GOOGLE_CALENDAR_SYNC_ENABLED: 'true'
      # E2E が Google の変更の反映を待つ時間を短くする
      GOOGLE_CALENDAR_SYNC_INTERVAL: 2s
    volumes:
      - ./compose/google-calendar-service-accounts.json:/config/google-calendar-service-accounts.json:ro
      - calendarpit-credentials:/credentials:ro
    ports: ['127.0.0.1:${SCHEDULE_API_PORT:-8080}:8080']
    healthcheck:
      test: ['CMD', '/usr/local/bin/api', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      schedule-api-seed: { condition: service_completed_successfully }
      idp: { condition: service_healthy }
      calendarpit-authorize: { condition: service_completed_successfully }
      gcalhold: { condition: service_healthy }

  receipt-api:
    build: { context: ., dockerfile: services/receipt/Dockerfile }
    environment:
      OIDC_ISSUER: http://idp:9000/buddy
      OIDC_AUDIENCE: receipt-api
      # API の仕様のページでリクエストを試すローカル環境の文書のサイト（zensical serve）に許す
      CORS_ALLOW_ORIGINS: http://localhost:8000
      # 照合の対象の森のカレンダーと、予定の API と同じダミーのサービスアカウントの対応
      GOOGLE_CALENDARS_FILE: /config/receipt-calendars.json
      GOOGLE_CALENDAR_SERVICE_ACCOUNTS_FILE: /config/google-calendar-service-accounts.json
      # 予定の API と同じく、calendarpit-authorize が書いた fixture の利用者の認証の情報で calendarpit を読む。gcalhold は予定の API の同期のためのものなので通さない
      GOOGLE_CALENDAR_ENDPOINT: http://calendarpit:4173/calendar/v3/
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google-calendar.json
    volumes:
      - ./compose/receipt-calendars.json:/config/receipt-calendars.json:ro
      - ./compose/google-calendar-service-accounts.json:/config/google-calendar-service-accounts.json:ro
      - calendarpit-credentials:/credentials:ro
    ports: ['127.0.0.1:${RECEIPT_API_PORT:-8090}:8080']
    healthcheck:
      test: ['CMD', '/api', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      idp: { condition: service_healthy }
      calendarpit-authorize: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      OIDC_ISSUER: http://idp:9000/buddy
      # ブラウザは idp の名前を引けないので、認可の画面だけローカルのポートへ転送する
      OIDC_AUTHORIZATION_ENDPOINT: http://localhost:${IDP_PORT:-9000}/buddy/authorize
      OIDC_CLIENT_ID: web
      OIDC_CLIENT_SECRET: web-dev
      SESSION_STORE_URL: redis://valkey:6379
      SESSION_SECRET: buddy-dev-session-secret-for-compose-only
      # ローカル環境は https でないので、cookie に Secure を付けない
      SESSION_COOKIE_SECURE: 'false'
      SCHEDULE_API_URL: http://schedule-api:8080
      RECEIPT_API_URL: http://receipt-api:8080
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      valkey: { condition: service_healthy }
      idp: { condition: service_healthy }
      schedule-api: { condition: service_healthy }
      receipt-api: { condition: service_healthy }

volumes:
  postgres:
  calendarpit:
  calendarpit-credentials:
