# ローカル環境で全体を起動する構成。手順は CONTRIBUTING.md の Running Locally にある。
# 値は全て開発用のダミーの値で、ほかの環境で使わない。
#
# portless compose up で起動し、ブラウザが開く URL を portless のホスト名の https の URL にする（ADR-0036）。
# ブラウザが開く URL は *_ORIGIN の環境変数で受ける。未設定のときは https://<サービス>.<プロジェクトの名前>.localhost にする。
# worktrunk で作った worktree では、名前の _ を - に変えたホスト名を、.config/wt.toml が .env に書く。
# CI は docker compose up で起動し、*_ORIGIN に http://localhost:<ポート> を渡す（.github/workflows/ci.yml）。

name: buddy

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USER: buddy
  DB_PASSWORD: buddy-dev
  DB_NAME: buddy

x-broker-db-env: &broker-db-env
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USER: buddy
  DB_PASSWORD: buddy-dev
  DB_NAME: broker

# 予定の API と calendar-worker が Google カレンダー（calendarpit）を読み書きする設定
x-calendar-env: &calendar-env
  # 事業所の組織と、ダミーのサービスアカウントの対応
  GOOGLE_CALENDAR_SERVICE_ACCOUNTS_FILE: /config/google-calendar-service-accounts.json
  # calendarpit はサービスアカウントの token を出さないので、calendarpit-authorize が書いた fixture の利用者の認証の情報で呼ぶ
  GOOGLE_CALENDAR_ENDPOINT: http://gcalhold:8080/calendar/v3/
  GOOGLE_APPLICATION_CREDENTIALS: /credentials/google-calendar.json
  GOOGLE_CALENDAR_EXPORT_ENABLED: 'true'

x-calendar-volumes: &calendar-volumes
  - ./compose/google-calendar-service-accounts.json:/config/google-calendar-service-accounts.json:ro
  - calendarpit-credentials:/credentials:ro

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: buddy
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy-dev
    ports: ['127.0.0.1:${POSTGRES_PORT:-15432}:5432']
    # 18 からのイメージは、メジャーバージョンごとのディレクトリを /var/lib/postgresql の下に作る
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      # 初期化の間の一時のサーバーは TCP で待ち受けないので、127.0.0.1 に届けば初期化が終わっている
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'buddy', '-d', 'buddy']
      interval: 2s
      timeout: 5s
      retries: 60

  valkey:
    image: valkey/valkey:9.1.2
    ports: ['127.0.0.1:${VALKEY_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # 同じ PostgreSQL に、Hydra、ブローカー、web のセッションのデータベースを作る
  postgres-init:
    image: postgres:18.6
    entrypoint: ['/bin/sh', '/config/create-databases.sh']
    environment:
      PGHOST: postgres
      PGUSER: buddy
      PGPASSWORD: buddy-dev
      PGDATABASE: buddy
    volumes: [./compose/postgres/create-databases.sh:/config/create-databases.sh:ro]
    depends_on:
      postgres: { condition: service_healthy }

  # 事業所の上流の IdP のフェイク（mock-oauth2-server）。パスの最初の部分が issuer になるので、
  # 1 つのコンテナで 5 つの事業所の IdP（/office-a から /office-e）を立てる。/office-e の組織 org-sample-e はシードに無く、運営用の CLI で事業所を足すのに使う。
  # ログインの画面で入れた名前が sub に、クレームの欄に書いた JSON（email と email_verified）が ID token のクレームになる
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      SERVER_PORT: '9000'
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports: ['127.0.0.1:${IDP_PORT:-9000}:9000']
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9000/office-a/.well-known/openid-configuration',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: ['migrate', 'sql', 'up', '--read-from-env', '--yes']
    environment:
      DSN: postgres://buddy:buddy-dev@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres-init: { condition: service_completed_successfully }

  # トークンを発行する Ory Hydra（ADR-0002）。設定は compose/hydra/hydra.yml にある。
  # --dev は、ローカル環境の http の URL を許す
  hydra:
    image: oryd/hydra:v26.2.0
    command: ['serve', 'all', '--dev', '--config', '/config/hydra.yml']
    environment:
      DSN: postgres://buddy:buddy-dev@postgres:5432/hydra?sslmode=disable
      # 認可の画面とブローカーの画面は、ブラウザが開く
      URLS_SELF_PUBLIC: ${HYDRA_PUBLIC_ORIGIN:-https://hydra.${COMPOSE_PROJECT_NAME}.localhost}
      URLS_LOGIN: ${BROKER_ORIGIN:-https://broker.${COMPOSE_PROJECT_NAME}.localhost}/login
      URLS_CONSENT: ${BROKER_ORIGIN:-https://broker.${COMPOSE_PROJECT_NAME}.localhost}/consent
      URLS_LOGOUT: ${BROKER_ORIGIN:-https://broker.${COMPOSE_PROJECT_NAME}.localhost}/logout
    volumes: [./compose/hydra/hydra.yml:/config/hydra.yml:ro]
    ports:
      - '127.0.0.1:${HYDRA_PUBLIC_PORT:-4444}:4444'
      - '127.0.0.1:${HYDRA_ADMIN_PORT:-4445}:4445'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4445/health/ready']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }

  # Hydra に web と予定の API のクライアントを登録する
  hydra-clients:
    image: oryd/hydra:v26.2.0
    entrypoint: ['/bin/sh', '/config/clients.sh']
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      WEB_REDIRECT_URI: ${WEB_ORIGIN:-https://web.${COMPOSE_PROJECT_NAME}.localhost}/auth/callback
      # web のログアウトは、Hydra のログインのセッションを消した後に web の / へ戻る
      WEB_POST_LOGOUT_REDIRECT_URI: ${WEB_ORIGIN:-https://web.${COMPOSE_PROJECT_NAME}.localhost}/
    volumes: [./compose/hydra/clients.sh:/config/clients.sh:ro]
    depends_on:
      hydra: { condition: service_healthy }

  broker-migrate:
    build: { context: ., dockerfile: services/broker/Dockerfile }
    # イメージの名前にプロジェクトの名前を含め、-p で分けた別の worktree のビルドに上書きされないようにする
    image: ${COMPOSE_PROJECT_NAME}-broker
    entrypoint: ['/usr/local/bin/migrate']
    command: ['up']
    environment: *broker-db-env
    depends_on:
      postgres-init: { condition: service_completed_successfully }

  broker-seed:
    image: ${COMPOSE_PROJECT_NAME}-broker
    # イメージは broker-migrate がビルドする
    pull_policy: never
    entrypoint: ['/usr/local/bin/migrate']
    command: ['seed']
    environment: *broker-db-env
    depends_on:
      broker-migrate: { condition: service_completed_successfully }

  # ID ブローカー（ADR-0002）。Hydra のログインと同意の画面を持ち、職員の事業所の上流の IdP へリダイレクトする
  broker:
    image: ${COMPOSE_PROJECT_NAME}-broker
    # イメージは broker-migrate がビルドする
    pull_policy: never
    environment:
      <<: *broker-db-env
      HYDRA_ADMIN_URL: http://hydra:4445
      PUBLIC_URL: ${BROKER_ORIGIN:-https://broker.${COMPOSE_PROJECT_NAME}.localhost}
      UPSTREAM_IDPS_FILE: /config/upstream-idps.json
      UPSTREAM_IDP_CLIENT_SECRETS_FILE: /config/upstream-idp-client-secrets.json
      # ブローカーは上流の IdP の discovery の文書をコンテナの間の名前 idp で読む。ブラウザは idp の名前を引けないので、
      # 認可の画面だけブラウザが開く URL へリダイレクトする
      UPSTREAM_IDP_BROWSER_ORIGIN: ${IDP_ORIGIN:-https://idp.${COMPOSE_PROJECT_NAME}.localhost}
      # 内部の API は、予定の API の client credentials の access token を、Hydra の JWKS で検証する
      HYDRA_ISSUER: http://hydra:4444
      # Hydra が token_hook を呼ぶときのヘッダーの値。compose/hydra/hydra.yml の oauth2.token_hook と同じにする
      TOKEN_HOOK_KEY: buddy-dev-token-hook-key-for-compose-only
      # ログインの途中の cookie に署名する鍵。先頭で署名し、全てで検証する
      LOGIN_COOKIE_KEYS: buddy-dev-login-cookie-key-for-compose-only
    volumes:
      - ./compose/broker/upstream-idps.json:/config/upstream-idps.json:ro
      - ./compose/broker/upstream-idp-client-secrets.json:/config/upstream-idp-client-secrets.json:ro
    # 8080 はログインの画面、8081 は内部の API と token_hook である。内部の API は、E2E がトークンなしの呼び出しを試すのに公開する
    ports: ['127.0.0.1:${BROKER_PORT:-8100}:8080', '127.0.0.1:${BROKER_INTERNAL_PORT:-8101}:8081']
    healthcheck:
      test: ['CMD', '/usr/local/bin/broker', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      broker-seed: { condition: service_completed_successfully }
      hydra: { condition: service_healthy }
      idp: { condition: service_healthy }

  # Google Calendar API と OAuth をローカル環境で再現する calendarpit。職員のカレンダーと予定は compose/calendarpit/fixture.json にある。
  # 書いた予定と token は volume に残り、portless compose down -v で消える。カレンダーと予定は、ブラウザで https://calendarpit.<プロジェクトの名前>.localhost の管理の画面に出る
  calendarpit:
    image: ghcr.io/iktakahiro/calendarpit:0.9.5@sha256:c492440490c5b39d43565593e40ce5f07ed72d901652f9778bad2e7fcc9ffeab
    environment:
      CALENDARPIT_CONFIG: /config/fixture.json
    # fixture は、volume が空のときだけ読む
    volumes: [./compose/calendarpit/fixture.json:/config/fixture.json:ro, calendarpit:/data]
    ports: ['127.0.0.1:${CALENDARPIT_PORT:-4173}:4173']
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:4173/__calendarpit/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # calendarpit の同意を通して、予定の API と照合の API が使う refresh token を取り、Application Default Credentials の形で書く
  calendarpit-authorize:
    image: ghcr.io/iktakahiro/calendarpit:0.9.5@sha256:c492440490c5b39d43565593e40ce5f07ed72d901652f9778bad2e7fcc9ffeab
    entrypoint: ['bun']
    command: ['/config/authorize.mjs', 'http://calendarpit:4173', '/data/google-calendar.json']
    # /data は、イメージの中で bun の利用者が書ける
    volumes:
      [./compose/calendarpit/authorize.mjs:/config/authorize.mjs:ro, calendarpit-credentials:/data]
    depends_on:
      calendarpit: { condition: service_healthy }

  # 予定の API と calendarpit の間の中継。E2E が、Google の変更を予定の API に渡さないようにするのに使う
  gcalhold:
    build: { context: ., dockerfile: services/schedule/Dockerfile, target: gcalhold }
    ports: ['127.0.0.1:${GCALHOLD_PORT:-8085}:8080']
    healthcheck:
      test: ['CMD', '/usr/local/bin/gcalhold', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      calendarpit: { condition: service_healthy }

  schedule-migrate:
    build: { context: ., dockerfile: services/schedule/Dockerfile }
    # イメージの名前にプロジェクトの名前を含め、-p で分けた別の worktree のビルドに上書きされないようにする
    image: ${COMPOSE_PROJECT_NAME}-schedule
    entrypoint: ['/usr/local/bin/migrate']
    command: ['up']
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }

  schedule-seed:
    image: ${COMPOSE_PROJECT_NAME}-schedule
    # イメージは schedule-migrate がビルドする
    pull_policy: never
    entrypoint: ['/usr/local/bin/migrate']
    command: ['seed']
    environment: *db-env
    depends_on:
      schedule-migrate: { condition: service_completed_successfully }

  schedule:
    image: ${COMPOSE_PROJECT_NAME}-schedule
    # イメージは schedule-migrate がビルドする
    pull_policy: never
    environment:
      # 書き出しの設定（calendar-env）で、予定の変更を書き出しの待ちに積む。待ちを書くのは schedule-calendar-export である
      <<: [*db-env, *calendar-env]
      # トークンの iss は Hydra の urls.self.issuer で、API はコンテナの間の名前 hydra で JWKS を読む
      OIDC_ISSUER: http://hydra:4444
      OIDC_AUDIENCE: schedule
      # 職員の登録、休職、復職、退職で、ブローカーの内部の API を呼ぶ。compose/hydra/clients.sh が登録した schedule のクライアントで、
      # client credentials の access token を取る
      BROKER_URL: http://broker:8081
      BROKER_TOKEN_URL: http://hydra:4444/oauth2/token
      BROKER_CLIENT_SECRET: schedule-dev
      # web と、API の仕様のページでリクエストを試すローカル環境のドキュメントサイト（zensical serve）に許す
      CORS_ALLOW_ORIGINS: ${WEB_ORIGIN:-https://web.${COMPOSE_PROJECT_NAME}.localhost},http://localhost:8000
    volumes: *calendar-volumes
    ports: ['127.0.0.1:${SCHEDULE_PORT:-8080}:8080']
    healthcheck:
      test: ['CMD', '/usr/local/bin/api', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      schedule-seed: { condition: service_completed_successfully }
      hydra: { condition: service_healthy }
      hydra-clients: { condition: service_completed_successfully }
      broker: { condition: service_healthy }
      calendarpit-authorize: { condition: service_completed_successfully }
      gcalhold: { condition: service_healthy }

  # 予定の API の運営用の CLI。portless compose up では起動せず、事業所を足すときに
  # 流し方は CONTRIBUTING.md の「事業所と最初のマネージャーを足す」にある
  schedule-ops:
    image: ${COMPOSE_PROJECT_NAME}-schedule
    # イメージは schedule-migrate がビルドする
    pull_policy: never
    profiles: [ops]
    entrypoint: ['/usr/local/bin/ops']
    environment:
      <<: *db-env
      # compose/hydra/clients.sh が登録した運営用の schedule-ops のクライアントで、ブローカーの内部の API を呼ぶ
      BROKER_URL: http://broker:8081
      BROKER_TOKEN_URL: http://hydra:4444/oauth2/token
      BROKER_CLIENT_ID: schedule-ops
      BROKER_CLIENT_SECRET: schedule-ops-dev
    depends_on:
      schedule-seed: { condition: service_completed_successfully }
      hydra-clients: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  # 予定の API と同じイメージの calendar-worker が、書き出しと同期を役割ごとのプロセスで常駐して動かす（ADR-0032）
  schedule-calendar-export:
    image: ${COMPOSE_PROJECT_NAME}-schedule
    # イメージは schedule-migrate がビルドする
    pull_policy: never
    entrypoint: ['/usr/local/bin/calendar-worker']
    command: ['export']
    environment:
      <<: [*db-env, *calendar-env]
      # E2E が書き出しを待つ時間を短くする
      GOOGLE_CALENDAR_EXPORT_INTERVAL: 2s
    volumes: *calendar-volumes
    depends_on: &calendar-worker-depends
      schedule-seed: { condition: service_completed_successfully }
      calendarpit-authorize: { condition: service_completed_successfully }
      gcalhold: { condition: service_healthy }

  schedule-calendar-sync:
    image: ${COMPOSE_PROJECT_NAME}-schedule
    # イメージは schedule-migrate がビルドする
    pull_policy: never
    entrypoint: ['/usr/local/bin/calendar-worker']
    command: ['sync']
    environment:
      <<: [*db-env, *calendar-env]
      GOOGLE_CALENDAR_SYNC_ENABLED: 'true'
      # E2E が Google の変更の反映を待つ時間を短くする
      GOOGLE_CALENDAR_SYNC_INTERVAL: 2s
    volumes: *calendar-volumes
    depends_on: *calendar-worker-depends

  receipt:
    build: { context: ., dockerfile: services/receipt/Dockerfile }
    environment:
      OIDC_ISSUER: http://hydra:4444
      OIDC_AUDIENCE: receipt
      # 照合の前に、受けたトークンで予定の API の GET /v1/me を呼び、照合の権限を確認する（ADR-0007）
      SCHEDULE_URL: http://schedule:8080
      # API の仕様のページでリクエストを試すローカル環境のドキュメントサイト（zensical serve）に許す
      CORS_ALLOW_ORIGINS: http://localhost:8000
      # 照合の対象の森のカレンダーと、予定の API と同じダミーのサービスアカウントの対応
      GOOGLE_CALENDARS_FILE: /config/receipt-calendars.json
      GOOGLE_CALENDAR_SERVICE_ACCOUNTS_FILE: /config/google-calendar-service-accounts.json
      # 予定の API と同じく、calendarpit-authorize が書いた fixture の利用者の認証の情報で calendarpit を読む。gcalhold は予定の API の同期のためのものなので通さない
      GOOGLE_CALENDAR_ENDPOINT: http://calendarpit:4173/calendar/v3/
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google-calendar.json
    volumes:
      - ./compose/receipt-calendars.json:/config/receipt-calendars.json:ro
      - ./compose/google-calendar-service-accounts.json:/config/google-calendar-service-accounts.json:ro
      - calendarpit-credentials:/credentials:ro
    ports: ['127.0.0.1:${RECEIPT_PORT:-8090}:8080']
    healthcheck:
      test: ['CMD', '/api', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      hydra: { condition: service_healthy }
      schedule: { condition: service_healthy }
      calendarpit-authorize: { condition: service_completed_successfully }

  # web のセッションを PostgreSQL に置くときのテーブルを作る（ADR-0047）。Valkey に置くときも流し、切り替えに作り直しを要らなくする
  web-migrate:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    # イメージの名前にプロジェクトの名前を含め、-p で分けた別の worktree のビルドに上書きされないようにする
    image: ${COMPOSE_PROJECT_NAME}-web
    entrypoint: ['/usr/local/bin/migrate']
    command: ['up']
    environment:
      SESSION_STORE_URL: postgres://buddy:buddy-dev@postgres:5432/web?sslmode=disable
    depends_on:
      postgres-init: { condition: service_completed_successfully }

  web:
    image: ${COMPOSE_PROJECT_NAME}-web
    # イメージは web-migrate がビルドする
    pull_policy: never
    environment:
      # discovery の文書の認可のエンドポイントは、ブラウザが開く URL を指す（compose/hydra/hydra.yml）
      OIDC_ISSUER: http://hydra:4444
      OIDC_CLIENT_ID: web
      OIDC_CLIENT_SECRET: web-dev
      # Hydra は discovery の end_session_endpoint を Issuer の URL（コンテナの間の名前）から作るので、ブラウザが開く URL を渡す
      OIDC_END_SESSION_ENDPOINT: ${HYDRA_PUBLIC_ORIGIN:-https://hydra.${COMPOSE_PROJECT_NAME}.localhost}/oauth2/sessions/logout
      # PostgreSQL に置くときは、WEB_SESSION_STORE_URL に postgres://buddy:buddy-dev@postgres:5432/web?sslmode=disable を渡す
      SESSION_STORE_URL: ${WEB_SESSION_STORE_URL:-redis://valkey:6379}
      SESSION_SECRET: buddy-dev-session-secret-for-compose-only
      # portless は TLS を終端して web へ http で渡すので、ログインとログアウトの戻り先は、ブラウザが開く URL から作る
      PUBLIC_URL: ${WEB_ORIGIN:-https://web.${COMPOSE_PROJECT_NAME}.localhost}
      # http://localhost で開く CI では、cookie に Secure を付けないよう false を渡す
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SCHEDULE_URL: http://schedule:8080
      RECEIPT_URL: http://receipt:8080
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      valkey: { condition: service_healthy }
      web-migrate: { condition: service_completed_successfully }
      hydra-clients: { condition: service_completed_successfully }
      broker: { condition: service_healthy }
      schedule: { condition: service_healthy }
      receipt: { condition: service_healthy }

volumes:
  postgres:
  calendarpit:
  calendarpit-credentials:
