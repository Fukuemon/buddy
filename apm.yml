name: buddy
version: 0.1.0
targets: [claude, codex]
dependencies:
  apm:
    - Fukuemon/agent-harness/packages/core#core-v0.3.0
    - Fukuemon/agent-harness/packages/docs#docs-v0.2.14
    - Fukuemon/agent-harness/packages/verification#verification-v0.3.1
    - Fukuemon/agent-harness/packages/e2e#e2e-v0.2.1
    - Fukuemon/agent-harness/packages/screens#screens-v0.1.2
    - Fukuemon/agent-harness/packages/design-system#design-system-v0.3.0
    - Fukuemon/agent-harness/packages/docs-site#docs-site-v0.1.3
lifecycle:
  post-install:
  - type: command
    description: apm の配置先を .gitignore に足す（agent-harness）
    command: 'd=$(ls -d .claude/skills/setup-agent-harness .agents/skills/setup-agent-harness 2>/dev/null | head -1); [ -n "$d" ] || d=$(find "$HOME/.claude/plugins/cache" -maxdepth 5 -type d -path "*/core/*/skills/setup-agent-harness" 2>/dev/null | head -1); [ -z "$d" ] || node "$d/scripts/setup.mjs" --gitignore'
    timeoutSec: 30
