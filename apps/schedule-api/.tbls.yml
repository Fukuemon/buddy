# tbls の設定。文書は scripts/build-db-docs.sh で生成する
docPath: docs/db/schedule-api
format:
  adjust: true
er:
  format: mermaid
  # 表ごとの文書には、その表と直接つながる表だけを描く
  distance: 1
exclude:
  - schema_migrations
name: schedule-api
# 表とカラムの説明は、マイグレーションの SQL の COMMENT ON に書く。tbls と sqlc の生成コードが同じ説明を読む
# 業務のまとまりごとに ER 図を描く。境界の表（事業所、職員など）は、関係を読むのに要るまとまりにも入れる
viewpoints:
  - id: organization
    name: 事業所と組織
    desc: 事業所と、その中の部署、チーム、役職、職員
    tables:
      - facilities
      - departments
      - teams
      - positions
      - users
  - id: policies
    name: 職員と権限
    desc: 職員が持つ権限と、その対象。職員を登録するとき、役職の既定の権限を写す
    tables:
      - users
      - positions
      - teams
      - policies
      - position_policies
      - user_policies
      - user_policy_targets
  - id: patients
    name: 利用者
    desc: 利用者と、受けているサービスと、主に担当する職員
    tables:
      - patients
      - service_codes
      - users
      - facilities
  - id: schedules
    name: 予定と訪問
    desc: 予定と、訪問のときの訪問の情報と区分、予定の取り消し
    tables:
      - schedules
      - schedule_types
      - schedule_cancels
      - visit_infos
      - visit_categories
      - visit_info_visit_categories
      - recurring_schedules
      - patients
      - service_codes
      - users
      - facilities
      - schedule_details
      - visit_info_details
  - id: recurring
    name: 繰り返しの予定
    desc: 繰り返しの予定と規則、回にしない日。繰り返しの 1 回を置き換えた予定は schedules に入る
    tables:
      - recurring_schedules
      - recurring_schedule_exclusions
      - schedules
      - schedule_types
      - visit_infos
      - users
      - facilities
      - recurring_schedule_details
  - id: calendar-sync
    name: 外部のカレンダーの取り込みと書き出し
    desc: 職員の外部のカレンダーと同期の状態、外部の予定と予定の対応、取り込みの記録、書き出しの待ち
    tables:
      - external_calendars
      - calendar_sync_states
      - external_event_links
      - import_runs
      - calendar_exports
      - schedules
      - recurring_schedules
      - users
lint:
  requireViewpoints:
    enabled: true
