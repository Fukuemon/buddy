version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # Dependabot は pnpm を npm の ecosystem で扱う。ルートの pnpm-lock.yaml が全てのワークスペースの依存を持つ。
  # https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /apps/schedule-api
      - /apps/receipt-api
      - /packages/go
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gomod:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/schedule-api
      - /apps/receipt-api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # node のメジャーは、LTS のバージョンへ mise.toml と CI と Dockerfile をそろえて手で上げる
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ['*']
        update-types: [minor, patch]
