# pull request と develop への push で、取り込む前に通す検査を流す。
# 検査の一覧とローカル環境での流し方は context/testing.md と CONTRIBUTING.md にある。
# Go、golangci-lint、sqlc のバージョンは mise.toml から入れ、ローカル環境とそろえる。Node と pnpm は docs-site.yml と同じ入れ方にする。
# ランナーは、リポジトリの変数 RUNS_ON で self-hosted runner に替えられる（context/operations.md の CI Runners）。
# self-hosted runner は Go、pnpm、mise のキャッシュを機械に残すので、actions/cache と setup-node と mise のキャッシュは GitHub のランナーでだけ使う。

name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # pull request の変更が文書（docs/ の下のファイルと *.md）だけかを判定し、e2e と go のジョブを飛ばすかを渡す。
  # ワークフローの全体を on.pull_request.paths で止めないのは、止めたワークフローのチェックが報告されず、待ちのまま残るためである。
  # develop への push では判定せず、全てのジョブを流す。
  changes:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      # pull request では、base の先端と head を合わせた merge commit を取る。1 つ目の親が base の先端なので、2 つ分の履歴で差分が取れる
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          # 差分が空のときは、文書だけの変更とみなさず、全てのジョブを流す
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  typescript:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # packages/ui のコンポーネントのテストは、Vitest のブラウザのモードで chromium を使う
      - run: pnpm --filter @buddy/ui exec playwright install --with-deps chromium
      - run: pnpm lint:openapi
      - run: pnpm check:screens
      - run: pnpm check:contrast
      - run: pnpm check:design
      - run: pnpm -r check
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@buddy/e2e' test

  go:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go, services/broker, services/receipt, services/schedule]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: go golangci-lint
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ matrix.module }}-${{ hashFiles('mise.toml', format('{0}/go.sum', matrix.module)) }}
          restore-keys: go-${{ matrix.module }}-
      - run: go vet ./...
      - run: golangci-lint run
      # 予定の API のリポジトリのテストとブローカーのマイグレーションのテストは、testcontainers で PostgreSQL のコンテナを起動する
      - run: go test ./...

  generated:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: go aqua:sqlc-dev/sqlc
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-generated-${{ hashFiles('mise.toml', 'services/*/go.sum') }}
          restore-keys: go-generated-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
        env:
          GOWORK: 'off'

  db-docs:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: go aqua:k1LoW/tbls
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-db-docs-${{ hashFiles('mise.toml', 'services/schedule/go.sum') }}
          restore-keys: go-db-docs-
      # マイグレーションを当てた PostgreSQL から表の文書を作り直し、コミットした文書と差分がないことを確認する
      - run: sh scripts/build-db-docs.sh
      - run: |
          git diff --exit-code -- docs/db
          untracked=$(git ls-files --others --exclude-standard -- docs/db)
          if [ -n "$untracked" ]; then
            echo "追跡していない表の文書がある:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # self-hosted runner の機械では、ローカル環境の compose が動いていることがある。
    # プロジェクトの名前を分け、ポートをローカル環境のデフォルトから全てずらす（CONTRIBUTING.md の Running Locally）
    env:
      COMPOSE_PROJECT_NAME: buddy-ci
      WEB_PORT: '13000'
      SCHEDULE_PORT: '18080'
      RECEIPT_PORT: '18090'
      BROKER_PORT: '18100'
      BROKER_INTERNAL_PORT: '18101'
      HYDRA_PUBLIC_PORT: '14444'
      HYDRA_ADMIN_PORT: '14445'
      IDP_PORT: '19000'
      POSTGRES_PORT: '25432'
      VALKEY_PORT: '16379'
      CALENDARPIT_PORT: '14173'
      GCALHOLD_PORT: '18085'
      E2E_BASE_URL: http://localhost:13000
      E2E_SCHEDULE_URL: http://localhost:18080
      E2E_RECEIPT_URL: http://localhost:18090
      E2E_BROKER_URL: http://localhost:18100
      E2E_BROKER_INTERNAL_URL: http://localhost:18101
      E2E_HYDRA_URL: http://localhost:14444
      E2E_CALENDARPIT_URL: http://localhost:14173
      E2E_GCALHOLD_URL: http://localhost:18085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buddy/e2e exec playwright install --with-deps chromium
      # runner が落ちて前の実行が片付けられなかったときに、残ったボリュームの上でシードを流さないよう、先に消す
      - run: docker compose down -v --remove-orphans
      - run: docker compose up --build --wait
      - run: pnpm e2e
      - name: compose のログを出す
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          path: packages/e2e/test-results/
          retention-days: 7
      # 予定の API とブローカーのイメージは、次の実行で同じ名前に作り直すので残す
      - name: compose を片付ける
        if: always()
        run: docker compose down -v --rmi local
      # self-hosted runner ではディスクが残るので、タグの無いイメージと 7 日より古いビルドのキャッシュを消す。
      # Docker は runner の機械のローカル環境と共有なので、ローカル環境のものも消える
      - name: Docker のイメージとキャッシュを片付ける
        if: always() && runner.environment == 'self-hosted'
        run: |
          docker image prune -f
          docker builder prune -f --filter until=168h
