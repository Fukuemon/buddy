# pull request と develop への push で、取り込む前に通す検査を流す。
# 検査の一覧と手元での流し方は context/testing.md と CONTRIBUTING.md にある。
# Go、golangci-lint、sqlc のバージョンは mise.toml から入れ、手元とそろえる。Node と pnpm は docs-site.yml と同じ入れ方にする。

name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/ui のコンポーネントのテストは、Vitest のブラウザのモードで chromium を使う
      - run: pnpm --filter @buddy/ui exec playwright install --with-deps chromium
      - run: pnpm lint:openapi
      - run: pnpm check:screens
      - run: pnpm -r check
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@buddy/e2e' test
      - run: pnpm --filter @buddy/e2e test:rules

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go, apps/receipt-api, apps/schedule-api]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ matrix.module }}-${{ hashFiles('mise.toml', format('{0}/go.sum', matrix.module)) }}
          restore-keys: go-${{ matrix.module }}-
      - run: go vet ./...
      - run: golangci-lint run
      # schedule-api のリポジトリのテストは、testcontainers で MySQL のコンテナを起動する
      - run: go test ./...

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: jdx/mise-action@v5
        with:
          install_args: go aqua:sqlc-dev/sqlc
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-generated-${{ hashFiles('mise.toml', 'apps/*/go.sum') }}
          restore-keys: go-generated-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
        env:
          GOWORK: 'off'

  db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go aqua:k1LoW/tbls
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-db-docs-${{ hashFiles('mise.toml', 'apps/schedule-api/go.sum') }}
          restore-keys: go-db-docs-
      # マイグレーションを当てた MySQL から表の文書を作り直し、コミットした文書と差分がないことを確かめる
      - run: sh scripts/build-db-docs.sh
      - run: |
          git diff --exit-code -- docs/db
          untracked=$(git ls-files --others --exclude-standard -- docs/db)
          if [ -n "$untracked" ]; then
            echo "追跡していない表の文書がある:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buddy/e2e exec playwright install --with-deps chromium
      - run: docker compose up --build --wait
      - run: pnpm e2e
      - name: compose のログを出す
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: packages/e2e/test-results/
          retention-days: 7
