# pull request と develop への push で、取り込む前に通す検査を流す。
# 検査の一覧と手元での流し方は context/testing.md と CONTRIBUTING.md にある。
# Go と sqlc のバージョンは mise.toml から入れ、手元とそろえる。

name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/ui のコンポーネントのテストは、Vitest のブラウザのモードで chromium を使う
      - run: pnpm --filter @buddy/ui exec playwright install --with-deps chromium
      - run: pnpm -r check
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@buddy/e2e' test
      - run: pnpm --filter @buddy/e2e test:rules

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go, apps/receipt-api, apps/schedule-api]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: go golangci-lint
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: go-${{ matrix.module }}-
      - run: go vet ./...
      - run: golangci-lint run
      # schedule-api のリポジトリのテストは、testcontainers で MySQL のコンテナを起動する
      - run: go test ./...

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: jdx/mise-action@v3
        with:
          install_args: go aqua:sqlc-dev/sqlc
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-generated-${{ hashFiles('apps/*/go.sum') }}
          restore-keys: go-generated-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
        env:
          GOWORK: 'off'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buddy/e2e exec playwright install --with-deps chromium
      - run: docker compose up --build --wait
      - run: pnpm e2e
      - name: compose のログを出す
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: packages/e2e/test-results/
          retention-days: 7
