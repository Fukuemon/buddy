# pull request と develop への push で、取り込む前に通す検査を流す。
# 検査の一覧とローカル環境での流し方は context/testing.md と CONTRIBUTING.md にある。
# Go、golangci-lint、sqlc のバージョンは mise.toml から入れ、ローカル環境とそろえる。Node と pnpm は docs-site.yml と同じ入れ方にする。

name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/ui のコンポーネントのテストは、Vitest のブラウザのモードで chromium を使う
      - run: pnpm --filter @buddy/ui exec playwright install --with-deps chromium
      - run: pnpm lint:openapi
      - run: pnpm check:screens
      - run: pnpm -r check
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@buddy/e2e' test
      - run: pnpm --filter @buddy/e2e test:rules

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go, services/broker, services/receipt, services/schedule]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go golangci-lint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ matrix.module }}-${{ hashFiles('mise.toml', format('{0}/go.sum', matrix.module)) }}
          restore-keys: go-${{ matrix.module }}-
      - run: go vet ./...
      - run: golangci-lint run
      # 予定の API のリポジトリのテストとブローカーのマイグレーションのテストは、testcontainers で PostgreSQL のコンテナを起動する
      - run: go test ./...

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go aqua:sqlc-dev/sqlc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-generated-${{ hashFiles('mise.toml', 'services/*/go.sum') }}
          restore-keys: go-generated-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
        env:
          GOWORK: 'off'

  db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go aqua:k1LoW/tbls
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-db-docs-${{ hashFiles('mise.toml', 'services/schedule/go.sum') }}
          restore-keys: go-db-docs-
      # マイグレーションを当てた PostgreSQL から表の文書を作り直し、コミットした文書と差分がないことを確認する
      - run: sh scripts/build-db-docs.sh
      - run: |
          git diff --exit-code -- docs/db
          untracked=$(git ls-files --others --exclude-standard -- docs/db)
          if [ -n "$untracked" ]; then
            echo "追跡していない表の文書がある:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buddy/e2e exec playwright install --with-deps chromium
      - run: docker compose up --build --wait
      - run: pnpm e2e
      - name: compose のログを出す
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          path: packages/e2e/test-results/
          retention-days: 7
