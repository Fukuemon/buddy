# 文書のサイトと、Storybook のカタログと、表の ER 図を、1 つの Worker（buddy-docs）として Cloudflare に出す。
# 手順と Access の設定は apps/docs-site/README.md にある。
# pull request ではプレビューを出して URL をコメントし、develop に入ったら本番に出す。
# フォークと Dependabot の pull request には GitHub が secret を渡さないので、ビルドだけを流し、プレビューとコメントを飛ばす。
# 文書の元は docs/ のほか、各アプリの Design Doc にも散るので、変えた場所で絞らない。

name: 文書のサイト

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build

      - name: プレビューを出す
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        id: preview
        working-directory: apps/docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm run deploy:preview "pr-${{ github.event.pull_request.number }}" | tee preview.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' preview.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: プレビューの URL を pull request にコメントする
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body "文書のサイトのプレビュー

          - 文書のサイト: ${{ steps.preview.outputs.url }}/
          - カタログ: ${{ steps.preview.outputs.url }}/storybook/
          - ER 図: ${{ steps.preview.outputs.url }}/erd/

          Cloudflare Access で許可した人だけが開ける。コミット ${{ github.event.pull_request.head.sha }}"

      - name: 本番に出す
        if: github.event_name == 'push'
        working-directory: apps/docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy:production
