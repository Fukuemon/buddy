# pull request と issue のタイトルと本文の形を、scripts/check-issue-pr-body.mjs で確かめる。
# pull request は違反でチェックを失敗にする。issue は違反を 1 つのコメントで知らせ、直ったら消す。
# 規則は CONTRIBUTING.md の「issue と pull request」とスキル write-issue-pr にある。

name: issue と pull request の本文

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: issue-pr-body-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # textlint と規則だけが要るので、ワークスペースの全てのパッケージは入れない
      - run: pnpm install --frozen-lockfile --filter . --ignore-scripts
      - run: node --test scripts/check-issue-pr-body.test.mjs
      - run: node scripts/check-issue-pr-body.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # issue へのコメントに書き込みの権限が要るので、pull request の実行と分ける
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps: *steps
