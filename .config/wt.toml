# worktrunk（wt）のプロジェクトの設定。
# worktree ごとに compose のプロジェクトの名前とポートの組を .env に書き、worktree を並べて起動できるようにする。
# compose は .env を読み、mise は .env を環境変数に入れる（mise.toml の [env]）。

# worktree を消す前に、その worktree の compose を、DB の volume とビルドしたイメージごと消す。起動していなければ何もしない。
# フックは wt を流したシェルの環境変数を受け継ぎ、compose はシェルの環境変数を .env より優先する。
# 別の worktree の COMPOSE_PROJECT_NAME が残ったシェルから消すと、その worktree の環境を消してしまうので、消す worktree の .env の名前を明示して渡す。
# ブランチ名から計算し直さないのは、作った後にブランチ名を変えると、起動した環境の名前とずれるためである。.env が無ければ何もしない。
# --rmi local は compose の image で名前を付けた broker と schedule のイメージを消さないので、名前で消す。
# --rmi all は postgres などの取得したイメージも消し、メインの checkout の環境が使うイメージまで消えるので使わない。
# portless compose down は、compose を止めるのに加えて、portless に登録したホスト名も消す
pre-remove = '''
p=$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env 2>/dev/null)
[ -z "$p" ] || { COMPOSE_PROJECT_NAME="$p" mise exec -- portless compose -p "$p" down -v --remove-orphans --rmi local && docker image rm -f "$p-broker" "$p-schedule"; }
'''

# lefthook の commitlint と E2E が、worktree の node_modules を使う
post-start = "pnpm install --frozen-lockfile"

[pre-start]
# mise は信頼していないディレクトリの mise.toml を読まないので、worktree ごとに信頼する
trust = "mise trust --quiet"
# ブラウザが開く URL と E2E の URL は、portless compose up が出す https://<サービス>.<ホスト>.localhost にする（ADR-0034）。
# portless は、compose のプロジェクトの名前の _ を - にしてホスト名に使う。
# ポートの組は、portless が変えない postgres と valkey のポートに使う。HTTP のサービスのポートは portless が選び直す。
# ブランチ名のハッシュから 20000〜29980 の 20 刻みの先頭を決め、そこから順に割り当てる。
# 2 つの worktree の先頭が同じになる確率は 1/500 で、そのときは .env を手で直す。
env = '''
{% set project = "buddy-" ~ (branch | sanitize_db) -%}
{% set host = project | replace("_", "-") -%}
{% set base = ((branch | hash_port) % 500) * 20 + 20000 -%}
cat > .env <<EOF
COMPOSE_PROJECT_NAME={{ project }}
WEB_ORIGIN=https://web.{{ host }}.localhost
HYDRA_PUBLIC_ORIGIN=https://hydra.{{ host }}.localhost
BROKER_ORIGIN=https://broker.{{ host }}.localhost
IDP_ORIGIN=https://idp.{{ host }}.localhost
SESSION_COOKIE_SECURE=true
E2E_BASE_URL=https://web.{{ host }}.localhost
E2E_SCHEDULE_URL=https://schedule.{{ host }}.localhost
E2E_RECEIPT_URL=https://receipt.{{ host }}.localhost
E2E_BROKER_URL=https://broker.{{ host }}.localhost
E2E_BROKER_INTERNAL_URL=https://8081.broker.{{ host }}.localhost
E2E_HYDRA_URL=https://hydra.{{ host }}.localhost
E2E_CALENDARPIT_URL=https://calendarpit.{{ host }}.localhost
E2E_GCALHOLD_URL=https://gcalhold.{{ host }}.localhost
NODE_EXTRA_CA_CERTS=$HOME/.portless/ca.pem
WEB_PORT={{ base }}
SCHEDULE_PORT={{ base + 1 }}
RECEIPT_PORT={{ base + 2 }}
BROKER_PORT={{ base + 3 }}
BROKER_INTERNAL_PORT={{ base + 4 }}
HYDRA_PUBLIC_PORT={{ base + 5 }}
HYDRA_ADMIN_PORT={{ base + 6 }}
IDP_PORT={{ base + 7 }}
POSTGRES_PORT={{ base + 8 }}
VALKEY_PORT={{ base + 9 }}
CALENDARPIT_PORT={{ base + 10 }}
GCALHOLD_PORT={{ base + 11 }}
EOF
'''
