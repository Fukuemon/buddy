version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    generated: lax
    rules:
      # テストの接続の設定は、使い捨てのコンテナの値である。テストが読むファイルは、testdata の決まったファイルである。
      - path: _test\.go
        linters: [gosec]
        text: G101|G304
      # 照合の結果を比べる手元の道具は、開発者が引数で渡した CSV を読む。イメージに入れない。
      - path: apps/receipt-api/tools/
        linters: [gosec]
        text: G703

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Fukuemon/buddy
