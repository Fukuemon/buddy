# ランタイムとツールのバージョン。pnpm は package.json の packageManager と同じバージョンにする
# apm は agent-harness のスキルとフックを配置する
[tools]
node = "24"
pnpm = "10.27.0"
"pipx:apm-cli" = "0.32.0"
go = "1.27"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:golang-migrate/migrate" = "4.20.1"
golangci-lint = "2.15.0"
# uv はドキュメントサイトの Zensical を入れて動かす
uv = "0.13"
# tbls は予定の API のテーブル定義書を生成する（scripts/build-db-docs.sh）
"aqua:k1LoW/tbls" = "1.96.1"
# gh はエビデンスの動画を pull request と issue に添付する（--attach は 2.99 以降）
"aqua:cli/cli" = "2.102.1"

# worktree ごとのポートの組（.config/wt.toml が書く）を、compose 以外のコマンドにも渡す
[env]
_.file = ".env"
