# ランタイムとツールのバージョン。pnpm は package.json の packageManager と同じバージョンにする
# apm は agent-harness のスキルとフックを配置する
[tools]
node = "24"
pnpm = "10.27.0"
"pipx:apm-cli" = "0.35.0"
go = "1.27"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:golang-migrate/migrate" = "4.20.1"
golangci-lint = "2.15.0"
# uv はドキュメントサイトの Zensical を入れて動かす
uv = "0.13"
# tbls は予定の API のテーブル定義書を生成する（scripts/build-db-docs.sh）
"aqua:k1LoW/tbls" = "1.96.1"
# gh はエビデンスの動画を pull request と issue に添付する（--attach は 2.99 以降）
"aqua:cli/cli" = "2.102.1"
# portless はローカル環境の compose を、ホスト名の URL で出す（ADR-0036）
"npm:portless" = "0.16.0"

# worktree の .env は mise で読まない。mise exec と shim は、.env の値をコマンドの前で渡した値より優先するためである。
# .env を使う compose、E2E の設定、compose/dev-token.sh は、それぞれ .env を読む
[env]
# E2E が Node.js から portless の https の URL を呼ぶときに、portless の CA で検証する。main の checkout には .env が無いので、ここで渡す（ADR-0036）
NODE_EXTRA_CA_CERTS = "{{env.HOME}}/.portless/ca.pem"
